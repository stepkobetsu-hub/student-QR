<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087df0"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23087df0'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23ffd45c' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M25 22h9c6 0 10 3 10 8s-4 8-10 8h-5v8h-4V22zm4 4v8h5c4 0 6-1 6-4s-2-4-6-4h-5z' fill='%23123d73'/%3E%3C/svg%3E">
<title>ポイント管理</title>
<style>
:root{--blue:#087df0;--navy:#123d73;--green:#20a66a;--orange:#ef8614;--red:#c9362b;--bg:#eef7ff;--line:#d7e5f2;--muted:#66778b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#20334d;background:linear-gradient(#75dcfb 0,#e8f8ff 250px,var(--bg) 650px)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.head,.panel,.studentCard,.modalBox{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 28px #174c7a17}.head{padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center}.head h1{margin:0;color:var(--navy);font-size:clamp(24px,5vw,36px)}.staff{color:var(--muted);font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:#e8f2fb;color:var(--navy)}.btn.primary{background:var(--blue);color:#fff}.btn.grant{background:var(--green);color:#fff}.btn.use{background:var(--orange);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn:disabled{opacity:.5;cursor:wait}.panel{padding:16px;margin-top:14px}.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{width:100%;border:1px solid #b9cde0;border-radius:11px;padding:11px;background:#fff}.bulk{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.tableWrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%}th,td{padding:11px 8px;border-bottom:1px solid #e5edf4;text-align:left;font-size:14px}th{color:#486581;background:#f6faff;position:sticky;top:0}.num{text-align:right;font-weight:800}.cards{display:none}.studentCard{padding:14px;margin-top:10px}.cardTop{display:flex;justify-content:space-between;gap:10px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:3px 8px;border-radius:999px;background:#edf4fb;color:#486581;font-size:12px}.point{font-size:25px;color:var(--blue);font-weight:900}.modal{position:fixed;inset:0;background:#102a4377;display:grid;place-items:center;padding:12px;z-index:20}.modalBox{width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px}.modalBox h2{margin-top:0;color:var(--navy)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field.full{grid-column:1/-1}.confirm{background:#f5f9fd;border-radius:13px;padding:12px;margin:12px 0}.historyItem{border-bottom:1px solid var(--line);padding:11px 0}.historyHead{display:flex;justify-content:space-between;gap:8px}.plus{color:var(--green)}.minus{color:var(--orange)}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17395f;color:#fff;padding:12px 18px;border-radius:12px;z-index:30}.skeleton{height:62px;border-radius:12px;background:linear-gradient(90deg,#edf3f8,#fff,#edf3f8);background-size:200%;animation:p 1.2s infinite}@keyframes p{to{background-position:-200%}}@media(max-width:760px){.head{display:block}.actions{margin-top:12px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.tableWrap{display:none}.cards{display:block}.bulk{align-items:flex-start;flex-direction:column}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.btn{min-height:45px}}
.searchBox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}.searchBtn{background:var(--blue);color:#fff}.statusFilter{display:flex;gap:10px;justify-content:flex-end;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap}.statusFilter label{display:flex;gap:4px;align-items:center}.statusFilter input{width:auto}.historyGrant{background:#dff5e8;color:#137342}.historyUse{background:#ffedd8;color:#a65308}.modalBox{position:relative;padding-top:52px}.modalClose{position:absolute;right:14px;top:12px;width:40px;height:40px;padding:0;border-radius:50%;font-size:24px;line-height:1;background:#edf4fb;color:var(--navy)}.gradePicker{position:relative}.gradePicker summary{list-style:none;cursor:pointer;border:1px solid #b9cde0;border-radius:11px;padding:11px;background:#fff;font-weight:700}.gradePicker summary::-webkit-details-marker{display:none}.gradePicker summary:after{content:'▼';float:right;color:var(--muted);font-size:11px}.gradePicker[open] summary:after{content:'▲'}.gradeFilter{position:absolute;z-index:12;top:calc(100% + 5px);left:0;width:min(560px,90vw);display:flex;gap:8px 14px;flex-wrap:wrap;padding:12px;border:1px solid #b9cde0;border-radius:12px;background:#fff;box-shadow:0 10px 25px #17395f26}.gradeFilter label{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}.gradeFilter input{width:auto}.gradeGroup{font-weight:800;color:var(--navy)}.globalHistoryMeta{color:var(--muted);font-size:13px;margin-bottom:8px}.logoutSmall{padding:6px 9px;font-size:12px;min-height:32px;background:#e8f2fb;color:var(--navy)}@media(max-width:760px){.btn.logoutSmall{min-height:32px}.searchBox{grid-column:1/-1}.searchBox input{grid-column:auto}.gradePicker{grid-column:1/-1}.statusFilter{grid-column:1/-1;justify-content:flex-end}}

</style></head><body><main class="shell">
<header class="head"><div><h1>ポイント管理</h1><div id="staff" class="staff">認証を確認しています…</div></div><div class="actions"><a class="btn" href="https://stepkobetsu-hub.github.io/seiseki-kanri/">トップへ</a><button class="btn" id="settingsBtn">基本設定</button><button class="btn" id="reloadBtn">再読込</button><button class="btn logoutSmall" id="logoutBtn">ログアウト</button></div></header>
<section id="loading" class="panel"><div class="skeleton"></div><div class="skeleton" style="margin-top:10px"></div></section>
<section id="app" class="panel hidden"><div class="toolbar"><div class="searchBox"><input id="search" type="search" placeholder="生徒番号・氏名・よみ（ひらがな可）"><button class="btn searchBtn" id="searchBtn" type="button">検索</button></div><select id="campus"><option value="">すべての校舎</option><option>神領</option><option>大手</option></select><details id="gradePicker" class="gradePicker"><summary id="gradeSummary">全学年</summary><div id="gradeFilter" class="gradeFilter" aria-label="学年"></div></details><select id="sort"><option value="points">現在ポイント順</option><option value="name">氏名順</option><option value="grade">学年順</option><option value="code">コード順</option></select><div class="statusFilter" aria-label="在籍状態"><label><input id="showActive" type="checkbox" checked>在籍生</label><label><input id="showInactive" type="checkbox">退塾生</label></div></div>
<div class="bulk"><b><span id="selectedCount">0</span>人選択</b><div class="actions"><span><button class="btn grant" data-mode="special">特別ポイント付与</button><button class="btn historyGrant" data-history-mode="special">履歴</button></span><span><button class="btn use" data-mode="use">ポイント使用</button><button class="btn historyUse" data-history-mode="use">履歴</button></span><button class="btn primary" data-history-mode="attendance">レギュラー付与 履歴</button><button class="btn" data-history-mode="all">すべての履歴</button></div></div>
<div class="tableWrap"><table><thead><tr><th><label><input id="selectAll" type="checkbox" aria-label="表示中の生徒をすべて選択"> 選択</label></th><th>生徒番号</th><th>生徒名</th><th>在籍状態</th><th>校舎</th><th>学年</th><th class="num">現在</th><th class="num">今月付与</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div id="cards" class="cards"></div></section>
</main><div id="modal" class="modal hidden"><div id="modalBox" class="modalBox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw8L36Fj8SKtvNHQBi41FMqAPvDLGAdu1bbLxvd-78A8dFUOkWGnYRE-8PRNq7QZOl70w/exec',AUTH='stepStaffAppAuth',STAFF_TOP='https://stepkobetsu-hub.github.io/seiseki-kanri/?next=points';let auth,students=[],selected=new Set(),settings={},searchQuery='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return 'pm_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(2)).join('_')}
function isAuthError(message){return /セッション|期限切れ|認証|ログイン|権限/.test(String(message||''))}
function returnToLogin(){localStorage.removeItem(AUTH);location.replace(STAFF_TOP)}
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,systemPortalSessionToken:auth?.systemPortalSessionToken||'',staffLoginId:auth?.code||'',...data}),cache:'no-store',redirect:'follow'});const out=await r.json();if(!out.ok){const e=new Error(out.message||'処理に失敗しました。');e.authError=isAuthError(e.message);throw e}return out}
function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH)||'null');if(!a||!a.systemPortalSessionToken||!['2','3','4'].includes(String(a.permissionLevel)))return null;const expires=Date.parse(a.systemPortalExpiresAt||'');if(Number.isFinite(expires)&&expires<=Date.now())return null;return a}catch(e){return null}}
async function init(){auth=readAuth();if(!auth){returnToLogin();return}await load()}
async function load(){try{const out=await api('pointManagerBootstrap');students=out.students;settings=out.settings;$('staff').textContent=(auth.name||out.staff.name||auth.code)+' さん（AK='+auth.permissionLevel+'）';$('loading').classList.add('hidden');$('app').classList.remove('hidden');fillGrades();render()}catch(e){if(e.authError){returnToLogin();return}$('loading').innerHTML='<b style="color:#b42318">'+esc(e.message)+'</b>'}}
async function logout(){const token=auth?.systemPortalSessionToken||'';try{if(token)await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'logoutSystemPortal',systemPortalSessionToken:token}),cache:'no-store',redirect:'follow'})}catch(e){}returnToLogin()}
function fillGrades(){const hidden=/^(?:大[１-４1-4]|未就学児)$/;const actual=students.map(s=>s.grade).filter(g=>g&&!hidden.test(g)&&g!=='-');const grades=[...new Set(['小１',...actual])].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));const groups=[['clear','全解除'],['all','全学年'],['elementary','全小学生'],['middle','全中学生'],['high','全高校']];$('gradeFilter').innerHTML=groups.map(x=>`<label class="gradeGroup"><input type="checkbox" data-grade="${x[0]}" ${x[0]==='all'?'checked':''}>${x[1]}</label>`).join('')+grades.map(g=>`<label><input type="checkbox" data-grade="${esc(g)}">${esc(g)}</label>`).join('');$('gradeFilter').addEventListener('change',e=>{const key=e.target.dataset.grade,all=document.querySelector('[data-grade="all"]'),boxes=[...document.querySelectorAll('[data-grade]')],others=boxes.filter(x=>!['all','clear'].includes(x.dataset.grade));if(key==='clear'){boxes.forEach(x=>x.checked=false)}else if(key==='all'&&all.checked)others.forEach(x=>x.checked=false);else if(key!=='all'&&e.target.checked)all.checked=false;updateGradeSummary();render()});updateGradeSummary()}
function selectedGrades(){return [...document.querySelectorAll('[data-grade]:checked')].map(x=>x.dataset.grade).filter(x=>!['all','clear'].includes(x))}
function updateGradeSummary(){const selected=[...document.querySelectorAll('[data-grade]:checked')].filter(x=>x.dataset.grade!=='clear');$('gradeSummary').textContent=selected.some(x=>x.dataset.grade==='all')?'全学年':!selected.length?'-':selected.map(x=>x.parentElement.textContent.trim()).join('・')}
function matchesGrade(grade,filters){if(!filters.length)return true;return filters.some(f=>f==='elementary'?/^小/.test(grade):f==='middle'?/^中/.test(grade):f==='high'?/^高/.test(grade):grade===f)}
function searchText(value){return String(value||'').toLowerCase().normalize('NFKC').replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+96)).replace(/\s/g,'')}
function filtered(){const q=searchText(searchQuery),camp=$('campus').value,grades=selectedGrades(),showActive=$('showActive').checked,showInactive=$('showInactive').checked;let a=students.filter(s=>(!q||searchText(s.id+s.name+s.kana).includes(q))&&(!camp||s.campus.includes(camp))&&matchesGrade(s.grade,grades)&&((s.active&&showActive)||(!s.active&&showInactive)));const sort=$('sort').value;a.sort(sort==='name'?(x,y)=>x.name.localeCompare(y.name,'ja'):sort==='grade'?(x,y)=>x.grade.localeCompare(y.grade,'ja')||x.name.localeCompare(y.name,'ja'):sort==='code'?(x,y)=>String(x.id).localeCompare(String(y.id),'ja',{numeric:true}):(x,y)=>y.points-x.points||x.name.localeCompare(y.name,'ja'));return a}
function row(s){return `<tr><td><input type="checkbox" data-id="${esc(s.id)}" ${selected.has(s.id)?'checked':''}></td><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.status||'退塾')}</td><td>${esc(s.campus)}</td><td>${esc(s.grade)}</td><td class="num">${s.points}</td><td class="num">${s.monthPoints}</td><td><button class="btn" data-detail="${esc(s.id)}">詳細</button></td></tr>`}
function card(s){return `<article class="studentCard"><div class="cardTop"><label><input type="checkbox" data-id="${esc(s.id)}" ${selected.has(s.id)?'checked':''}> ${esc(s.name)}</label><span class="point">${s.points}pt</span></div><div>${esc(s.id)}</div><div class="chips"><span class="chip">${esc(s.status||'退塾')}</span><span class="chip">${esc(s.campus)}</span><span class="chip">${esc(s.grade)}</span><span class="chip">今月 +${s.monthPoints}</span></div><button class="btn" data-detail="${esc(s.id)}">詳細</button></article>`}
function render(){const visible=filtered(),visibleIds=visible.map(s=>s.id);$('tbody').innerHTML=visible.map(row).join('');$('cards').innerHTML=visible.map(card).join('');$('selectedCount').textContent=selected.size;const all=$('selectAll'),selectedVisible=visibleIds.filter(id=>selected.has(id)).length;all.checked=visibleIds.length>0&&selectedVisible===visibleIds.length;all.indeterminate=selectedVisible>0&&selectedVisible<visibleIds.length;all.onchange=()=>{visibleIds.forEach(id=>all.checked?selected.add(id):selected.delete(id));render()};document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);render()});document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>detail(x.dataset.detail))}
function openModal(html){$('modalBox').innerHTML=`<button class="btn modalClose" data-close aria-label="閉じる">×</button>${html}`;$('modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}function closeModal(){$('modal').classList.add('hidden')}
async function derivedGlobalHistory(mode){let next=0,history=[];async function worker(){while(next<students.length){const s=students[next++],out=await api('pointManagerStudent',{studentId:s.id,limit:100});out.history.forEach(h=>{if(mode==='all'||h.type==='入退室')history.push({...h,id:h.id||s.id,name:h.name||s.name})})}}await Promise.all(Array.from({length:Math.min(6,students.length)},worker));history.sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.row||0)-(a.row||0));return{history,count:history.length}}
async function globalHistory(mode){try{openModal('<h2>履歴を読み込んでいます…</h2><p class="globalHistoryMeta">全生徒の履歴を集計しています。</p>');const out=(mode==='attendance'||mode==='all')?await derivedGlobalHistory(mode):await api('pointManagerHistory',{mode});const titles={attendance:'レギュラー付与履歴',special:'特別ポイント付与履歴',use:'ポイント使用履歴',all:'すべての付与・使用履歴'},title=titles[mode]||'ポイント履歴';openModal(`<h2>${title}</h2><div class="globalHistoryMeta">全生徒・新しい順／${out.count}件</div><div>${out.history.map(h=>`<div class="historyItem"><div class="historyHead"><b>${esc(h.date)}　${esc(h.name)} <small>${esc(h.id)}</small></b><b class="${h.points<0?'minus':'plus'}">${h.points>0?'+':''}${h.points}</b></div><div><span class="chip">${esc(h.type==='入退室'?'レギュラー付与':h.type)}</span> ${esc(h.reason.replace(/^\[[^\]]+\](?:\[PM:[^\]]+\])?\s*/,''))}</div></div>`).join('')||'履歴はありません。'}</div>`)}catch(e){toast(e.message);closeModal()}}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function operation(mode,ids){if(!ids.length)return toast('対象生徒を選択してください。');const title=mode==='special'?'特別ポイント付与':'ポイント使用';openModal(`<h2>${title}</h2><div class="fields"><div class="field"><label>日付</label><input id="opDate" type="date" value="${today()}"></div><div class="field"><label>ポイント数</label><input id="opPoints" type="number" min="1" step="1"></div><div class="field full"><label>理由・コメント</label><textarea id="opReason" rows="3"></textarea></div></div><div class="actions"><button class="btn" data-close>戻る</button><button class="btn ${mode==='special'?'grant':'use'}" id="confirmOp">確認画面へ</button></div>`);$('confirmOp').onclick=()=>confirmOperation(mode,ids)}
function confirmOperation(mode,ids){const pts=Number($('opPoints').value),reason=$('opReason').value.trim(),date=$('opDate').value;if(!Number.isInteger(pts)||pts<=0||!reason||!date)return toast('日付・整数ポイント・理由を入力してください。');const targets=ids.map(id=>students.find(s=>s.id===id));const rows=targets.map(s=>{const change=mode==='use'?-Math.min(s.points,pts):pts;return `<tr><td>${esc(s.name)}</td><td class="num">${s.points}</td><td class="num ${change<0?'minus':'plus'}">${change>0?'+':''}${change}</td><td class="num">${Math.max(0,s.points+change)}</td></tr>`}).join('');openModal(`<h2>内容を確認</h2><p>対象 ${targets.length}人／${esc(date)}／${esc(reason)}</p><div class="tableWrap" style="display:block"><table><tr><th>生徒</th><th>変更前</th><th>増減</th><th>変更後</th></tr>${rows}</table></div><div class="actions"><button class="btn" data-close>戻る</button><button class="btn primary" id="saveOp">確定する</button></div>`);$('saveOp').onclick=async()=>{const b=$('saveOp');b.disabled=true;try{const out=await api('pointManagerApply',{requestId:uid(),mode,studentIds:ids,date,points:pts,reason});toast('保存しました。');selected.clear();closeModal();await load()}catch(e){toast(e.message);b.disabled=false}}}
async function detail(id,limit=20){try{const out=await api('pointManagerStudent',{studentId:id,limit});const s=out.student,m=out.summary;openModal(`<h2>${esc(s.name)} <small>${esc(s.id)}</small></h2><div class="chips"><span class="chip">${esc(s.campus)}</span><span class="chip">${esc(s.grade)}</span><span class="chip">${esc(s.status||'退塾')}</span></div><div class="confirm"><b>現在 ${m.total}pt</b><br>今月 ${m.month}／入退室 ${m.attendance}／特別 ${m.special}／使用 ${m.used}</div><div class="actions"><button class="btn grant" id="oneGrant">特別ポイント付与</button><button class="btn use" id="oneUse">ポイント使用</button><label for="historyLimit">表示数</label><select id="historyLimit" aria-label="履歴の表示数"><option>20</option><option>50</option><option>100</option></select></div><div>${out.history.map(h=>`<div class="historyItem"><div class="historyHead"><b>${esc(h.date)}・${esc(h.type)}</b><b class="${h.points<0?'minus':'plus'}">${h.points>0?'+':''}${h.points}</b></div><div>${esc(h.reason.replace(/\[PM:[^\]]+\]/,''))}</div>${h.editable?`<button class="btn" data-edit="${esc(h.operationId)}" data-id="${esc(id)}">編集・取消</button>`:''}</div>`).join('')||'履歴はありません。'}</div>`);$('oneGrant').onclick=()=>operation('special',[id]);$('oneUse').onclick=()=>operation('use',[id]);$('historyLimit').value=String(limit);$('historyLimit').onchange=e=>detail(id,Number(e.target.value));document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>editDialog(id,x.dataset.edit))}catch(e){toast(e.message)}}
async function editDialog(id,op){const out=await api('pointManagerStudent',{studentId:id,limit:100}),h=out.history.find(x=>x.operationId===op);if(!h)return toast('記録が見つかりません。');openModal(`<h2>履歴の編集</h2><div class="confirm">${esc(h.date)}／${h.points>0?'+':''}${h.points}<br>${esc(h.reason)}</div><div class="fields"><div class="field"><label>日付</label><input id="editDate" type="date" value="${esc(h.date)}"></div><div class="field"><label>ポイント（使用は負数）</label><input id="editPoints" type="number" step="1" value="${h.points}"></div><div class="field full"><label>コメント</label><textarea id="editReason">${esc(h.reason.replace(/^\[[^\]]+\]\[PM:[^\]]+\]\s*/,''))}</textarea></div></div><div class="actions"><button class="btn" data-close>戻る</button><button class="btn primary" id="editSave">更新確認</button><button class="btn danger" id="cancelSave">取消確認</button></div>`);$('editSave').onclick=()=>saveRevision(false,id,op);$('cancelSave').onclick=()=>saveRevision(true,id,op)}
async function saveRevision(cancel,id,op){const date=$('editDate').value,points=Number($('editPoints').value),reason=$('editReason').value.trim();if(!reason||(!cancel&&(!Number.isInteger(points)||!points)))return toast('入力内容を確認してください。');openModal(`<h2>${cancel?'取消':'更新'}確認</h2><div class="confirm">元記録を残し、相殺記録${cancel?'':'と訂正後記録'}を追加します。</div><button class="btn" data-close>戻る</button> <button class="btn ${cancel?'danger':'primary'}" id="finalRev">確定する</button>`);$('finalRev').onclick=async()=>{const b=$('finalRev');b.disabled=true;try{await api(cancel?'pointManagerCancel':'pointManagerEdit',{requestId:uid(),operationId:op,date,points,reason});toast('更新しました。');closeModal();await load();detail(id)}catch(e){toast(e.message);b.disabled=false}}}
async function settingsDialog(){try{const out=await api('pointManagerGetSettings'),s=out.settings;openModal(`<h2>基本設定</h2><div class="fields"><div class="field"><label>ポイント付与</label><select id="setEnabled"><option value="true">有効</option><option value="false">無効</option></select></div><div class="field"><label>付与タイミング</label><select id="setTiming"><option value="exit">退室時</option><option value="entry">入室時</option></select></div><div class="field"><label>付与制限</label><select id="setLimit"><option value="once">1日1回まで</option><option value="none">制限なし</option></select></div><div class="field"><label>必要滞在時間（分）</label><input id="setMinutes" type="number" min="0" step="1" value="${s.minMinutes}"></div><div class="field"><label>付与ポイント数</label><input id="setPoints" type="number" min="1" step="1" value="${s.perVisit}"></div></div><div class="actions"><button class="btn" data-close>閉じる</button>${out.canEdit?'<button class="btn primary" id="setConfirm">確認画面へ</button>':''}</div>`);$('setEnabled').value=String(s.enabled);$('setTiming').value=s.timing;$('setLimit').value=s.dailyLimit;if(out.canEdit)$('setConfirm').onclick=()=>confirmSettings(s)}catch(e){toast(e.message)}}
function confirmSettings(before){const next={enabled:$('setEnabled').value==='true',timing:$('setTiming').value,dailyLimit:$('setLimit').value,minMinutes:Number($('setMinutes').value),perVisit:Number($('setPoints').value)};if(!Number.isInteger(next.minMinutes)||next.minMinutes<0||!Number.isInteger(next.perVisit)||next.perVisit<1)return toast('設定値を確認してください。');openModal(`<h2>設定変更の確認</h2><div class="confirm">付与 ${next.enabled?'有効':'無効'}／${next.timing==='exit'?'退室時':'入室時'}／${next.dailyLimit==='once'?'1日1回':'制限なし'}／${next.minMinutes}分／${next.perVisit}pt</div><button class="btn" data-close>戻る</button> <button class="btn primary" id="saveSettings">確定する</button>`);$('saveSettings').onclick=async()=>{const b=$('saveSettings');b.disabled=true;try{await api('pointManagerSaveSettings',{requestId:uid(),settings:next});toast('設定を保存しました。');closeModal();await load()}catch(e){toast(e.message);b.disabled=false}}}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function applySearch(){searchQuery=$('search').value;render()}$('searchBtn').onclick=applySearch;$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applySearch()}});document.addEventListener('click',e=>{const picker=$('gradePicker');if(picker.open&&!picker.contains(e.target))picker.open=false});['campus','sort','showActive','showInactive'].forEach(id=>$(id).addEventListener('change',render));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>operation(b.dataset.mode,[...selected]));document.querySelectorAll('[data-history-mode]').forEach(b=>b.onclick=()=>globalHistory(b.dataset.historyMode));$('reloadBtn').onclick=load;$('settingsBtn').onclick=settingsDialog;$('logoutBtn').onclick=logout;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};init();
</script></body></html>
