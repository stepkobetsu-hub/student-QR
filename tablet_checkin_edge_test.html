<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10243e">
  <title>Cloudflare受付テスト | STEP</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07111f; color: #fff; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 18px; }
    main { width: min(100%, 720px); }
    h1 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 34px); }
    .notice { margin: 0 0 16px; color: #b7cae7; }
    .card { padding: 18px; border: 1px solid #294263; border-radius: 18px; background: #10243e; box-shadow: 0 18px 50px #0007; }
    .grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; font-size: 14px; color: #cad8ec; }
    input, select, button { min-height: 48px; border-radius: 12px; font: inherit; }
    input, select { width: 100%; border: 1px solid #526c8f; padding: 0 12px; color: #fff; background: #07111f; }
    button { border: 0; padding: 0 18px; font-weight: 700; color: #07111f; background: #79e1bb; cursor: pointer; }
    button.secondary { color: #dce9fa; background: #294263; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .camera { position: relative; display: none; overflow: hidden; aspect-ratio: 4 / 3; margin-top: 16px; border-radius: 18px; background: #000; }
    .camera.active { display: block; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); -webkit-transform: scaleX(-1); }
    .frame { position: absolute; right: 4%; bottom: 10%; width: min(46%, 480px); height: min(36%, 260px); border: 4px solid #fff; border-radius: 18px; box-shadow: 0 0 0 999px #0006; }
    .frame::after { content: 'ここにQRをかざす'; position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); white-space: nowrap; padding: 4px 10px; border-radius: 999px; color: #fff; background: #0009; font-size: 14px; }
    canvas { display: none; }
    .result { display: none; margin-top: 16px; padding: 22px; border-radius: 18px; text-align: center; }
    .result.show { display: block; }
    .result.ok { color: #06281d; background: #79e1bb; }
    .result.duplicate { color: #2e2200; background: #ffd86a; }
    .result.error { background: #a9323c; }
    .result strong { display: block; font-size: clamp(28px, 8vw, 52px); }
    .result .type { margin-top: 4px; font-size: clamp(22px, 6vw, 36px); font-weight: 800; }
    .status { min-height: 24px; margin-top: 12px; color: #b7cae7; }
    .badge { display: inline-block; margin-bottom: 10px; padding: 5px 10px; border-radius: 999px; color: #ffe69a; background: #6b4b00; font-size: 13px; font-weight: 700; }
    .auth { min-height: 48px; display: grid; place-items: center; padding: 0 16px; border: 1px solid #27745d; border-radius: 12px; color: #79e1bb; background: #0a3028; font-weight: 800; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <span class="badge">試験専用・本番の記録／メール送信なし</span>
  <h1>Cloudflare受付テスト</h1>
  <p class="notice">名簿照合・入退室判定・60秒重複・複数端末の動作だけを確認します。</p>

  <section class="card" id="settings">
    <div class="grid">
      <label>校舎
        <select id="campus">
          <option value="jinryo">神領</option>
          <option value="otemachi">大手町</option>
        </select>
      </label>
      <div class="auth" id="authStatus">試験認証を確認中…</div>
    </div>
    <div class="actions">
      <button id="start" type="button">カメラを開始</button>
      <button id="stop" class="secondary" type="button">停止</button>
    </div>
  </section>

  <section class="camera" id="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="frame" aria-hidden="true"></div>
    <canvas id="canvas"></canvas>
  </section>
  <section class="result" id="result" aria-live="polite">
    <strong id="name"></strong>
    <div class="type" id="type"></div>
    <div id="detail"></div>
  </section>
  <div class="status" id="status" role="status">設定して「カメラを開始」を押してください。</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const API_URL = 'https://step-checkin-edge-staging.stepkobetsu.workers.dev/v1/checkins';
const campusEl = document.getElementById('campus');
const authStatusEl = document.getElementById('authStatus');
const cameraEl = document.getElementById('camera');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const context = canvas.getContext('2d', { willReadFrequently: true });
const resultEl = document.getElementById('result');
const nameEl = document.getElementById('name');
const typeEl = document.getElementById('type');
const detailEl = document.getElementById('detail');
const statusEl = document.getElementById('status');

const bootstrapParams = new URLSearchParams(location.hash.slice(1));
const bootstrapToken = bootstrapParams.get('token');
if (bootstrapToken) {
  sessionStorage.setItem('edgeTerminalToken', bootstrapToken);
  history.replaceState(null, '', location.pathname + location.search);
}

let stream = null;
let running = false;
let requestInFlight = false;
let decodeInFlight = false;
let lastFrameAt = 0;
let decodedFrames = 0;
let lastProgressAt = 0;
let barcodeDetector = null;
const deviceId = sessionStorage.getItem('edgeDeviceId') ||
  ('edge-test-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)));
sessionStorage.setItem('edgeDeviceId', deviceId);
campusEl.value = sessionStorage.getItem('edgeCampus') || 'jinryo';
let terminalToken = sessionStorage.getItem('edgeTerminalToken') || '';
authStatusEl.textContent = terminalToken ? '試験認証：設定済み' : '試験認証：未設定';
if (terminalToken) statusEl.textContent = 'カメラを自動で開始します。開始しない場合だけボタンを押してください。';

document.getElementById('start').addEventListener('click', () => void startCamera(false));
document.getElementById('stop').addEventListener('click', stopCamera);
campusEl.addEventListener('change', () => sessionStorage.setItem('edgeCampus', campusEl.value));
window.addEventListener('pagehide', stopCamera);
window.addEventListener('load', () => {
  void prepareBarcodeDetector();
  if (terminalToken) setTimeout(() => void startCamera(true), 250);
});
window.addEventListener('error', (event) => {
  running = false;
  nameEl.textContent = 'QR解析でエラーが発生しました';
  typeEl.textContent = '';
  detailEl.textContent = String(event && event.message || 'CLIENT_ERROR');
  resultEl.className = 'result show error';
  statusEl.textContent = 'この表示は自動で消えません。';
});

async function prepareBarcodeDetector() {
  if (!('BarcodeDetector' in window)) return;
  try {
    const formats = typeof window.BarcodeDetector.getSupportedFormats === 'function'
      ? await window.BarcodeDetector.getSupportedFormats()
      : ['qr_code'];
    if (formats.includes('qr_code')) barcodeDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
  } catch (ignore) {
    barcodeDetector = null;
  }
}

async function startCamera(automatic) {
  if (!terminalToken) {
    statusEl.textContent = '試験認証がありません。新しい試験用リンクを開いてください。';
    return;
  }
  sessionStorage.setItem('edgeCampus', campusEl.value);
  if (stream && video.srcObject) {
    running = true;
    requestInFlight = false;
    decodeInFlight = false;
    decodedFrames = 0;
    resultEl.className = 'result';
    cameraEl.classList.add('active');
    document.getElementById('start').textContent = '読取を再開';
    statusEl.textContent = 'QRコードを枠内にかざしてください。';
    requestAnimationFrame(scanFrame);
    return;
  }
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 12, max: 20 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    const track = stream.getVideoTracks()[0];
    if (track && typeof track.getCapabilities === 'function') {
      const caps = track.getCapabilities();
      if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (ignore) {}
      }
    }
    running = true;
    requestInFlight = false;
    decodeInFlight = false;
    decodedFrames = 0;
    cameraEl.classList.add('active');
    document.getElementById('start').textContent = '読取を再開';
    statusEl.textContent = 'QRコードを枠内にかざしてください。';
    requestAnimationFrame(scanFrame);
  } catch (error) {
    statusEl.textContent = automatic
      ? '自動開始できませんでした。「カメラを開始」を押してください。'
      : 'カメラを開始できません。ブラウザのカメラ許可を確認してください。';
  }
}

function stopCamera() {
  running = false;
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
  cameraEl.classList.remove('active');
}

async function scanFrame(now) {
  if (!running) return;
  requestAnimationFrame(scanFrame);
  if (requestInFlight || decodeInFlight || now - lastFrameAt < 100) return;
  lastFrameAt = now;
  if (video.readyState < video.HAVE_CURRENT_DATA || !video.videoWidth || !video.videoHeight) return;
  decodeInFlight = true;
  const scale = Math.min(1, 1280 / video.videoWidth, 720 / video.videoHeight);
  canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
  canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  let code = null;
  try {
    if (barcodeDetector) {
      try {
        const detected = await barcodeDetector.detect(canvas);
        if (detected && detected[0] && detected[0].rawValue) code = { data: detected[0].rawValue };
      } catch (ignore) {
        barcodeDetector = null;
      }
    }
    if (!code) {
      if (typeof jsQR !== 'function') throw new Error('QR_READER_NOT_LOADED');
      const image = context.getImageData(0, 0, canvas.width, canvas.height);
      code = jsQR(image.data, image.width, image.height, { inversionAttempts: 'attemptBoth' });
    }
    decodedFrames += 1;
    if (!code && now - lastProgressAt > 1000) {
      lastProgressAt = now;
      statusEl.textContent = 'QRを探しています… 映像解析 ' + decodedFrames + '回';
    }
  } catch (error) {
    running = false;
    nameEl.textContent = 'QR解析を開始できませんでした';
    detailEl.textContent = '画面を再読込してください。（' + (error && error.message || 'QR_READER_ERROR') + '）';
    resultEl.className = 'result show error';
    statusEl.textContent = 'この表示は自動で消えません。';
    return;
  } finally {
    decodeInFlight = false;
  }
  if (code && code.data) void submitQr(code.data);
}

async function submitQr(qrKey) {
  requestInFlight = true;
  running = false;
  resultEl.className = 'result';
  statusEl.textContent = 'Cloudflareで照合しています…';
  const receiptId = crypto.randomUUID ? crypto.randomUUID() :
    ('edge-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + terminalToken,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        campus: campusEl.value,
        qrKey: String(qrKey).trim(),
        receiptId,
        deviceId
      })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.code || ('HTTP_' + response.status));
    nameEl.textContent = (data.name || '受付完了') + (data.role === 'teacher' ? ' 先生' : ' さん');
    typeEl.textContent = data.type || '';
    detailEl.textContent = data.duplicate
      ? '60秒以内の重複読取です。状態は変更していません。'
      : 'Cloudflare側の判定を受け付けました。';
    resultEl.className = 'result show ' + (data.duplicate ? 'duplicate' : 'ok');
    statusEl.textContent = '結果を確認後、「読取を再開」を押してください。受付ID: ' + receiptId.slice(-8);
  } catch (error) {
    const code = error && error.message || 'UNKNOWN';
    nameEl.textContent = '受付できませんでした';
    typeEl.textContent = '';
    detailEl.textContent = code === 'SUBJECT_NOT_FOUND'
      ? 'この校舎の同期名簿にQRがありません。校舎選択を確認してください。（SUBJECT_NOT_FOUND）'
      : code === 'UNAUTHORIZED'
        ? '試験認証が一致しません。新しい試験用リンクを開き直してください。（UNAUTHORIZED）'
        : '接続を確認してください。（' + code + '）';
    resultEl.className = 'result show error';
    statusEl.textContent = '表示は自動で消えません。確認後、「読取を再開」を押してください。';
  } finally {
    document.getElementById('start').textContent = '読取を再開';
  }
}
</script>
</body>
</html>
