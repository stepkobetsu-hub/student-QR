<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d5b">
<title>試験ページ終了 | 個別指導STEP</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(145deg, #eef8f3, #e8f2ff);
    color: #19372d;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  main {
    width: min(620px, 100%);
    padding: 42px 30px;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 18px 50px rgba(26, 78, 60, .14);
    text-align: center;
  }
  .mark { font-size: 58px; line-height: 1; }
  h1 { margin: 18px 0 12px; font-size: clamp(26px, 5vw, 38px); }
  p { margin: 8px 0; font-size: clamp(16px, 3vw, 20px); line-height: 1.7; }
  .note { margin-top: 22px; color: #5b6e68; font-size: 15px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✅</div>
  <h1>試験ページは終了しました</h1>
  <p>Cloudflare受付試験は合格し、このページからのQR読取を停止しました。</p>
  <p class="note">本番用タブレット画面をご利用ください。</p>
</main>
</body>
</html>
