<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#143f67">
  <title>自分のQR | STEP塾生アプリ</title>
  <link rel="icon" href="my-qr-icon.svg" type="image/svg+xml">
  <script>performance.mark('myqr:html-start')</script>
  <style>
    :root{--navy:#123d68;--blue:#087df0;--sky:#20aaf7;--pink:#ff8fa3;--yellow:#ffd75f;--text:#172536;--muted:#66788b;--line:#d9eaf6;--ok:#177245}
    *{box-sizing:border-box}html{background:#dff5ff}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 8%,rgba(255,255,255,.95) 0 45px,transparent 46px),radial-gradient(circle at 92% 15%,rgba(255,235,240,.95) 0 70px,transparent 71px),linear-gradient(#91e5fb 0,#e7f9ff 310px,#f8fcff 70%,#edfff2 100%)}
    button,input{-webkit-tap-highlight-color:transparent;font:inherit}.app{width:min(100% - 28px,520px);margin:auto;padding:calc(14px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;min-height:42px;margin-bottom:12px}.back{color:var(--navy);text-decoration:none;font-weight:900;font-size:14px}.brand{margin-left:auto;font-size:12px;color:#365d7e;font-weight:800}.top-logout{border:2px solid rgba(18,61,104,.16);border-radius:999px;background:rgba(255,255,255,.9);color:var(--navy);padding:8px 11px;font-size:12px;font-weight:900}.card{background:rgba(255,255,255,.97);border:2px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 18px 44px rgba(25,86,126,.15);padding:24px}.hidden{display:none!important}h1{margin:0 0 8px;font-size:25px}p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}.field{display:grid;gap:7px;margin-top:18px;font-size:13px;font-weight:800}.field input{width:100%;min-height:50px;border:1px solid #cbd8e4;border-radius:13px;padding:0 14px;background:#fff;color:var(--text)}.field input:focus{outline:3px solid #d9ebfb;border-color:var(--blue)}.primary{width:100%;min-height:51px;border:0;border-radius:14px;font-weight:900;margin-top:20px;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}.primary:disabled{opacity:.55}.message{min-height:22px;margin-top:13px;font-size:13px;line-height:1.55}.error{color:#b3262b}.success{color:var(--ok)}.privacy{margin-top:17px;padding:12px;border-radius:13px;background:#f4f7fa;font-size:12px;color:var(--muted);line-height:1.65}.qr-card{text-align:center;overflow:hidden;position:relative}.qr-card:before,.qr-card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.qr-card:before{width:58px;height:58px;left:-19px;top:125px;background:#fff2b8}.qr-card:after{width:48px;height:48px;right:-15px;top:175px;background:#ffe0e7}.qr-heading{position:relative;margin:-24px -24px 18px;padding:18px 24px 16px;background:linear-gradient(120deg,var(--blue),var(--sky));color:#fff;overflow:hidden}.qr-heading:before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-30px;top:-52px;background:rgba(255,255,255,.18)}.qr-heading-row{display:flex;align-items:center;justify-content:center;gap:11px}.qr-mark{display:inline-grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:3px}.qr-mark i{border:2px solid #fff;border-radius:2px}.qr-mark i:nth-child(2){border:0}.qr-mark i:nth-child(3){grid-column:3}.qr-mark i:nth-child(4){grid-row:3}.eyebrow{font-size:17px;font-weight:900;letter-spacing:.04em}.qr-subtitle{margin-top:4px;color:rgba(255,255,255,.9);font-size:11px;font-weight:800}.student-name{font-size:24px;font-weight:900;margin:7px 0 5px}.student-details{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}.student-details span{padding:5px 10px;border-radius:999px;background:#eef8ff;color:#547087;font-size:12px;font-weight:800}.student-details .student-id{color:var(--navy);background:#e7f4ff}.qr-stage{position:relative;width:fit-content;max-width:100%;margin:15px auto 48px}.qr-wrap{display:grid;place-items:center;min-height:286px;margin:0 auto;padding:17px;border:3px solid #b9ddf5;border-radius:27px;background:#fff;box-shadow:0 12px 28px rgba(20,86,128,.14)}.qr-wrap canvas,.qr-wrap img{width:min(100%,252px)!important;height:auto!important;image-rendering:pixelated}.attendance-panel{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,252px);margin-top:12px}.attendance-item{padding:8px 6px;border-radius:12px;background:#f1f8ff;color:#5f7185;font-size:10px;font-weight:800}.attendance-item b{display:block;margin-top:2px;color:var(--navy);font-size:15px}.mascot{position:absolute;right:-7px;bottom:-46px;width:58px;height:58px;filter:drop-shadow(0 5px 5px rgba(30,70,100,.16));pointer-events:none}.notice{padding:18px;border-radius:17px;background:#fff6df;color:#725517;font-size:14px;line-height:1.7;text-align:left}.session-note{font-size:10px;color:#8291a1;line-height:1.55}.return-button{display:inline-grid;place-items:center;min-width:min(100%,260px);min-height:48px;margin-top:12px;padding:0 36px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;text-decoration:none;font-size:13px;font-weight:900;box-shadow:0 8px 19px rgba(23,116,174,.2)}.loading{display:grid;place-items:center;min-height:330px;text-align:center}.spinner{width:42px;height:42px;border:4px solid #dfe8f0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:390px){.app{width:min(100% - 20px,520px)}.card{padding:19px}.qr-heading{margin:-19px -19px 14px;padding:15px 19px}.qr-wrap{min-height:270px;padding:12px}.student-name{font-size:22px}.mascot{width:52px;height:52px;right:-4px;bottom:-42px}.eyebrow{font-size:16px}}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><a class="back" href="https://stepkobetsu-hub.github.io/step-hub/" target="_top">← 塾生アプリ</a><span class="brand">個別指導STEP</span><button id="logoutButton" class="top-logout hidden" type="button">ログアウト</button></div>

  <section id="loadingPanel" class="card loading">
    <div><div class="spinner" aria-hidden="true"></div><h1>自分のQR</h1><p>ログイン状態を確認しています…</p></div>
  </section>

  <section id="loginPanel" class="card hidden">
    <h1>自分のQR</h1>
    <p>初回だけ、生徒番号とパスワードで本人確認します。</p>
    <form id="loginForm" autocomplete="off">
      <label class="field">生徒番号<input id="studentId" inputmode="numeric" autocomplete="off" required></label>
      <label class="field">パスワード<input id="password" type="password" autocomplete="off" required></label>
      <button id="loginButton" class="primary" type="submit">ログインしてQRを表示</button>
    </form>
    <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>
    <div class="privacy">パスワードはこの端末に保存しません。認証後は6時間有効なセッショントークンだけを保存します。</div>
  </section>

  <section id="qrPanel" class="card qr-card hidden">
    <div class="qr-heading"><div class="qr-heading-row"><span class="qr-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div class="eyebrow">わたしのQRコード</div></div><div class="qr-subtitle">教室についたら読み取ってね</div></div>
    <div id="studentName" class="student-name"></div>
    <div class="student-details"><span id="studentIdDisplay" class="student-id"></span><span id="campus"></span></div>
    <div class="qr-stage"><div id="qrWrap" class="qr-wrap"></div><svg class="mascot" viewBox="0 0 72 72" aria-hidden="true"><ellipse cx="36" cy="37" rx="24" ry="28" fill="#24568c"/><ellipse cx="36" cy="42" rx="17" ry="21" fill="#fff"/><circle cx="29" cy="29" r="2.5" fill="#20334d"/><circle cx="43" cy="29" r="2.5" fill="#20334d"/><path d="M32 34h8l-4 5z" fill="#f6ad35"/><ellipse cx="24" cy="64" rx="8" ry="3" fill="#f6ad35"/><ellipse cx="48" cy="64" rx="8" ry="3" fill="#f6ad35"/><rect x="46" y="39" width="15" height="19" rx="2" fill="#63c98c" transform="rotate(-8 53.5 48.5)"/><path d="M49 43l9 11" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 39c-7 5-6 14 1 17" fill="none" stroke="#24568c" stroke-width="7" stroke-linecap="round"/></svg></div>
    <p id="sessionNote" class="session-note"></p>
    <a class="return-button" href="https://stepkobetsu-hub.github.io/step-hub/" target="_top">STEP塾生アプリに戻る</a>
  </section>
</main>

<script src="my_qr_runtime.js" onload="performance.mark('myqr:api-url-ready')"></script>
<script src="vendor/qrcode.min.js" onload="performance.mark('myqr:qr-library-ready')"></script>
<script>
const TOKEN_KEY = 'stepMyQrSessionToken';
const EXPIRES_KEY = 'stepMyQrSessionExpiresAt';
const COMMON_TOKEN_KEY = 'stepCommonStudentSessionToken';
const COMMON_EXPIRES_KEY = 'stepCommonStudentSessionExpiresAt';
const QR_CACHE_KEY = 'stepMyQrDisplayCacheV3';
const LEGACY_QR_CACHE_KEY = 'stepMyQrDisplayCache';
const QR_CACHE_MAX_AGE_MS = 15 * 60 * 1000;
const API_URL = String(window.STEP_MY_QR_API_URL || '');
const $ = id => document.getElementById(id);
let lastRenderedQrData = '';
let attendanceRefreshTimer = null;

function mark(name) { try { performance.mark(name); } catch (error) {} }
function measure(name, start, end) { try { performance.measure(name, start, end); } catch (error) {} }

function showPanel(name) {
  ['loadingPanel','loginPanel','qrPanel'].forEach(id => $(id).classList.toggle('hidden', id !== name));
  $('logoutButton').classList.toggle('hidden', name !== 'qrPanel');
}

function readSession() {
  const token = localStorage.getItem(TOKEN_KEY) || '';
  const expiresAt = localStorage.getItem(EXPIRES_KEY) || '';
  return token && expiresAt ? { token, expiresAt } : null;
}

function getPreferredSession() {
  const common = readCommonSession();
  if (common) return { ...common, kind: 'common' };
  const qr = readSession();
  return qr && new Date(qr.expiresAt).getTime() > Date.now() ? { ...qr, kind: 'qr' } : null;
}

function saveSession(token, expiresAt) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(EXPIRES_KEY, expiresAt);
}

function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(EXPIRES_KEY);
  clearQrCache();
}

function clearQrCache() {
  try {
    localStorage.removeItem(QR_CACHE_KEY);
    sessionStorage.removeItem(LEGACY_QR_CACHE_KEY);
  } catch (error) {}
}

async function tokenFingerprint(token) {
  const bytes = new TextEncoder().encode(token);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
}

async function readQrCache(session) {
  try {
    const cached = JSON.parse(localStorage.getItem(QR_CACHE_KEY) || 'null');
    const now = Date.now();
    const sessionExpires = new Date(session.expiresAt).getTime();
    if (!cached || cached.sessionKind !== session.kind || cached.fingerprint !== await tokenFingerprint(session.token) || cached.cachedUntil <= now || sessionExpires <= now) {
      clearQrCache();
      return null;
    }
    return cached.result;
  } catch (error) {
    clearQrCache();
    return null;
  }
}

async function saveQrCache(session, result) {
  const sessionExpires = new Date(session.expiresAt).getTime();
  const cachedUntil = Math.min(sessionExpires, Date.now() + QR_CACHE_MAX_AGE_MS);
  if (!Number.isFinite(cachedUntil) || cachedUntil <= Date.now()) return clearQrCache();
  try {
    const safeResult = { studentId: result.studentId || '', name: result.name || '', campus: result.campus || '', registered: !!result.registered, qrData: result.qrData || '', attendance: result.attendance || null, expiresAt: session.expiresAt };
    localStorage.setItem(QR_CACHE_KEY, JSON.stringify({ sessionKind: session.kind, fingerprint: await tokenFingerprint(session.token), cachedUntil, result: safeResult }));
  } catch (error) {}
}

function readCommonSession() {
  const token = localStorage.getItem(COMMON_TOKEN_KEY) || '';
  const expiresAt = localStorage.getItem(COMMON_EXPIRES_KEY) || '';
  return token && expiresAt && new Date(expiresAt).getTime() > Date.now() ? { token, expiresAt } : null;
}

function saveCommonSession(token, expiresAt) {
  localStorage.setItem(COMMON_TOKEN_KEY, token);
  localStorage.setItem(COMMON_EXPIRES_KEY, expiresAt);
}

function clearCommonSession() {
  localStorage.removeItem(COMMON_TOKEN_KEY);
  localStorage.removeItem(COMMON_EXPIRES_KEY);
}

async function api(payload) {
  if (!API_URL || API_URL === '__MY_QR_API_URL__') throw new Error('接続設定を確認できませんでした。');
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  });
  if (!response.ok) throw new Error('サーバーに接続できませんでした。');
  const result = await response.json();
  if (!result.ok) {
    const error = new Error(result.message || '処理に失敗しました。');
    error.code = result.code || '';
    throw error;
  }
  return result;
}

async function loadMyQr() {
  mark('myqr:load-start');
  const session = getPreferredSession();
  if (!session) {
    clearSession();
    clearCommonSession();
    showPanel('loginPanel');
    return;
  }
  const cached = await readQrCache(session);
  if (cached) {
    renderMyQr(cached, true);
    mark('myqr:cache-rendered');
    measure('html-to-cache-qr', 'myqr:html-start', 'myqr:cache-rendered');
  }
  try {
    const apiMark = session.kind === 'common' ? 'common-get' : 'qr-get';
    mark('myqr:' + apiMark + '-start');
    const result = session.kind === 'common'
      ? await api({ action: 'myQrCommonGet', commonToken: session.token })
      : await api({ action: 'myQrGet', token: session.token });
    mark('myqr:' + apiMark + '-end');
    measure(apiMark + '-api', 'myqr:' + apiMark + '-start', 'myqr:' + apiMark + '-end');
    if (session.kind === 'qr' && result.expiresAt) saveSession(session.token, result.expiresAt);
    const refreshed = getPreferredSession() || session;
    await saveQrCache(refreshed, result);
    renderMyQr({ ...result, expiresAt: refreshed.expiresAt }, false, !!cached);
    mark('myqr:complete');
    measure('html-to-complete', 'myqr:html-start', 'myqr:complete');
  } catch (error) {
    clearAllSessions();
    clearQrVisual();
    showPanel('loginPanel');
    $('loginMessage').className = 'message error';
    $('loginMessage').textContent = error.message || 'もう一度ログインしてください。';
  }
}

async function refreshAttendance() {
  const session = getPreferredSession();
  if (!session || document.hidden || $('qrPanel').classList.contains('hidden')) return;
  try {
    const result = session.kind === 'common'
      ? await api({ action: 'myQrCommonGet', commonToken: session.token })
      : await api({ action: 'myQrGet', token: session.token });
    renderAttendance(result.attendance);
    const refreshed = getPreferredSession() || session;
    await saveQrCache(refreshed, result);
  } catch (error) {}
}

function startAttendanceRefresh() {
  if (attendanceRefreshTimer) clearInterval(attendanceRefreshTimer);
  attendanceRefreshTimer = setInterval(refreshAttendance, 10000);
}

function renderAttendance(attendance) {
  const wrap = $('qrWrap');
  let panel = wrap.querySelector('.attendance-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'attendance-panel';
    panel.innerHTML = '<div class="attendance-item">本日の入塾<b data-entry>―</b></div><div class="attendance-item">本日の退塾<b data-exit>―</b></div>';
    wrap.appendChild(panel);
  }
  panel.querySelector('[data-entry]').textContent = attendance && attendance.entryAt ? attendance.entryAt : '―';
  panel.querySelector('[data-exit]').textContent = attendance && attendance.exitAt ? attendance.exitAt : '―';
}

function clearQrVisual() {
  $('qrWrap').replaceChildren();
  lastRenderedQrData = '';
}

function renderMyQr(result, validating = false, reuseExisting = false) {
  $('studentName').textContent = result.name ? result.name + ' さん' : '自分のQR';
  $('studentIdDisplay').textContent = result.studentId ? '生徒ID：' + result.studentId : '';
  $('campus').textContent = result.campus ? '校舎：' + result.campus : '';
  const wrap = $('qrWrap');
  const mayReuse = reuseExisting && result.registered && result.qrData && lastRenderedQrData === result.qrData && wrap.childElementCount > 0;
  if (!mayReuse) wrap.replaceChildren();
  if (!result.registered || !result.qrData) {
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = 'QRがまだ登録されていません。教室スタッフへ「入退室用QRの登録」をご依頼ください。';
    wrap.appendChild(notice);
    lastRenderedQrData = '';
  } else if (typeof QRCode === 'undefined') {
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.textContent = 'QR表示用データを読み込めませんでした。通信状況を確認して再読み込みしてください。';
    wrap.appendChild(notice);
    lastRenderedQrData = '';
  } else if (!mayReuse) {
    mark('myqr:generate-start');
    new QRCode(wrap, { text: result.qrData, width: 252, height: 252, correctLevel: QRCode.CorrectLevel.M });
    lastRenderedQrData = result.qrData;
    mark('myqr:generate-end');
    measure('qr-generation', 'myqr:generate-start', 'myqr:generate-end');
  }
  renderAttendance(result.attendance);
  startAttendanceRefresh();
  const expires = new Date(result.expiresAt);
  $('sessionNote').textContent = validating ? 'QRを表示しました。セッションを確認しています…' : (Number.isNaN(expires.getTime()) ? '' : 'ログイン有効期限: ' + expires.toLocaleString('ja-JP'));
  showPanel('qrPanel');
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const studentId = $('studentId').value.trim();
  const password = $('password').value;
  const button = $('loginButton');
  button.disabled = true;
  button.textContent = '本人確認中…';
  $('loginMessage').textContent = '';
  try {
    mark('myqr:login-start');
    const result = await api({ action: 'myQrLogin', studentId, password });
    mark('myqr:login-end');
    measure('login-api', 'myqr:login-start', 'myqr:login-end');
    $('password').value = '';
    $('studentId').value = '';
    clearQrCache();
    saveSession(result.token, result.expiresAt);
    if (result.commonToken && result.commonExpiresAt) saveCommonSession(result.commonToken, result.commonExpiresAt);
    const session = getPreferredSession();
    if (session && Object.prototype.hasOwnProperty.call(result, 'registered')) {
      await saveQrCache(session, result);
      renderMyQr({ ...result, expiresAt: session.expiresAt });
    } else {
      showPanel('loadingPanel');
      await loadMyQr();
    }
  } catch (error) {
    $('password').value = '';
    $('loginMessage').className = 'message error';
    $('loginMessage').textContent = error.message || 'ログインできませんでした。';
  } finally {
    button.disabled = false;
    button.textContent = 'ログインしてQRを表示';
  }
});

$('logoutButton').addEventListener('click', async () => {
  if (!window.confirm('ログアウトしますか？\n次回は生徒ID・パスワードの再入力が必要です。')) return;
  const qrSession = readSession();
  const commonSession = readCommonSession();
  clearAllSessions();
  clearQrVisual();
  showPanel('loginPanel');
  $('loginMessage').className = 'message success';
  $('loginMessage').textContent = 'ログアウトしました。';
  const requests = [];
  if (qrSession) requests.push(api({ action: 'myQrLogout', token: qrSession.token }));
  if (commonSession) requests.push(api({ action: 'myQrCommonLogout', commonToken: commonSession.token }));
  Promise.allSettled(requests);
});

function clearAllSessions() {
  clearSession();
  clearCommonSession();
  clearQrCache();
}

document.addEventListener('DOMContentLoaded', () => {
  mark('myqr:dom-ready');
  measure('html-to-api-url', 'myqr:html-start', 'myqr:api-url-ready');
  measure('html-to-qr-library', 'myqr:html-start', 'myqr:qr-library-ready');
  loadMyQr();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./my_qr_sw.js?v=7').catch(() => {});
});
</script>
</body>
</html>
