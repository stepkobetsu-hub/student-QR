name: Restore QR sidebar

on:
  push:
    paths:
      - '.github/workflows/restore-qr-sidebar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent left menu on split QR pages
        shell: python
        run: |
          from pathlib import Path

          css = '''
.workspace-shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}.side-menu{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(31,65,49,.06);padding:12px;display:flex;flex-direction:column;gap:10px}.side-menu a{display:block;text-decoration:none;color:#18724f;background:#eef5f1;border:1px solid #d4e0da;border-radius:9px;padding:15px 14px;font-weight:700;line-height:1.35}.side-menu a.active{background:var(--main);color:#fff;border-color:var(--main)}.workspace-shell>.panel{width:100%}@media(max-width:800px){.workspace-shell{grid-template-columns:1fr}.side-menu{flex-direction:row;flex-wrap:wrap}.side-menu a{flex:1 1 calc(50% - 5px);text-align:center}}
'''
          menu_student = '''<div class="workspace-shell"><nav class="side-menu" aria-label="管理機能メニュー"><a href="student_qr_register.html">入退くんＱＲ取込</a><a href="student_qr_register.html">生徒用QR確認・印刷</a><a class="active" href="student_qr_create.html">生徒用：新規QR発行</a><a href="teacher_qr_create.html">講師用：新規QR発行・名札印刷</a><a href="student_qr_register.html">通知先メール</a><a href="student_qr_register.html">ポイント付与</a><a href="student_qr_register.html">勤怠CSV出力</a></nav>'''
          menu_teacher = '''<div class="workspace-shell"><nav class="side-menu" aria-label="管理機能メニュー"><a href="student_qr_register.html">入退くんＱＲ取込</a><a href="student_qr_register.html">生徒用QR確認・印刷</a><a href="student_qr_create.html">生徒用：新規QR発行</a><a class="active" href="teacher_qr_create.html">講師用：新規QR発行・名札印刷</a><a href="student_qr_register.html">通知先メール</a><a href="student_qr_register.html">ポイント付与</a><a href="student_qr_register.html">勤怠CSV出力</a></nav>'''

          for filename, menu in [('student_qr_create.html', menu_student), ('teacher_qr_create.html', menu_teacher)]:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if '.workspace-shell{' not in s:
                  s = s.replace('</style>', css + '</style>', 1)
              if '<div class="workspace-shell"><nav class="side-menu"' not in s:
                  s = s.replace('<main class="panel">', menu + '<main class="panel">', 1)
                  s = s.replace('</main></div></div>\n<script', '</main></div></div></div>\n<script', 1)
                  s = s.replace('</main></div></div>\n<script', '</main></div></div></div>\n<script', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore left menu on split QR pages"
          git push
