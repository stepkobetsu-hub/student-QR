name: Add notify email popup and confirm

on:
  push:
    paths:
      - '.github/workflows/add-notify-email-popup-confirm.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loading popup and save confirmation
        shell: python
        run: |
          from pathlib import Path
          p = Path('student_qr_register.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="notify-email-popup-confirm-20260831">'
          if marker in s:
              raise SystemExit('already patched')
          patch = r'''
<style id="notify-email-popup-confirm-style">
#notifyEmailLoadingPopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,40,30,.30);z-index:9999;padding:20px}
#notifyEmailLoadingPopup.show{display:flex}
#notifyEmailLoadingPopup .box{width:min(440px,92vw);background:#fff;border:2px solid #2e7d5b;border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.24);padding:24px 26px;text-align:center}
#notifyEmailLoadingPopup .title{font-size:21px;font-weight:800;color:#1f664a;margin-bottom:8px}
#notifyEmailLoadingPopup .text{font-size:14px;line-height:1.7;color:#555}
#notifyEmailLoadingPopup .spinner{width:34px;height:34px;margin:0 auto 14px;border:4px solid #dce9e3;border-top-color:#2e7d5b;border-radius:50%;animation:notifySpin .8s linear infinite}
@keyframes notifySpin{to{transform:rotate(360deg)}}
</style>
<div id="notifyEmailLoadingPopup" role="status" aria-live="polite" aria-modal="true">
  <div class="box"><div class="spinner"></div><div class="title">現在登録されているメールを確認中です</div><div class="text">確認が終わるまで保存できません。少しお待ちください。</div></div>
</div>
<script id="notify-email-popup-confirm-20260831">
(() => {
  const codeEl = document.getElementById('emailStudentCode');
  const saveBtn = document.getElementById('saveEmailBtn');
  const popup = document.getElementById('notifyEmailLoadingPopup');
  if (!codeEl || !saveBtn || !popup) return;

  const showPopup = () => popup.classList.add('show');
  const hidePopup = () => popup.classList.remove('show');

  // 番号が選ばれたら、既存メール確認中であることを明確に表示。
  codeEl.addEventListener('input', () => {
    if (codeEl.value.trim()) showPopup();
    else hidePopup();
  });

  // 既存の安全ローダーが save ボタンを有効化したら読み込み完了と判断して閉じる。
  const observer = new MutationObserver(() => {
    if (!saveBtn.disabled) hidePopup();
  });
  observer.observe(saveBtn, { attributes:true, attributeFilter:['disabled'] });

  // エラー時もメッセージが出たらポップアップを閉じる。
  const emailMsg = document.getElementById('emailMsg');
  if (emailMsg) {
    const msgObserver = new MutationObserver(() => {
      if (emailMsg.textContent.trim()) hidePopup();
    });
    msgObserver.observe(emailMsg, { childList:true, subtree:true, characterData:true });
  }

  const originalSave = window.saveNotifyEmails;
  if (typeof originalSave === 'function') {
    window.saveNotifyEmails = async function() {
      if (saveBtn.disabled) return originalSave.apply(this, arguments);
      const ok = window.confirm('本当に保存しますか？\n\n現在表示されている内容で通知先メールを上書きします。');
      if (!ok) return;
      return originalSave.apply(this, arguments);
    };
  }
})();
</script>
'''
          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_register.html
          git commit -m "Show notify email loading popup and confirm save"
          git push
