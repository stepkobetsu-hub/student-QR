name: Fix student QR email layout
on:
  push:
    paths:
      - '.github/workflows/fix-student-qr-email-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('student_qr_create.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.qr-mail-box{margin:18px auto 0;max-width:560px;padding:14px 16px;border-top:1px solid #d8e0dc;text-align:left}.qr-mail-title{font-size:13px;font-weight:800;color:#555;margin-bottom:7px}.qr-mail-list{font-size:14px;line-height:1.8;color:#234b3b;word-break:break-all}.qr-mail-list .empty{color:#999}.qr-mail-link{display:inline-block;margin-top:10px;padding:9px 14px;border-radius:8px;background:#2e7d5b;color:#fff;text-decoration:none;font-size:14px;font-weight:800}.print{display:none;background:#6a4fa0}', '.qr-mail-box{margin-top:14px;padding:14px 16px;border:1px solid #d8e0dc;border-radius:10px;background:#fafcfb;text-align:left}.qr-mail-title{font-size:13px;font-weight:800;color:#555;margin-bottom:7px}.qr-mail-list{font-size:14px;line-height:1.8;color:#234b3b;word-break:break-all}.qr-mail-list .empty{color:#d93025;font-size:18px;font-weight:900}.qr-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.qr-mail-link{display:inline-flex;align-items:center;min-height:46px;padding:10px 16px;border-radius:8px;background:#2e7d5b;color:#fff;text-decoration:none;font-size:14px;font-weight:800}.print{display:none;background:#6a4fa0;margin-top:0}',1)
          old='<div id="qr" class="qr"><div id="pill" class="pill"></div><div class="school">個別指導ステップ</div><div id="code" class="code"></div><div id="student" class="student"></div><img id="qrImg" alt="QRコード"><div class="qr-mail-box"><div class="qr-mail-title">登録済みの通知先メールアドレス</div><div id="qrNotifyEmails" class="qr-mail-list"><span class="empty">確認中...</span></div><a class="qr-mail-link" href="student_qr_register.html#email">メールアドレス登録・変更</a></div></div>\n<button id="print" class="print">🖨 このカードを印刷する</button>'
          new='<div id="qr" class="qr"><div id="pill" class="pill"></div><div class="school">個別指導ステップ</div><div id="code" class="code"></div><div id="student" class="student"></div><img id="qrImg" alt="QRコード"></div>\n<div class="qr-mail-box"><div class="qr-mail-title">登録済みの通知先メールアドレス</div><div id="qrNotifyEmails" class="qr-mail-list"><span class="empty">確認中...</span></div><div class="qr-actions"><button id="print" class="print">QRコード印刷</button><a class="qr-mail-link" href="student_qr_register.html#email">メールアドレス登録・変更</a></div></div>'
          if old not in s: raise SystemExit('layout target not found')
          s=s.replace(old,new,1)
          s=s.replace("el.innerHTML='<span class=\"empty\">登録なし</span>';return", "el.innerHTML='<span class=\"empty\">メールアドレス未登録</span>';return",1)
          s=s.replace("$('print').textContent='🖨 現行QRを印刷する';", "$('print').textContent='QRコード印刷';",1)
          s=s.replace("$('print').textContent='🖨 生徒用QRを印刷する';", "$('print').textContent='QRコード印刷';",1)
          s=s.replace('.print,.pdf,.qr-mail-link{display:none!important}', '.print,.pdf,.qr-mail-box{display:none!important}',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Move notification email controls outside printed QR"
          git push
