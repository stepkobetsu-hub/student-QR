name: Fix email missing warning persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-email-missing-warning-persist-20260831.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notify email warning behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('notify_email_safety.js')
          s = p.read_text()

          s = s.replace("    let confirmedCode = '';\n", "    let confirmedCode = '';\n    let missingWasUnregistered = false;\n")

          s = s.replace("      confirmedCode = '';\n      codeEl.value = '';", "      confirmedCode = '';\n      missingWasUnregistered = false;\n      codeEl.value = '';")

          s = s.replace("      missingInline.style.color = '#d93025';\n      missingInline.style.fontSize = '19px';\n      missingInline.style.fontWeight = '900';\n", "      missingInline.style.color = '#d93025';\n      missingInline.style.fontSize = '24px';\n      missingInline.style.fontWeight = '900';\n      missingInline.style.padding = '12px 18px';\n      missingInline.style.background = '#fff1f0';\n      missingInline.style.border = '2px solid #e53935';\n      missingInline.style.borderRadius = '10px';\n      missingInline.style.boxShadow = '0 2px 8px rgba(217,48,37,.12)';\n")

          old = """    const emailMsg = document.getElementById('emailMsg');
    const emphasizeMissingEmail = () => {
      if (!emailMsg || !confirmedCode) {
        if (missingInline) missingInline.style.display = 'none';
        return;
      }
      const allEmpty = emailInputs.every(el => !String(el.value || '').trim());
      const loaded = /現在登録されているメールを読み込みました|メールアドレス未登録/.test(emailMsg.textContent || '');
      if (loaded && allEmpty) {
        if (missingInline) missingInline.style.display = 'block';
        emailMsg.style.display = 'none';
      } else {
        if (missingInline) missingInline.style.display = 'none';
        if (emailMsg.textContent.trim()) emailMsg.style.display = '';
      }
    };
"""
          new = """    const emailMsg = document.getElementById('emailMsg');
    const emphasizeMissingEmail = () => {
      if (!emailMsg || !confirmedCode) {
        if (missingInline) missingInline.style.display = 'none';
        return;
      }
      const text = (emailMsg.textContent || '').trim();
      const allEmpty = emailInputs.every(el => !String(el.value || '').trim());
      const loaded = /現在登録されているメールを読み込みました|メールアドレス未登録/.test(text);
      const saved = /保存.*(?:完了|しました|成功)|通知先メールを保存/.test(text);

      if (saved) {
        missingWasUnregistered = false;
        if (missingInline) missingInline.style.display = 'none';
        if (text) emailMsg.style.display = '';
        return;
      }

      if (loaded && allEmpty) missingWasUnregistered = true;

      if (missingWasUnregistered) {
        if (missingInline) {
          missingInline.textContent = '⚠ メールアドレス未登録';
          missingInline.style.display = 'block';
        }
        emailMsg.style.display = 'none';
      } else {
        if (missingInline) missingInline.style.display = 'none';
        if (text) emailMsg.style.display = '';
      }
    };
"""
          if old not in s:
              raise SystemExit('target function not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notify_email_safety.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep missing email warning until save succeeds'
          git push
