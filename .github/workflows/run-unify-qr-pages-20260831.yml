name: Run QR page unification
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set notification save destination to X BA BB BC only
        shell: python
        run: |
          from pathlib import Path
          p = Path('gas/コード.js')
          s = p.read_text(encoding='utf-8')
          if "canonical-notify-save-v67" in s:
              raise SystemExit(0)
          old = """  // 移行期間中だけ旧コード互換のため AD と BK〜BN にもコピーする。
          sheet.getRange(row, COL_GUARDIAN_EMAIL_2).setValue(inputEmails[1]);
          LEGACY_NOTIFY_EMAIL_COLS.forEach((col, i) => sheet.getRange(row, col).setValue(inputEmails[i]));

          """.replace('\n          ', '\n')
          if old not in s:
              raise SystemExit('legacy notification write block not found')
          s = s.replace(old, "  // 保存先は X・BA・BB・BC の4列だけ。AD・BK〜BN には書き込まない。\n\n", 1)
          s = s.replace("const CHECKIN_BUILD_ID = 'canonical-notify-columns-v66';", "const CHECKIN_BUILD_ID = 'canonical-notify-save-v67';", 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit notification backend patch
        run: |
          if git diff --quiet -- gas/コード.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gas/コード.js
          git commit -m "Save notification emails only to X BA BB BC"
          git push
      - name: Apply patch
        run: python3 .github/scripts/unify_qr_pages_20260831.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html teacher_qr_create.html student_qr_register.html
          git diff --cached --quiet && exit 0
          git commit -m "Unify QR page layout and email status"
          git push
