name: Deploy check-in edge staging

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/checkin-edge/**'
      - '.github/workflows/deploy-checkin-edge-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-checkin-edge-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/checkin-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/checkin-edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
