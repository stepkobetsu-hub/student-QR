name: Deploy checkin edge staging

on:
  push:
    branches: [main]
    paths:
      - '.github/deploy-checkin-edge-staging-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: cloudflare/checkin-edge
        run: npm ci

      - name: Verify rare exit configuration
        shell: bash
        run: |
          grep -F "RARE_EXIT_PROBABILITY = 0.10" cloudflare/checkin-edge/src/legacy-tablet.html
          grep -F "PHOTO_EXIT_PROBABILITY = 0.10" cloudflare/checkin-edge/src/legacy-tablet.html
          grep -F "goodbye-rare-woman.webp" cloudflare/checkin-edge/src/legacy-tablet.html
          grep -F "useRareExitVariant" cloudflare/checkin-edge/src/legacy-tablet.html

      - name: Run tests
        working-directory: cloudflare/checkin-edge
        run: npm test

      - name: Deploy staging Worker
        working-directory: cloudflare/checkin-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not available in the GitHub staging environment." >&2
            exit 2
          fi
          npm run deploy:staging

      - name: Verify live legacy-tablet
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            html="$(curl -fsSL --retry 2 --connect-timeout 10 https://step-checkin-edge-staging.stepkobetsu.workers.dev/legacy-tablet || true)"
            if printf '%s' "$html" | grep -Fq "RARE_EXIT_PROBABILITY = 0.10" \
              && printf '%s' "$html" | grep -Fq "PHOTO_EXIT_PROBABILITY = 0.10" \
              && printf '%s' "$html" | grep -Fq "goodbye-rare-woman.webp" \
              && printf '%s' "$html" | grep -Fq "useRareExitVariant"; then
              echo "Live legacy-tablet verified: rare 10%, director 10%, normal 80%."
              exit 0
            fi
            sleep 5
          done
          echo "Live Worker did not expose the expected rare-exit configuration." >&2
          exit 3
