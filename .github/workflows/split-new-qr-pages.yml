name: Split new QR pages

on:
  push:
    paths:
      - '.github/workflows/split-new-qr-pages.yml'

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update QR menu and page labels
        shell: python
        run: |
          from pathlib import Path

          main = Path('student_qr_register.html')
          text = main.read_text(encoding='utf-8')
          old = '<button type="button" class="tab-btn" id="tabNewBtn" onclick="switchTab(\'new\')">新規QR発行・名札印刷</button>'
          new = '''<button type="button" class="tab-btn" id="tabNewBtn" onclick="location.href='student_qr_create.html'">生徒用：新規QR発行</button>\n    <button type="button" class="tab-btn" onclick="location.href='teacher_qr_create.html'">講師用：新規QR発行・名札印刷</button>'''
          if old not in text:
              raise SystemExit('main menu target not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          student = Path('student_qr_create.html')
          text = student.read_text(encoding='utf-8').replace('生徒用：新規QR作成', '生徒用：新規QR発行')
          import re
          text, count = re.subn(r'<a class="badge" href="https://step-name-badge\.mintcocoajasmine\.chatgpt\.site" target="_blank" rel="noopener">🏷️ 名札発行</a>', '', text)
          if count == 0:
              raise SystemExit('student name-badge button target not found')
          student.write_text(text, encoding='utf-8')

          teacher = Path('teacher_qr_create.html')
          text = teacher.read_text(encoding='utf-8').replace('講師用：新規QR作成', '講師用：新規QR発行・名札印刷')
          teacher.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_register.html student_qr_create.html teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Split student and teacher new QR pages"
          git push
