name: Fix notify email load v2

on:
  push:
    paths:
      - '.github/workflows/fix-notify-email-load-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject safe notification email loader
        shell: python
        env:
          PATCH_B64: 
        run: |
          import os, base64
          from pathlib import Path
          p = Path('student_qr_register.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="notify-email-load-safe-20260831">'
          if marker not in s:
              patch = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
              s = s.replace('</body>', patch + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_register.html
          git diff --cached --quiet && exit 0
          git commit -m "Show existing notification emails safely"
          git push
