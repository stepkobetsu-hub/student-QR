name: Enable invoice failure manager

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inject-invoice-delivery-failures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inject invoice failure asset
        run: python scripts/inject_invoice_delivery_failures.py
      - name: Check JavaScript syntax
        run: node --check invoice_delivery_failures.js
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery_failures.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show invoice failures in central delivery manager"
          git push
