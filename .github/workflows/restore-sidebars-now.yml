name: Restore QR sidebars now

on:
  push:
    paths:
      - '.github/workflows/restore-sidebars-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert shared sidebar into split QR pages
        shell: python
        run: |
          from pathlib import Path
          css = '<style id="shared-sidebar-style">.page-shell{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;align-items:start}.side-menu{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 5px 18px rgba(31,65,49,.06)}.side-menu a{display:block;text-decoration:none;color:var(--main);font-weight:700;background:#eef5f1;border:1px solid #d7e2dc;border-radius:8px;padding:14px;margin-bottom:10px;line-height:1.35}.side-menu a:last-child{margin-bottom:0}.side-menu a.active{background:var(--main);color:#fff}.content-main{min-width:0}@media(max-width:820px){.page-shell{grid-template-columns:1fr}.side-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.side-menu a{margin:0;text-align:center}}</style>'
          items = [('existing','入退くんＱＲ取込','student_qr_register.html'),('check','生徒用QR確認・印刷','student_qr_register.html#check'),('student','生徒用：新規QR発行','student_qr_create.html'),('teacher','講師用：新規QR発行・名札印刷','teacher_qr_create.html'),('email','通知先メール','student_qr_register.html#email'),('points','ポイント付与','student_qr_register.html#points'),('csv','勤怠CSV出力','student_qr_register.html#csv')]
          def sidebar(active):
              return '<nav class="side-menu" aria-label="管理機能メニュー">' + ''.join('<a%s href="%s">%s</a>' % (' class="active"' if k==active else '', h, l) for k,l,h in items) + '</nav>'
          for filename,active in [('student_qr_create.html','student'),('teacher_qr_create.html','teacher')]:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              if 'id="shared-sidebar-style"' not in s:
                  s=s.replace('</head>', css+'</head>', 1)
              if 'class="page-shell"' not in s:
                  marker='<main class="panel">'
                  if marker not in s:
                      raise SystemExit('main marker missing: '+filename)
                  s=s.replace(marker, '<div class="page-shell">'+sidebar(active)+'<div class="content-main">'+marker, 1)
                  s=s.replace('</main></div></div>\n<script', '</main></div></div></div>\n<script', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore left menus on split QR pages"
          git push
