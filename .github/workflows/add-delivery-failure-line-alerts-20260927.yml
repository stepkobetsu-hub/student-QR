name: Verify delivery failure LINE alerts
on:
  push:
    branches: [main]
    paths:
      - 'gas/DeliveryFailures.js'
      - 'delivery_failures.html'
      - '.github/workflows/add-delivery-failure-line-alerts-20260927.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and feature checks
        run: |
          node --check gas/DeliveryFailures.js
          grep -q "notifyDeliveryFailureLineSafely_" gas/DeliveryFailures.js
          grep -q "DELIVERY_FAILURE_LINE_SESSION_TOKEN" gas/DeliveryFailures.js
          grep -q "deliveryFailureLineSettingsSave" gas/DeliveryFailures.js
          grep -q "LINE未達通知設定" delivery_failures.html
          grep -q "7001" delivery_failures.html
