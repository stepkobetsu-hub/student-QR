name: Fix rare exit character

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[rare-fix-trigger]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch normal tablet rare character
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tablet_checkin.html')
          s = p.read_text(encoding='utf-8')
          if 'RARE_EXIT_ASSET' not in s:
              s = s.replace(
                  '<link rel="preload" as="image" href="assets/checkin/goodbye-director-night-fast.webp?v=20260807" type="image/webp" fetchpriority="high">',
                  '<link rel="preload" as="image" href="assets/checkin/goodbye-director-night-fast.webp?v=20260807" type="image/webp" fetchpriority="high">\n<link rel="preload" as="image" href="assets/checkin/goodbye-rare-woman.webp?v=20260819" type="image/webp" fetchpriority="high">',
                  1,
              )
              s = s.replace(
                  '  #resultOverlay.exit.show:not(.photo-variant) #resultCharacter {',
                  '  #resultOverlay.exit.show:not(.photo-variant):not(.rare-variant) #resultCharacter {',
                  1,
              )
              marker = '  #resultOverlay.duplicate #resultCharacter { width: min(38vw, 470px); }'
              rare_css = '''  #resultOverlay.rare-variant {\n    color: #20242b;\n    background: radial-gradient(circle at 12% 18%,#ffc9d6 0 5px,transparent 6px), radial-gradient(circle at 25% 72%,#ffd7e2 0 7px,transparent 8px), radial-gradient(circle at 78% 20%,#ffd0dc 0 6px,transparent 7px), radial-gradient(circle at 88% 66%,#ffc7d5 0 5px,transparent 6px), linear-gradient(145deg,#eef7ff 0%,#ffffff 46%,#fff5f8 100%);\n  }\n  #resultOverlay.exit.rare-variant::after { display: none; }\n  #resultOverlay.rare-variant::before {\n    content: 'レアキャラ登場！ ✨'; position: absolute; right: 4%; bottom: 8%; z-index: 4;\n    padding: 12px 18px; border: 3px solid #f7b9c9; border-radius: 999px; background: rgba(255,245,248,.96);\n    color: #20242b; font-size: 20px; font-weight: bold; box-shadow: 0 8px 20px rgba(80,120,160,.16);\n  }\n  #resultOverlay.rare-variant #resultContent { color:#20242b; background:rgba(255,255,255,.96); border:2px solid #b9d8fb; }\n  #resultOverlay.rare-variant #resultType { color:#22a957; }\n  #resultOverlay.rare-variant #resultCharacter { width:min(48vw,610px); height:80vh; max-height:80vh; bottom:0; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 10px 16px rgba(70,90,110,.18)); }\n'''
              if marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(marker, rare_css + marker, 1)
              s = s.replace(
                  "const PHOTO_EXIT_ASSET = 'assets/checkin/goodbye-director-night-fast.webp?v=20260807';\nconst PHOTO_EXIT_PROBABILITY = 0.2;",
                  "const PHOTO_EXIT_ASSET = 'assets/checkin/goodbye-director-night-fast.webp?v=20260807';\nconst RARE_EXIT_ASSET = 'assets/checkin/goodbye-rare-woman.webp?v=20260819';\nconst PHOTO_EXIT_PROBABILITY = 0.10;\nconst RARE_EXIT_PROBABILITY = 0.10;",
                  1,
              )
              preload = "exitPhotoPreload.src = PHOTO_EXIT_ASSET;\nif (typeof exitPhotoPreload.decode === 'function') void exitPhotoPreload.decode().catch(() => {});"
              rare_preload = preload + "\nconst rareExitPreload = new Image();\nrareExitPreload.decoding = 'async';\nrareExitPreload.fetchPriority = 'high';\nrareExitPreload.src = RARE_EXIT_ASSET;\nif (typeof rareExitPreload.decode === 'function') void rareExitPreload.decode().catch(() => {});"
              if preload not in s:
                  raise SystemExit('preload marker not found')
              s = s.replace(preload, rare_preload, 1)
              old = "    const usePhotoExitVariant = !isCooldownDuplicate && type === '退室' && Math.random() < PHOTO_EXIT_PROBABILITY;"
              new = "    const exitVariantRoll = Math.random();\n    const useRareExitVariant = !isCooldownDuplicate && type === '退室' && exitVariantRoll < RARE_EXIT_PROBABILITY;\n    const usePhotoExitVariant = !isCooldownDuplicate && type === '退室' && !useRareExitVariant && exitVariantRoll < RARE_EXIT_PROBABILITY + PHOTO_EXIT_PROBABILITY;"
              if old not in s:
                  raise SystemExit('probability marker not found')
              s = s.replace(old, new, 1)
              s = s.replace(
                  "    if (usePhotoExitVariant) resultOverlay.classList.add('photo-variant');",
                  "    if (usePhotoExitVariant) resultOverlay.classList.add('photo-variant');\n    if (useRareExitVariant) resultOverlay.classList.add('rare-variant');",
                  1,
              )
              old_asset = "        : (usePhotoExitVariant\n          ? PHOTO_EXIT_ASSET\n          : 'assets/checkin/goodbye.png?v=429da8e'));"
              new_asset = "        : (useRareExitVariant\n          ? RARE_EXIT_ASSET\n          : (usePhotoExitVariant\n            ? PHOTO_EXIT_ASSET\n            : 'assets/checkin/goodbye.png?v=429da8e')));"
              if old_asset not in s:
                  raise SystemExit('asset marker not found')
              s = s.replace(old_asset, new_asset, 1)
              old_sub = "    resultSub.textContent = isCooldownDuplicate\n      ? '60秒以内の重複読取のため、記録とメール送信は追加していません'\n      : (duplicate ? 'すでに同じ受付を処理済みです' : mailStatusText(mailStatus, errorCode, mailProvider));"
              new_sub = "    resultSub.textContent = isCooldownDuplicate\n      ? '60秒以内の重複読取のため、記録とメール送信は追加していません'\n      : (useRareExitVariant ? 'また明日も頑張ろうね！' : (duplicate ? 'すでに同じ受付を処理済みです' : mailStatusText(mailStatus, errorCode, mailProvider)));"
              # Replace the student branch occurrence only: first occurrence is teacher branch, so split at student marker.
              student_marker = "  } else if (ok) {\n    const isCooldownDuplicate"
              i = s.find(student_marker)
              if i < 0:
                  raise SystemExit('student branch not found')
              head, tail = s[:i], s[i:]
              if old_sub not in tail:
                  raise SystemExit('student resultSub marker not found')
              tail = tail.replace(old_sub, new_sub, 1)
              s = head + tail
              p.write_text(s, encoding='utf-8')

          # Verify both normal and Worker variants are configured 10% rare + 10% director.
          modern = Path('tablet_checkin.html').read_text(encoding='utf-8')
          legacy = Path('cloudflare/checkin-edge/src/legacy-tablet.html').read_text(encoding='utf-8')
          for label, text in [('tablet_checkin.html', modern), ('legacy-tablet.html', legacy)]:
              if 'RARE_EXIT_PROBABILITY = 0.10' not in text or 'PHOTO_EXIT_PROBABILITY = 0.10' not in text:
                  raise SystemExit(label + ' probability check failed')
              if 'goodbye-rare-woman.webp' not in text:
                  raise SystemExit(label + ' rare asset check failed')
          print('Rare exit configuration verified in both tablet variants')
          PY

      - name: Run worker tests
        working-directory: cloudflare/checkin-edge
        run: |
          npm ci
          npm test

      - name: Commit normal tablet fix
        shell: bash
        run: |
          if ! git diff --quiet -- tablet_checkin.html; then
            git config user.name "stepkobetsu-hub"
            git config user.email "stepkobetsu@gmail.com"
            git add tablet_checkin.html
            git commit -m "Apply 10 percent rare exit character to normal tablet"
            git push origin main
          fi

      - name: Deploy current legacy tablet to staging Worker
        working-directory: cloudflare/checkin-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment secrets are missing" >&2
            exit 2
          fi
          npm run deploy:staging
