name: Apply temporary email auto retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-temp-error-auto-retry-20260904.yml'
      - '.github/scripts/temp_error_auto_retry_20260904.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply temporary-error auto-retry patch
        run: python3 .github/scripts/temp_error_auto_retry_20260904.py
      - name: Syntax checks
        run: |
          node --check gas/DeliveryFailures.js
          node --check gas/コード.js
          grep -q '一時停止（自動）' delivery_failures.html
          grep -q 'claimDeliveryEmailSendDecision_' gas/コード.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gas/DeliveryFailures.js gas/コード.js delivery_failures.html
          git commit -m 'Auto retry temporary email failures after cooldown'
          git push
