name: Install rare exit character

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.event.head_commit.message == 'Add rare exit character installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch legacy tablet rare character
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/checkin-edge/src/legacy-tablet.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "#result.photo-variant #resultCharacter{right:0;width:47%;height:90%}\n",
                  "#result.photo-variant #resultCharacter{right:0;width:47%;height:90%}\n"
                  "#result.rare-variant{color:#20242b;background:radial-gradient(circle at 12% 18%,#ffc9d6 0 5px,transparent 6px),radial-gradient(circle at 25% 72%,#ffd7e2 0 7px,transparent 8px),radial-gradient(circle at 78% 20%,#ffd0dc 0 6px,transparent 7px),radial-gradient(circle at 88% 66%,#ffc7d5 0 5px,transparent 6px),linear-gradient(145deg,#eef7ff 0%,#ffffff 46%,#fff5f8 100%)}\n"
                  "#result.exit.rare-variant:after{display:none}\n"
                  "#result.rare-variant:before{content:'レアキャラ登場！ ✨';position:absolute;right:4%;bottom:9%;z-index:4;padding:12px 16px;border:3px solid #f7b9c9;border-radius:999px;background:rgba(255,245,248,.96);color:#20242b;font-size:18px;font-weight:bold;box-shadow:0 8px 20px rgba(80,120,160,.16)}\n"
                  "#result.rare-variant #resultContent{left:4%;top:17%;width:52%;background:rgba(255,255,255,.96);color:#20242b;border:2px solid #b9d8fb;box-shadow:0 12px 30px rgba(80,120,160,.18)}\n"
                  "#result.rare-variant #type{color:#22a957}\n"
                  "#result.rare-variant #detail{font-size:20px;font-weight:bold;color:#34383e}\n"
                  "#result.rare-variant #resultCharacter{right:1%;bottom:0;width:47%;height:91%;filter:drop-shadow(0 10px 16px rgba(70,90,110,.18))}\n"
              ),
              (
                  "  var PHOTO_EXIT_ASSET = 'goodbye-director-night-fast.webp?v=20260807';\n  var PHOTO_EXIT_PROBABILITY = 0.2;\n",
                  "  var PHOTO_EXIT_ASSET = 'goodbye-director-night-fast.webp?v=20260807';\n  var RARE_EXIT_ASSET = 'goodbye-rare-woman.webp?v=20260819';\n  var PHOTO_EXIT_PROBABILITY = 0.10;\n  var RARE_EXIT_PROBABILITY = 0.10;\n"
              ),
              (
                  "  var exitPhotoPreload = new Image();\n  exitPhotoPreload.src = ASSET_BASE + PHOTO_EXIT_ASSET;\n",
                  "  var exitPhotoPreload = new Image();\n  exitPhotoPreload.src = ASSET_BASE + PHOTO_EXIT_ASSET;\n  var rareExitPreload = new Image();\n  rareExitPreload.src = ASSET_BASE + RARE_EXIT_ASSET;\n"
              ),
              (
                  "    var actionText = '';\n    var usePhotoExitVariant = !duplicate && !isTeacher && type === '退室' && Math.random() < PHOTO_EXIT_PROBABILITY;\n",
                  "    var actionText = '';\n    var exitVariantRoll = Math.random();\n    var useRareExitVariant = !duplicate && !isTeacher && type === '退室' && exitVariantRoll < RARE_EXIT_PROBABILITY;\n    var usePhotoExitVariant = !duplicate && !isTeacher && type === '退室' && !useRareExitVariant && exitVariantRoll < RARE_EXIT_PROBABILITY + PHOTO_EXIT_PROBABILITY;\n"
              ),
              (
                  "      result.className = 'show ' + (duplicate ? 'duplicate' : (entry ? 'entry' : 'exit')) + (isTeacher ? ' teacher' : '') + (usePhotoExitVariant ? ' photo-variant' : '');\n",
                  "      result.className = 'show ' + (duplicate ? 'duplicate' : (entry ? 'entry' : 'exit')) + (isTeacher ? ' teacher' : '') + (usePhotoExitVariant ? ' photo-variant' : '') + (useRareExitVariant ? ' rare-variant' : '');\n"
              ),
              (
                  "        character = entry ? 'welcome.png' : (usePhotoExitVariant ? PHOTO_EXIT_ASSET : 'goodbye.png');\n",
                  "        character = entry ? 'welcome.png' : (useRareExitVariant ? RARE_EXIT_ASSET : (usePhotoExitVariant ? PHOTO_EXIT_ASSET : 'goodbye.png'));\n"
              ),
              (
                  "      if (usePhotoExitVariant) {\n        resultCharacter.onerror = function () {\n          resultCharacter.onerror = null;\n          resultCharacter.src = ASSET_BASE + 'goodbye.png';\n        };\n      }\n",
                  "      if (usePhotoExitVariant || useRareExitVariant) {\n        resultCharacter.onerror = function () {\n          resultCharacter.onerror = null;\n          resultCharacter.src = ASSET_BASE + 'goodbye.png';\n        };\n      }\n"
              ),
              (
                  "      detailEl.innerHTML = duplicate ? '60秒以内の重複読取のため、記録とメール送信は追加していません' : escapeText(detail || '受付が完了しました');\n",
                  "      detailEl.innerHTML = duplicate ? '60秒以内の重複読取のため、記録とメール送信は追加していません' : (useRareExitVariant ? 'また明日も頑張ろうね！' : escapeText(detail || '受付が完了しました'));\n"
              ),
              (
                  "    }, ok ? 2500 : 4000);\n",
                  "    }, ok ? (useRareExitVariant ? 3500 : 2500) : 4000);\n"
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected source snippet was not found: ' + old[:100])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Test worker
        working-directory: cloudflare/checkin-edge
        run: |
          npm ci
          npm test

      - name: Commit rare character change
        shell: bash
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add cloudflare/checkin-edge/src/legacy-tablet.html
          git commit -m "Install rare exit character at 10 percent"
          git push origin main

      - name: Deploy staging worker when Cloudflare secrets exist
        working-directory: cloudflare/checkin-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy:staging
          else
            echo "Cloudflare secrets are not configured in this repository; source change is committed but worker deployment is skipped."
          fi
