name: Fix QR action buttons

on:
  push:
    paths:
      - '.github/workflows/fix-qr-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make QR buttons usable immediately
        shell: python
        run: |
          from pathlib import Path

          for filename in ['student_qr_create.html', 'teacher_qr_create.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('id="view" class="current" disabled', 'id="view" class="current"')
              s = s.replace('id="issue" class="issue" disabled', 'id="issue" class="issue"')
              s = s.replace("$('view').disabled=true;$('issue').disabled=true;", "$('view').disabled=false;$('issue').disabled=false;")
              p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix student and teacher QR action buttons"
          git push
