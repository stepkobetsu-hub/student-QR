name: Hide duplicate email selection UI

on:
  push:
    paths:
      - '.github/workflows/hide-duplicate-email-selection-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide duplicate code field and selected-user message
        shell: python
        run: |
          from pathlib import Path
          p = Path('student_qr_register.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n<style id="hide-duplicate-email-selection-ui">\nlabel[for="emailStudentCode"], #emailStudentCode, #emailStudentInfo { display:none !important; }\n</style>\n'''
          if 'id="hide-duplicate-email-selection-ui"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_register.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide duplicate notification email selection UI"
          git push
