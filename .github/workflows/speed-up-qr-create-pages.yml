name: Speed up QR create pages

on:
  push:
    paths:
      - '.github/workflows/speed-up-qr-create-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speed up student and teacher QR pages
        shell: python
        run: |
          from pathlib import Path

          for filename in ['student_qr_create.html','teacher_qr_create.html']:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')

              # Warm up the two Apps Script origins early.
              if '<link rel="preconnect" href="https://script.google.com">' not in s:
                  s=s.replace('</title>', '</title>\n<link rel="preconnect" href="https://script.google.com">\n<link rel="dns-prefetch" href="https://script.google.com">', 1)

              # jsPDF is only needed when the user actually sends a PDF.
              s=s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n<script>', '<script>')
              s=s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>', '<script>')

              marker="async function sendPdf(){"
              if marker in s and 'async function ensureJsPdf()' not in s:
                  lazy="async function ensureJsPdf(){if(window.jspdf)return;await new Promise((resolve,reject)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';x.onload=resolve;x.onerror=()=>reject(new Error('PDFライブラリを読み込めませんでした'));document.head.appendChild(x)})}\n"
                  s=s.replace(marker, lazy+marker, 1)

              # Load jsPDF only inside PDF send flow.
              s=s.replace("try{$('send').disabled=true;$('send').textContent='送信中...';const img=await fetch(", "try{$('send').disabled=true;$('send').textContent='送信中...';await ensureJsPdf();const img=await fetch(")

              # Shorter debounce after entering a code.
              s=s.replace("},350)}", "},200)}")

              # Show cached authenticated shell immediately; verify session in background.
              old="(async()=>{const s=saved();if(s&&localStorage.getItem(K.logout)!=='1'&&await verify(s))return;showLogin()})();"
              new="(async()=>{const s=saved();if(s&&localStorage.getItem(K.logout)!=='1'){session=s;showApp();verify(s).then(ok=>{if(!ok){clear(false);showLogin()}});return}showLogin()})();"
              if old in s:
                  s=s.replace(old,new,1)
              else:
                  # teacher page may have identical logic with spacing differences
                  s=s.replace("(async()=>{const s=saved();if(s&&localStorage.getItem(K.logout)!=='1'&&await verify(s))return;showLogin()})()", new[:-1], 1)

              p.write_text(s,encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student_qr_create.html teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m "Speed up student and teacher QR create pages"
          git push
