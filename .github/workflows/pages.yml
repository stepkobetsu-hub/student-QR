name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply QR page UI patch
        run: python3 .github/scripts/unify_qr_pages_20260831.py
      - name: Build public artifact
        env:
          MY_QR_API_URL: ${{ vars.MY_QR_API_URL }}
        run: |
          test -n "$MY_QR_API_URL"
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'gas' --exclude 'tests' ./ _site/
          node -e "const fs=require('fs');const p='_site/my_qr_runtime.js';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace('__MY_QR_API_URL__',process.env.MY_QR_API_URL))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
