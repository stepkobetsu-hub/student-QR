name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply QR page UI patch
        run: python3 .github/scripts/unify_qr_pages_20260831.py
      - name: Apply card-size print CSS to new QR pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = r'''
<style id="qr-card-print-size-20260831">
@media print {
  @page { margin: 0; }
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
  .wrap { width: auto !important; max-width: none !important; margin: 0 !important; }
  .page-shell, .content-main, .panel { display: block !important; width: auto !important; margin: 0 !important; padding: 0 !important; border: 0 !important; box-shadow: none !important; }
  .side-menu { display: none !important; }
  .qr {
    display: block !important;
    box-sizing: border-box !important;
    width: 86mm !important;
    height: 54mm !important;
    min-height: 54mm !important;
    max-width: 86mm !important;
    margin: 0 !important;
    padding: 5mm 5mm 4mm !important;
    border: 0.45mm solid #333 !important;
    border-radius: 2mm !important;
    page-break-inside: avoid !important;
    overflow: hidden !important;
    text-align: center !important;
  }
  .qr .pill {
    margin: 0 0 1.5mm !important;
    padding: 0 !important;
    background: none !important;
    color: #333 !important;
    font-size: 10pt !important;
    line-height: 1.2 !important;
  }
  .qr .school { margin: 0 0 0.8mm !important; font-size: 8pt !important; line-height: 1.1 !important; }
  .qr .code { margin: 0 !important; font-size: 10pt !important; line-height: 1.15 !important; }
  .qr .student { margin: 0 0 1mm !important; font-size: 9pt !important; line-height: 1.15 !important; }
  .qr img {
    width: 29mm !important;
    height: 29mm !important;
    margin: 0 auto !important;
    display: block !important;
  }
}
</style>
'''

          for name in ('student_qr_create.html', 'teacher_qr_create.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'qr-card-print-size-20260831' not in s:
                  s = s.replace('</head>', css + '</head>')
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Build public artifact
        env:
          MY_QR_API_URL: ${{ vars.MY_QR_API_URL }}
        run: |
          test -n "$MY_QR_API_URL"
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'gas' --exclude 'tests' ./ _site/
          node -e "const fs=require('fs');const p='_site/my_qr_runtime.js';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace('__MY_QR_API_URL__',process.env.MY_QR_API_URL))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
