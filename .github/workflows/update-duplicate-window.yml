name: Update duplicate window and status text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[duplicate-30s]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch duplicate window and display text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Cloudflare authoritative duplicate window
          p = Path('cloudflare/checkin-edge/src/domain.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('export const DUPLICATE_WINDOW_MS = 60_000;', 'export const DUPLICATE_WINDOW_MS = 30_000;')
          p.write_text(s, encoding='utf-8')

          # 2) Worker client response text
          p = Path('cloudflare/checkin-edge/src/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('message: result.duplicate ? "60秒以内の同じ受付です" : "受付しました",', 'message: result.duplicate ? "30秒以内の同じ受付です" : "受付しました",')
          p.write_text(s, encoding='utf-8')

          # 3) Current Worker-served legacy tablet display
          p = Path('cloudflare/checkin-edge/src/legacy-tablet.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("        actionText = '受付済みです';", "        actionText = isTeacher ? (type === '出勤' ? '出勤済みです' : '退勤済みです') : (type === '入室' ? '入室済みです' : '退室済みです');")
          s = s.replace("detailEl.innerHTML = duplicate ? '60秒以内の重複読取のため、記録とメール送信は追加していません'", "detailEl.innerHTML = duplicate ? '30秒以内の重複読取のため、記録とメール送信は追加していません'")
          p.write_text(s, encoding='utf-8')

          # 4) GitHub Pages fallback/current normal tablet
          p = Path('tablet_checkin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const LOCAL_DUPLICATE_WINDOW_MS = 60 * 1000;', 'const LOCAL_DUPLICATE_WINDOW_MS = 30 * 1000;')
          s = s.replace("const isCooldownDuplicate = duplicate && errorCode === 'DUPLICATE_WITHIN_COOLDOWN';", "const isCooldownDuplicate = duplicate && (errorCode === 'DUPLICATE_WITHIN_COOLDOWN' || errorCode === 'DUPLICATE_WITHIN_WINDOW');")
          s = s.replace("      ? name + '先生は受付済みです'", "      ? (type === '出勤' ? '出勤済みです' : '退勤済みです')")
          s = s.replace("      ? name + 'は受付済みです'", "      ? (type === '入室' ? '入室済みです' : '退室済みです')")
          s = s.replace("      ? '60秒以内の重複読取のため、記録とメール送信は追加していません'", "      ? '30秒以内の重複読取のため、記録とメール送信は追加していません'")
          p.write_text(s, encoding='utf-8')

          # 5) Apps Script source must match the Worker window, otherwise 31-59 second scans can diverge.
          p = Path('gas/コード.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const CHECKIN_DUPLICATE_WINDOW_MS = 60 * 1000;', 'const CHECKIN_DUPLICATE_WINDOW_MS = 30 * 1000;')
          s = s.replace('60秒以内', '30秒以内')
          p.write_text(s, encoding='utf-8')

          # 6) Domain tests: add exact 30-second boundary coverage.
          p = Path('cloudflare/checkin-edge/tests/domain.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    expect(decideAttendance("student", 59_999, {', '    expect(decideAttendance("student", 30_999, {')
          boundary = '''\n  it("accepts a new stamp at exactly 30 seconds", () => {\n    expect(decideAttendance("student", 31_000, {\n      lastType: "入室",\n      lastAcceptedAt: 1_000,\n      count: 1,\n    })).toEqual({ type: "退室", duplicate: false, nextCount: 2 });\n  });\n'''
          marker = '  it("uses teacher labels", () => {'
          if 'accepts a new stamp at exactly 30 seconds' not in s:
              s = s.replace(marker, boundary + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')

          # 7) Static page tests cover the visible wording.
          p = Path('cloudflare/checkin-edge/tests/legacy-tablet-page.test.ts')
          s = p.read_text(encoding='utf-8')
          anchor = '    expect(html).toContain("RARE_EXIT_PROBABILITY = 0.10");\n'
          extra = '    expect(html).toContain("30秒以内の重複読取");\n    expect(html).toContain("入室済みです");\n    expect(html).toContain("退室済みです");\n'
          if '30秒以内の重複読取' not in s:
              s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s, encoding='utf-8')

          # Sanity checks
          checks = {
            'cloudflare/checkin-edge/src/domain.ts': ['DUPLICATE_WINDOW_MS = 30_000'],
            'cloudflare/checkin-edge/src/index.ts': ['30秒以内の同じ受付です'],
            'cloudflare/checkin-edge/src/legacy-tablet.html': ['30秒以内の重複読取', '入室済みです', '退室済みです'],
            'tablet_checkin.html': ['LOCAL_DUPLICATE_WINDOW_MS = 30 * 1000', 'DUPLICATE_WITHIN_WINDOW', '入室済みです', '退室済みです'],
            'gas/コード.js': ['CHECKIN_DUPLICATE_WINDOW_MS = 30 * 1000'],
          }
          for filename, needles in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{filename}: missing {needle}')
          print('30 second duplicate window patch verified')
          PY

      - name: Run Worker tests
        working-directory: cloudflare/checkin-edge
        run: |
          npm ci
          npm test

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add cloudflare/checkin-edge/src/domain.ts cloudflare/checkin-edge/src/index.ts cloudflare/checkin-edge/src/legacy-tablet.html cloudflare/checkin-edge/tests/domain.test.ts cloudflare/checkin-edge/tests/legacy-tablet-page.test.ts tablet_checkin.html gas/コード.js
          git commit -m "Set duplicate window to 30 seconds and clarify status"
          git push origin main
