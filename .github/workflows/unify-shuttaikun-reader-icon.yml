name: Unify Shuttaikun reader icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[shuttaikun-reader-icon]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Apply approved 出退くん icon to reader apps
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/stepkobetsu-hub/step-system-registry/main/images/shuttaikun-icon.png \
            -o /tmp/shuttaikun-approved.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          src = Image.open('/tmp/shuttaikun-approved.png').convert('RGBA')
          if src.width != src.height:
              raise SystemExit('approved icon must be square')
          src.resize((192,192), Image.Resampling.LANCZOS).save('icon-192.png')
          src.resize((512,512), Image.Resampling.LANCZOS).save('icon-512.png')

          p = Path('manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['name'] = '出退くん'
          data['short_name'] = '出退くん'
          for icon in data.get('icons', []):
              if icon.get('sizes') == '192x192': icon['src'] = 'icon-192.png?v=20260826'
              if icon.get('sizes') == '512x512': icon['src'] = 'icon-512.png?v=20260826'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('tablet_checkin.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="apple-touch-icon" href="icon-192.png">', '<link rel="apple-touch-icon" href="icon-192.png?v=20260826">')
          s = s.replace('<title>入退室 | Step個別指導ステップ</title>', '<title>出退くん | Step個別指導ステップ</title>')
          p.write_text(s, encoding='utf-8')

          p = Path('tablet_checkin_compat.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>入退室 | 軽量モード</title>', '<title>出退くん | 軽量モード</title>')
          p.write_text(s, encoding='utf-8')

          p = Path('cloudflare/checkin-edge/src/legacy-tablet.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="https://stepkobetsu-hub.github.io/student-QR/icon-192.png"', 'href="https://stepkobetsu-hub.github.io/student-QR/icon-192.png?v=20260826"')
          s = s.replace('<title>入退室 | 軽量モード</title>', '<title>出退くん | 軽量モード</title>')
          p.write_text(s, encoding='utf-8')

          p = Path('cloudflare/checkin-edge/src/index.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('name: "入退室チェックイン",', 'name: "出退くん",')
          s = s.replace('short_name: "入退室",', 'short_name: "出退くん",')
          s = s.replace('src: "https://stepkobetsu-hub.github.io/student-QR/icon-192.png",', 'src: "https://stepkobetsu-hub.github.io/student-QR/icon-192.png?v=20260826",')
          s = s.replace('src: "https://stepkobetsu-hub.github.io/student-QR/icon-512.png",', 'src: "https://stepkobetsu-hub.github.io/student-QR/icon-512.png?v=20260826",')
          p.write_text(s, encoding='utf-8')

          p = Path('cloudflare/checkin-edge/tests/legacy-tablet-page.test.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://stepkobetsu-hub.github.io/student-QR/icon-192.png', 'https://stepkobetsu-hub.github.io/student-QR/icon-192.png?v=20260826')
          s = s.replace('https://stepkobetsu-hub.github.io/student-QR/icon-512.png', 'https://stepkobetsu-hub.github.io/student-QR/icon-512.png?v=20260826')
          s = s.replace('expect(manifest.name).toBe("入退室チェックイン");', 'expect(manifest.name).toBe("出退くん");')
          s = s.replace('expect(manifest.short_name).toBe("入退室");', 'expect(manifest.short_name).toBe("出退くん");')
          p.write_text(s, encoding='utf-8')

          # sanity: reader-only assets changed; QR admin icons remain separate.
          assert json.loads(Path('manifest.json').read_text(encoding='utf-8'))['name'] == '出退くん'
          assert '出退くん' in Path('cloudflare/checkin-edge/src/index.ts').read_text(encoding='utf-8')
          assert Path('icon-192.png').stat().st_size > 1000
          assert Path('icon-512.png').stat().st_size > 1000
          print('approved 出退くん reader icon applied')
          PY

      - name: Run Worker tests
        working-directory: cloudflare/checkin-edge
        run: |
          npm ci
          npm test

      - name: Commit reader icon unification
        shell: bash
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add icon-192.png icon-512.png manifest.json tablet_checkin.html tablet_checkin_compat.html \
            cloudflare/checkin-edge/src/legacy-tablet.html cloudflare/checkin-edge/src/index.ts \
            cloudflare/checkin-edge/tests/legacy-tablet-page.test.ts
          git commit -m "Unify QR reader icon and app name as 出退くん"
          git push origin main
