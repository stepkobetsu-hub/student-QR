name: Force teacher master sheet link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-teacher-master-link-20260831.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force teacher master gid link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('teacher_qr_create.html')
          s = p.read_text()
          old1 = 'https://docs.google.com/spreadsheets/d/1L5aFDXAmfUDkBg8d7X3WqJgMhdMq5tM5sfUZ2G-M58E/edit#gid=2020620808'
          old2 = 'https://docs.google.com/spreadsheets/d/1L5aFDXAmfUDkBg8d7X3WqJgMhdMq5tM5sfUZ2G-M58E/edit'
          new = 'https://docs.google.com/spreadsheets/d/1L5aFDXAmfUDkBg8d7X3WqJgMhdMq5tM5sfUZ2G-M58E/edit?gid=2020620808#gid=2020620808'
          if old1 in s:
              s = s.replace(old1, new)
          elif old2 in s:
              s = s.replace(old2, new)
          else:
              raise SystemExit('PAYROLL_SHEET URL not found')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teacher_qr_create.html
          git diff --cached --quiet && exit 0
          git commit -m 'Force teacher email button to teacher master tab'
          git push
