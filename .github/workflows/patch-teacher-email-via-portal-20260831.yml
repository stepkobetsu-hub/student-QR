name: Patch teacher email via portal
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-teacher-email-via-portal-20260831.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch teacher QR page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('teacher_qr_create.html')
          s=p.read_text()
          old="const API='https://script.google.com/macros/s/AKfycbzYpm-16ahuZ3BRFKRT-iSvR9nThsYcTOhxplyBp4bZmVmehfTYZEEl18THzJasypOsTQ/exec',AUTH='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';"
          new=old+"const TEACHER_INFO_API='https://script.google.com/macros/s/AKfycbwP-pEDbbHB-Ec2xO7BFiVYqwpveTnNVmPJkNV08MPD8iAHHq4S7zPyVxDwFEmaHI9-/exec',PAYROLL_SHEET='https://docs.google.com/spreadsheets/d/1L5aFDXAmfUDkBg8d7X3WqJgMhdMq5tM5sfUZ2G-M58E/edit';"
          if old in s and 'TEACHER_INFO_API' not in s:
              s=s.replace(old,new,1)
          marker="function jsonp(p){return new Promise((resolve,reject)=>{const cb='teacher_qr_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('通信エラー'))};s.src=API+'?'+new URLSearchParams({...p,staffLoginId:session.loginId,sessionToken:session.sessionToken,callback:cb});document.body.appendChild(s)})}"
          add=marker+"\nfunction teacherInfoJsonp(code){return new Promise((resolve,reject)=>{const cb='teacher_info_'+Date.now()+'_'+Math.random().toString(36).slice(2),x=document.createElement('script');window[cb]=d=>{delete window[cb];x.remove();resolve(d)};x.onerror=()=>{delete window[cb];x.remove();reject(new Error('講師情報通信エラー'))};x.src=TEACHER_INFO_API+'?'+new URLSearchParams({action:'getTeacher',code,callback:cb});document.body.appendChild(x)})}\nfunction showTeacherEmail(email){const c=$('contacts');email=String(email||'').trim();if(email){c.innerHTML='<div style=\"font-weight:800;color:#234b3b;margin-bottom:8px\">登録済みメールアドレス</div><div style=\"font-size:16px;word-break:break-all\">'+email.replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]))+'</div>'}else{c.innerHTML='<div style=\"font-size:20px;font-weight:900;color:#d93025;margin-bottom:10px\">メールアドレス未登録</div>'}c.innerHTML+='<a href=\"'+PAYROLL_SHEET+'\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;margin-top:10px;padding:10px 16px;border-radius:8px;background:#2e7d5b;color:#fff;text-decoration:none;font-weight:800\">メールアドレス登録・変更</a>'}"
          if marker in s and 'function teacherInfoJsonp' not in s:
              s=s.replace(marker,add,1)
          old_lookup="try{const c=await jsonp({action:'getNotifyEmails',code});const a=[...new Set((c.emails||[]).map(v=>String(v||'').trim()).filter(Boolean))];$('contacts').textContent=a.length?'登録済みの連絡先：'+a.join(' ／ '):'登録済みの連絡先：なし'}catch(e){}"
          new_lookup="try{let email='';try{const tr=await teacherInfoJsonp(code),t=(tr&&tr.teacher)||tr||{};email=String(t.email||t.emailAddress||t.mail||t.notifyEmail||t.teacherEmail||'').trim()}catch(e){}if(!email){try{const c=await jsonp({action:'getNotifyEmails',code});const a=[...new Set((c.emails||[]).map(v=>String(v||'').trim()).filter(Boolean))];email=a[0]||''}catch(e){}}showTeacherEmail(email)}catch(e){showTeacherEmail('')}"
          if old_lookup in s:
              s=s.replace(old_lookup,new_lookup,1)
          # nomenclature requested earlier
          s=s.replace("$('print').textContent='🖨 現行QRを印刷する'","$('print').textContent='QRコード印刷'")
          s=s.replace("$('print').textContent='🖨 講師用QRを印刷する'","$('print').textContent='QRコード印刷'")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teacher_qr_create.html
          git commit -m 'Use teacher portal API for teacher email display'
          git push
