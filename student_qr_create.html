<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生徒用：新規QR発行 | 個別指導ステップ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">
<style>
:root{--main:#2e7d5b;--bg:#f5f7f6;--border:#d8e0dc}*{box-sizing:border-box}body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);margin:0;padding:28px;color:#333}.wrap{max-width:1000px;margin:auto}.head,.panel,.login{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(31,65,49,.06)}.head{padding:22px 28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0;color:var(--main);font-size:24px}.sub{color:#888;font-size:14px;margin-top:5px}.user{font-size:13px;color:#777;display:flex;gap:10px;align-items:center}.panel{padding:28px 32px}.login{max-width:430px;margin:8vh auto;padding:24px}.login h1{font-size:20px;color:var(--main);margin:0 0 8px}.note{font-size:13px;color:#777;line-height:1.7}label{display:block;font-size:13px;font-weight:bold;margin:16px 0 6px;color:#555}input{width:100%;padding:12px;font-size:16px;border:1px solid var(--border);border-radius:8px;background:#fafcfb}button{min-width:180px;padding:12px 18px;margin-top:20px;border:0;border-radius:8px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{background:#b8c7c0}.logout{min-width:auto;margin:0;padding:9px 14px;background:#666;font-size:14px}.hint{font-size:12px;color:#999;margin-top:5px;line-height:1.5}.info{display:none;margin-top:10px;padding:10px 14px;background:#eef6f1;border-radius:8px}.info.show{display:block}.name{font-weight:bold;font-size:16px;color:var(--main)}.status{display:none;margin-top:16px;padding:20px 22px;border:2px solid #b9c8c1;border-radius:12px;background:#f5f8f6}.status.show{display:block}.status.current{border-color:#1769aa;background:#edf6ff}.status.none{border-color:#8da49a;background:#f2f7f4}.status.done{border-color:var(--main);background:#e8f5ec}.status-title{font-size:23px;font-weight:800;color:#193d58}.status-detail{margin-top:7px;color:#3b5261;line-height:1.6}.contacts{margin-top:12px;padding-top:12px;border-top:1px solid #cbdde8;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button{margin-top:20px}.current{background:#1769aa}.issue{background:#b5651d}.badge{display:inline-flex;min-width:180px;min-height:48px;margin-top:20px;padding:12px 18px;align-items:center;justify-content:center;border-radius:8px;color:#fff;background:#20357f;font-weight:bold;text-decoration:none}.msg{display:none;margin-top:14px;padding:12px;border-radius:8px;font-size:14px}.msg.ok{display:block;background:#e6f4ea;color:#1e7e34}.msg.err{display:block;background:#fdecea;color:#c0392b}.qr{display:none;margin-top:20px;padding:20px;border:2px solid var(--border);border-radius:10px;text-align:center}.qr.show{display:block}.pill{display:inline-block;margin-bottom:14px;padding:8px 18px;border-radius:999px;background:#1769aa;color:#fff;font-size:18px;font-weight:800}.pill.new{background:#b5651d}.school{font-size:15px;color:#2a5da0;font-weight:bold}.code{font-size:20px;color:#b5651d;font-weight:bold}.student{font-size:16px;color:var(--main);font-weight:bold;margin-bottom:10px}.qr img{width:160px;height:160px}.qr-mail-box{margin-top:14px;padding:14px 16px;border:1px solid #d8e0dc;border-radius:10px;background:#fafcfb;text-align:left}.qr-mail-title{font-size:13px;font-weight:800;color:#555;margin-bottom:7px}.qr-mail-list{font-size:14px;line-height:1.8;color:#234b3b;word-break:break-all}.qr-mail-list .empty{color:#d93025;font-size:18px;font-weight:900}.qr-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.qr-mail-link{display:inline-flex;align-items:center;min-height:46px;padding:10px 16px;border-radius:8px;background:#2e7d5b;color:#fff;text-decoration:none;font-size:14px;font-weight:800}.print{display:none;background:#6a4fa0;margin-top:0}.pdf{display:none;margin-top:16px}.pdf button{background:#2a8f7a}.hide{display:none!important}@media(max-width:700px){body{padding:14px}.head{padding:18px;align-items:flex-start;flex-direction:column}.panel{padding:20px}.actions{flex-direction:column}.actions button,.badge{width:100%}}@media print{body{background:#fff;padding:0}.head,.panel h2,.panel>label,.panel>input,.panel>.hint,.panel>.info,.panel>.status,.panel>.actions,.panel>.msg,.print,.pdf,.qr-mail-box{display:none!important}.panel{border:0;box-shadow:none;padding:0}.qr{display:block!important;border:2px solid #333;width:330px;margin:0 auto}.qr img{width:220px;height:220px}}
</style>
<style id="shared-sidebar-style">.page-shell{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;align-items:start}.side-menu{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 5px 18px rgba(31,65,49,.06)}.side-menu a{display:block;text-decoration:none;color:var(--main);font-weight:700;background:#eef5f1;border:1px solid #d7e2dc;border-radius:8px;padding:14px;margin-bottom:10px;line-height:1.35}.side-menu a:last-child{margin-bottom:0}.side-menu a.active{background:var(--main);color:#fff}.content-main{min-width:0}@media(max-width:820px){.page-shell{grid-template-columns:1fr}.side-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.side-menu a{margin:0;text-align:center}}</style></head>
<body>
<div class="wrap">
<div id="login" class="login hide"><h1>生徒用：新規QR発行</h1><div class="note">権限を持つスタッフ専用ページです。</div><form id="loginForm"><label>ID</label><input id="loginId" autocomplete="username" inputmode="numeric"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">ログイン</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hide">
<header class="head"><div><h1>生徒用：新規QR発行</h1><div class="sub">生徒用QRの確認・新規作成・印刷ができます</div></div><div class="user"><span id="userName"></span><button class="logout" id="logout">ログアウト</button></div></header>
<div class="page-shell"><nav class="side-menu" aria-label="管理機能メニュー"><a href="student_qr_register.html">入退くんＱＲ取込</a><a href="student_qr_register.html#check">生徒用QR確認・印刷</a><a class="active" href="student_qr_create.html">生徒用：新規QR発行</a><a href="teacher_qr_create.html">講師用：新規QR発行・名札印刷</a><a href="student_qr_register.html#email">通知先メール</a><a href="student_qr_register.html#points">ポイント付与</a><a href="student_qr_register.html#csv">勤怠CSV出力</a></nav><div class="content-main"><main class="panel"><h2 style="margin:0 0 22px;color:#234b3b;font-size:22px;border-bottom:1px solid #e7ece9;padding-bottom:14px">生徒用：新規QR発行</h2>
<label>生徒番号</label><input id="studentCode" placeholder="例: 1331" inputmode="numeric" autocomplete="off"><div class="hint">生徒番号を入力すると、☆マスタのAZ列に生徒用QRが登録済みか確認します。</div>
<div id="info" class="info"><div id="studentName" class="name"></div><div id="school"></div></div>
<div id="status" class="status"><div id="statusTitle" class="status-title"></div><div id="statusDetail" class="status-detail"></div><div id="contacts" class="contacts"></div></div>
<div class="actions"><button id="view" class="current">登録済みQRを表示</button><button id="issue" class="issue">生徒用QRを作成してAZ列へ登録</button></div>
<div id="message" class="msg"></div>
<div id="qr" class="qr"><div id="pill" class="pill"></div><div class="school">個別指導ステップ</div><div id="code" class="code"></div><div id="student" class="student"></div><img id="qrImg" alt="QRコード"></div>
<div class="qr-mail-box"><div class="qr-mail-title">登録済みの通知先メールアドレス</div><div id="qrNotifyEmails" class="qr-mail-list"><span class="empty">確認中...</span></div><div class="qr-actions"><button id="print" class="print">QRコード印刷</button><a class="qr-mail-link" href="student_qr_register.html#email">メールアドレス登録・変更</a></div></div>
<div id="pdf" class="pdf"><label>このQRをPDFでメール送信</label><input id="email" placeholder="送信先メールアドレス"><button id="send">📧 PDFをメールで送る</button><div id="pdfMsg" class="msg"></div></div>
</main></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzYpm-16ahuZ3BRFKRT-iSvR9nThsYcTOhxplyBp4bZmVmehfTYZEEl18THzJasypOsTQ/exec',AUTH='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';
const K={id:'studentQrLoginId',name:'studentQrLoginName',perm:'studentQrPermissionLevel',token:'studentQrSessionToken',exp:'studentQrSessionExpiresAt',logout:'studentQrExplicitlyLoggedOut'};const allowed=['2','3','4'];let session=null,timer=null,seq=0,student=null,qrData='',currentCode='';const $=id=>document.getElementById(id);
function msg(t,ok=false){$('message').textContent=t||'';$('message').className=t?'msg '+(ok?'ok':'err'):'msg'}function loginMsg(t,ok=false){$('loginMsg').textContent=t||'';$('loginMsg').className=t?'msg '+(ok?'ok':'err'):'msg'}
function saved(){const id=localStorage.getItem(K.id),token=localStorage.getItem(K.token);return id&&token?{loginId:id,name:localStorage.getItem(K.name)||'',permissionLevel:localStorage.getItem(K.perm)||'',sessionToken:token,expiresAt:localStorage.getItem(K.exp)||''}:null}
function save(a){localStorage.setItem(K.id,a.loginId||a.code||'');localStorage.setItem(K.name,a.name||'');localStorage.setItem(K.perm,a.permissionLevel||'');localStorage.setItem(K.token,a.sessionToken||'');localStorage.setItem(K.exp,a.expiresAt||'');localStorage.removeItem(K.logout);session=a}
function clear(explicit){localStorage.removeItem(K.token);localStorage.removeItem(K.exp);if(explicit)localStorage.setItem(K.logout,'1');session=null}
async function authApi(p){return(await fetch(AUTH,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})).json()}
function normalize(r,s){return{loginId:r.loginId||r.code||s?.loginId||'',name:r.name||s?.name||'',permissionLevel:String(r.permissionLevel||s?.permissionLevel||'').trim(),sessionToken:r.sessionToken||s?.sessionToken||'',expiresAt:r.expiresAt||s?.expiresAt||''}}
function okAuth(r){return !!r?.success&&allowed.includes(String(r.permissionLevel||''))}
async function loginDo(id,pw){try{const r=await authApi({action:'studentQrLogin',code:id,password:pw});if(!okAuth(r)){clear(true);loginMsg('ID、パスワード、または利用権限を確認してください。');return false}const a=normalize(r,{loginId:id});save(a);showApp();return true}catch(e){loginMsg('通信エラーが発生しました。もう一度お試しください。');return false}}
async function verify(s){try{const r=await authApi({action:'studentQrVerify',sessionToken:s.sessionToken});if(!okAuth(r))return false;save(normalize(r,s));showApp();return true}catch(e){return false}}
function showLogin(){$('app').classList.add('hide');$('login').classList.remove('hide');$('loginId').value=localStorage.getItem(K.id)||''}function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');$('userName').textContent=session?.name?session.name+' / 権限'+session.permissionLevel:''}
function jsonp(p){return new Promise((resolve,reject)=>{const cb='qr_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('通信エラー'))};s.src=API+'?'+new URLSearchParams({...p,staffLoginId:session.loginId,sessionToken:session.sessionToken,callback:cb});document.body.appendChild(s)})}
function reset(){clearTimeout(timer);$('info').classList.remove('show');$('status').className='status';$('statusTitle').textContent='';$('statusDetail').textContent='';$('contacts').textContent='';if($('qrNotifyEmails'))$('qrNotifyEmails').innerHTML='<span class="empty">確認中...</span>';$('qr').classList.remove('show');$('print').style.display='none';$('pdf').style.display='none';$('view').disabled=true;$('issue').disabled=true;msg('');student=null;qrData='';currentCode=''}
function renderQrNotifyEmails(r){const el=$('qrNotifyEmails');if(!el)return;const all=[];const add=v=>{v=String(v||'').trim();if(v&&!all.some(x=>x.toLowerCase()===v.toLowerCase()))all.push(v)};add(r&&r.guardianEmail);(Array.isArray(r&&r.deliveryEmails)?r.deliveryEmails:[]).forEach(add);(Array.isArray(r&&r.emails)?r.emails:[]).forEach(add);add(r&&r.email);add(r&&r.teacherEmail);if(!all.length){el.innerHTML='<span class="empty">メールアドレス未登録</span>';return}el.innerHTML=all.map(v=>'<div>・'+v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>').join('')}
function showQR(notice){if(!student||!qrData){msg('QR情報を確認中です。番号を入力して少しお待ちください。');return}msg('');$('pill').textContent='現行QR（現在有効）';$('pill').className='pill';$('code').textContent=student.code;$('student').textContent=student.name;$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData);$('qr').classList.add('show');$('print').style.display='block';$('print').textContent='QRコード印刷';$('pdf').style.display='block';currentCode=student.code;if(notice)msg('現在有効な「現行QR」を表示しています。',true)}
async function lookup(){clearTimeout(timer);const code=$('studentCode').value.trim();reset();if(!code)return;$('info').classList.add('show');$('studentName').textContent='生徒情報を確認中...';$('school').textContent='☆マスタのAZ列を確認しています。';const n=++seq;timer=setTimeout(async()=>{try{const r=await jsonp({action:'getStudent',code});if(n!==seq)return;if(!r.ok){$('studentName').textContent='生徒が見つかりません';$('school').textContent=r.message||'';msg(r.message||'生徒情報を取得できませんでした。');return}student={code,name:r.name||'(氏名なし)'};$('studentName').textContent=student.name;$('school').textContent=r.isTeacher?'講師':(r.school?r.school+'校':'');qrData=r.qrData||'';if(qrData){$('view').disabled=false;$('issue').disabled=true;render(true);showQR(false)}else{$('view').disabled=true;$('issue').disabled=false;render(false)}try{const c=await jsonp({action:'getNotifyEmails',code});if(n!==seq)return;const a=[...new Set((c.emails||[]).map(v=>String(v||'').trim()).filter(Boolean))];$('contacts').textContent=a.length?'登録済みの連絡先：'+a.join(' ／ '):'登録済みの連絡先：なし';renderQrNotifyEmails(c)}catch(e){if($('qrNotifyEmails'))$('qrNotifyEmails').innerHTML='<span class="empty">取得できませんでした</span>'}}catch(e){if(n===seq)msg('通信エラーが発生しました。もう一度お試しください。')}},200)}
function render(has){$('status').className='status show '+(has?'current':'none');$('statusTitle').textContent=has?'生徒用QRは登録済みです':'生徒用QRは未登録です';$('statusDetail').textContent=has?'☆マスタのAZ列に登録済みのQRを下に表示しています。この画面からそのまま印刷できます。':'「生徒用QRを作成してAZ列へ登録」を押すと、STEP-生徒番号のQRを作成し、☆マスタのAZ列へ保存します。';$('contacts').textContent='登録済みの連絡先：確認中...'}
async function issue(){const code=$('studentCode').value.trim();if(!code)return msg('生徒・講師番号を入力してください。');if(qrData)return showQR(false);const b=$('issue');b.disabled=true;b.textContent='発行中...';try{const r=await jsonp({action:'issueNewQr',code});if(!r.ok){msg(r.message||'発行に失敗しました。');return}student={code,name:r.name||'(氏名なし)'};qrData=r.qrData||'';$('studentName').textContent=student.name;$('code').textContent=code;$('student').textContent=student.name;$('qrImg').src=r.qrImageUrl||('https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData));$('pill').textContent='新しく作成した生徒用QR';$('pill').className='pill new';$('qr').classList.add('show');$('print').style.display='block';$('print').textContent='QRコード印刷';$('pdf').style.display='block';currentCode=code;$('status').className='status show done';$('statusTitle').textContent='生徒用QRを登録しました';$('statusDetail').textContent='下に表示しているQRを☆マスタのAZ列へ保存しました。このQRを印刷して使用してください。';$('view').disabled=!qrData;try{const c=await jsonp({action:'getNotifyEmails',code});renderQrNotifyEmails(c)}catch(e){};msg(r.name+' さんの生徒用QRを作成し、☆マスタのAZ列へ登録しました。',true)}catch(e){msg('通信エラーが発生しました。もう一度お試しください。')}finally{b.disabled=false;b.textContent='生徒用QRを作成してAZ列へ登録'}}
async function ensureJsPdf(){if(window.jspdf)return;await new Promise((resolve,reject)=>{const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';x.onload=resolve;x.onerror=()=>reject(new Error('PDFライブラリを読み込めませんでした'));document.head.appendChild(x)})}
async function sendPdf(){const email=$('email').value.trim();if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('pdfMsg').textContent='正しいメールアドレスを入力してください。';$('pdfMsg').className='msg err';return}if(!currentCode||!qrData){$('pdfMsg').textContent='先にQRを表示してください。';$('pdfMsg').className='msg err';return}try{$('send').disabled=true;$('send').textContent='送信中...';await ensureJsPdf();const img=await fetch('https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData)).then(r=>r.blob());const data=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(img)});const doc=new jspdf.jsPDF();doc.setFontSize(12);doc.text('個別指導ステップ',10,15);doc.setFontSize(20);doc.text(currentCode,10,28);doc.setFontSize(16);doc.text(student.name,10,38);doc.addImage(data,'PNG',25,45,55,55);const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sendQrPdf',code:currentCode,toEmail:email,pdfBase64:doc.output('datauristring'),staffLoginId:session.loginId,sessionToken:session.sessionToken})}).then(x=>x.json());$('pdfMsg').textContent=r.ok?'PDFをメールで送信しました。':(r.message||'送信に失敗しました。');$('pdfMsg').className='msg '+(r.ok?'ok':'err')}catch(e){$('pdfMsg').textContent='PDF送信に失敗しました。';$('pdfMsg').className='msg err'}finally{$('send').disabled=false;$('send').textContent='📧 PDFをメールで送る'}}
$('studentCode').addEventListener('input',lookup);$('view').addEventListener('click',()=>showQR(true));$('issue').addEventListener('click',issue);$('print').addEventListener('click',()=>window.print());$('send').addEventListener('click',sendPdf);$('logout').addEventListener('click',()=>{clear(true);reset();showLogin()});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('loginId').value.trim(),pw=$('password').value;if(!id||!pw)return loginMsg('IDとパスワードを入力してください。');$('loginBtn').disabled=true;await loginDo(id,pw);$('loginBtn').disabled=false});
(async()=>{const s=saved();if(s&&localStorage.getItem(K.logout)!=='1'){session=s;showApp();verify(s).then(ok=>{if(!ok){clear(false);showLogin()}});return}showLogin()})();
</script>
</body>
</html>
