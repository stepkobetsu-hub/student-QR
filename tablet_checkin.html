<script src="vendor/jsQR.js"></script>
<script>
// STEPシステム資産管理台帳で確認した「生徒QR」既存デプロイ。
const LEGACY_API_URL = "https://script.google.com/macros/s/AKfycbw8L36Fj8SKtvNHQBi41FMqAPvDLGAdu1bbLxvd-78A8dFUOkWGnYRE-8PRNq7QZOl70w/exec";
const DEFAULT_EDGE_API_URL = "https://step-checkin-edge-staging.stepkobetsu.workers.dev";
const EDGE_CONFIG_KEY = 'stepCheckinEdgeConfigV1';
const EDGE_DEVICE_ID_KEY = 'stepCheckinEdgeDeviceIdV1';

applyEdgeBootstrap();
const edgeConfig = loadEdgeConfig();
const edgeDeviceId = localStorage.getItem(EDGE_DEVICE_ID_KEY) || createEdgeDeviceId();
localStorage.setItem(EDGE_DEVICE_ID_KEY, edgeDeviceId);

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const photoCanvas = document.getElementById('photoCanvas');
const photoCtx = photoCanvas.getContext('2d');
const resultOverlay = document.getElementById('resultOverlay');
const qrWalker = document.getElementById('qrWalker');
const walkerCharacter = document.querySelector('.walker-character');
const walkerBody = document.querySelector('.walker-body');
  const splitLeft = document.querySelector('.fruit-split-left');
  const splitRight = document.querySelector('.fruit-split-right');
  const parachute = document.querySelector('.fruit-parachute');
const impactShadow = document.querySelector('.impact-shadow');
let walkerRouteTimer = 0;
let walkerRouteCycleIndex = 0;
let walkerSitSlot = 1;
const resultIcon = document.getElementById('resultIcon');
const resultCharacter = document.getElementById('resultCharacter');
const resultMascot = document.getElementById('resultMascot');
const resultName = document.getElementById('resultName');
const resultType = document.getElementById('resultType');
const resultTime = document.getElementById('resultTime');
const resultSub = document.getElementById('resultSub');
const resultPoints = document.getElementById('resultPoints');
const statusDot = document.getElementById('statusDot');
const clockEl = document.getElementById('clock');
const scanHint = document.getElementById('scanHint');

let scanning = true;
let requestInFlight = false;
let lastScannedCode = null;
let lastScannedTime = 0;
let lastAcceptedScan = null;
let activeReceiptId = '';
let scanStartedAt = Date.now();
let lastFrameAt = 0;
const RESCAN_COOLDOWN_MS = 5000;
const LOCAL_DUPLICATE_WINDOW_MS = 20 * 1000;
const NO_QR_HINT_MS = 4000;
const NO_QR_ERROR_MS = 10000;
const FRAME_INTERVAL_MS = 1000 / 12;
const SLOW_NOTICE_MS = 8000;
const REQUEST_TIMEOUT_MS = 15000;
const EDGE_REQUEST_TIMEOUT_MS = 25000;
const SUCCESS_RESUME_MS = 2500;
const DUPLICATE_RESUME_MS = 3500;
const MAIL_FAILURE_RESUME_MS = 3500;
const PHOTO_EXIT_ASSET = 'assets/checkin/goodbye-director-night-fast.webp?v=20260807';
const RARE_EXIT_ASSET = 'assets/checkin/goodbye-rare-woman.webp?v=20260819';
const PHOTO_EXIT_PROBABILITY = 0.10;
const RARE_EXIT_PROBABILITY = 0.05;
const MASCOT_EXIT_PROBABILITY = 0.05;

// 結果表示は短いため、軽量な写真版を起動時に読み込んでおく。
const exitPhotoPreload = new Image();
exitPhotoPreload.decoding = 'async';
exitPhotoPreload.fetchPriority = 'high';
exitPhotoPreload.src = PHOTO_EXIT_ASSET;
if (typeof exitPhotoPreload.decode === 'function') void exitPhotoPreload.decode().catch(() => {});
const rareExitPreload = new Image();
rareExitPreload.decoding = 'async';
rareExitPreload.fetchPriority = 'high';
rareExitPreload.src = RARE_EXIT_ASSET;
if (typeof rareExitPreload.decode === 'function') void rareExitPreload.decode().catch(() => {});

// 時計表示
function updateClock() {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
startRandomWalkerRoute();
updateClock();

// ===================================================================
// QR検知音（ファイル不要、Web Audioで生成する「ピッ」という電子音）
// ===================================================================
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1300, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.18);
  } catch (e) {
    // 音が鳴らせない環境では無視
  }
}

function playToneSequence(tones) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') void audioCtx.resume();
    const startedAt = audioCtx.currentTime + 0.02;
    tones.forEach((tone, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const at = startedAt + index * tone.gap;
      osc.type = tone.type || 'sine';
      osc.frequency.setValueAtTime(tone.hz, at);
      gain.gain.setValueAtTime(tone.volume || 0.22, at);
      gain.gain.exponentialRampToValueAtTime(0.001, at + tone.duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(at);
      osc.stop(at + tone.duration);
    });
  } catch (ignore) {}
}

function playSuccessSound() {
  playToneSequence([
    { hz: 740, duration: 0.16, gap: 0.18, volume: 0.2 },
    { hz: 1040, duration: 0.24, gap: 0.18, volume: 0.24 }
  ]);
  if (navigator.vibrate) navigator.vibrate(80);
}

function playErrorSound() {
  playToneSequence([
    { hz: 260, duration: 0.22, gap: 0.25, volume: 0.3, type: 'square' },
    { hz: 190, duration: 0.22, gap: 0.25, volume: 0.3, type: 'square' },
    { hz: 150, duration: 0.34, gap: 0.25, volume: 0.32, type: 'square' }
  ]);
  if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
}

// カメラ起動
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 12, max: 20 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    const track = stream.getVideoTracks()[0];
    if (track && typeof track.getCapabilities === 'function') {
      const caps = track.getCapabilities();
      if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (ignore) {}
      }
    }
    statusDot.classList.remove('error');
    scanStartedAt = Date.now();
    requestAnimationFrame(scanLoop);
  } catch (err) {
    statusDot.classList.add('error');
    alert('カメラを起動できませんでした。ブラウザのカメラ権限を確認してください。\n' + err.message);
  }
}

// QRスキャンループ
function scanLoop(frameTime) {
  if (!scanning || requestInFlight) {
    requestAnimationFrame(scanLoop);
    return;
  }

  if (frameTime - lastFrameAt < FRAME_INTERVAL_MS) {
    requestAnimationFrame(scanLoop);
    return;
  }
  lastFrameAt = frameTime;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const scale = Math.min(1, 960 / video.videoWidth, 540 / video.videoHeight);
    canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
    canvas.height = Math.max(1, Math.round(video.videoHeight * scale));
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let code = null;
    try {
      code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      statusDot.classList.remove('error');
    } catch (error) {
      statusDot.classList.add('error');
      scanHint.textContent = 'カメラ映像の解析を再試行しています';
      scanHint.classList.add('show');
    }

    if (code && code.data) {
      scanHint.classList.remove('show');
      const now = Date.now();
      if (code.data === lastScannedCode && (now - lastScannedTime) < RESCAN_COOLDOWN_MS) {
        // 直近で同じQRを読み取り済みなのでスキップ
      } else if (lastAcceptedScan && code.data === lastAcceptedScan.qrData &&
          (now - lastAcceptedScan.acceptedAt) < LOCAL_DUPLICATE_WINDOW_MS) {
        // 同じタブレットの60秒以内の再読取は、写真送信とサーバー通信を省略する。
        lastScannedCode = code.data;
        lastScannedTime = now;
        scanning = false;
        playBeep();
        showLocalDuplicate(lastAcceptedScan);
        finishAndResume(DUPLICATE_RESUME_MS);
      } else {
        lastScannedCode = code.data;
        lastScannedTime = now;
        scanning = false;
        playBeep();
        handleQrDetected(code.data);
      }
    } else if (Date.now() - scanStartedAt >= NO_QR_HINT_MS) {
      scanHint.textContent = Date.now() - scanStartedAt >= NO_QR_ERROR_MS
        ? 'QRを認識できません。QRを枠の中央に近づけてください'
        : 'QRを枠の中央に近づけてください';
      scanHint.classList.add('show');
    }
  }
  requestAnimationFrame(scanLoop);
}

// QR検出時の処理
async function handleQrDetected(qrData) {
  if (requestInFlight) return;
  requestInFlight = true;

  if (!isSupportedQrFormat(qrData)) {
    showResult(false, null, null, null, 'NOT_STARTED', null, 'QRの形式が正しくありません', false, 'INVALID_QR_FORMAT');
    finishAndResume(4500);
    return;
  }

  const receiptId = createReceiptId();
  activeReceiptId = receiptId;
  const clientTimings = { qrParsedAt: new Date().toISOString(), requestStartedAt: '' };

  // QRを認識したことを先に大きく表示し、保存処理は裏側で続ける
  showProcessing(qrData, receiptId);

  // 写真を撮影（QR検出時点のビデオフレームをそのまま使用）
  const photoScale = Math.min(1, 360 / video.videoWidth);
  photoCanvas.width = Math.max(1, Math.round(video.videoWidth * photoScale));
  photoCanvas.height = Math.max(1, Math.round(video.videoHeight * photoScale));
  photoCtx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
  const photoBase64 = photoCanvas.toDataURL('image/jpeg', 0.35);

  let resumeDelayMs = 4500;
  let slowTimer = setTimeout(() => {
    resultSub.textContent = '処理に時間がかかっています。受付状態を確認します…';
  }, SLOW_NOTICE_MS);

  try {
    clientTimings.requestStartedAt = new Date().toISOString();
    const requestStartedMs = performance.now();
    const data = await postCheckInWithBusyRetry({ action: 'checkIn', qrData, photoBase64, receiptId, clientTimings });
    clientTimings.responseReceivedAt = new Date().toISOString();
    clientTimings.requestMs = Math.round(performance.now() - requestStartedMs);
    console.info('qr-checkin-timing', { receiptId, requestMs: clientTimings.requestMs, server: data && data.timings || null, code: data && data.code || '' });
    rememberLocalAcceptedScan(qrData, data);
    renderServerResult(data);
    if (data && data.attendanceSaved) {
      resumeDelayMs = data.duplicate
        ? DUPLICATE_RESUME_MS
        : (data.mailStatus === 'FAILED' ? MAIL_FAILURE_RESUME_MS : SUCCESS_RESUME_MS);
      if (data.mailStatus === 'PENDING' || data.mailStatus === 'PROCESSING') {
        trackMailCompletionInBackground(receiptId);
      }
    }
  } catch (err) {
    if (err && err.name === 'AbortError') {
      const status = await resolveTimedOutReceipt(receiptId, qrData, photoBase64, clientTimings);
      rememberLocalAcceptedScan(qrData, status);
      renderServerResult(status);
      if (status && status.attendanceSaved) {
        resumeDelayMs = status.duplicate
          ? DUPLICATE_RESUME_MS
          : (status.mailStatus === 'FAILED' ? MAIL_FAILURE_RESUME_MS : SUCCESS_RESUME_MS);
        if (status.mailStatus === 'PENDING' || status.mailStatus === 'PROCESSING') {
          trackMailCompletionInBackground(receiptId);
        }
      }
    } else {
      const code = err && (err.code || err.message) || 'NETWORK_ERROR';
      const message = code === 'UNAUTHORIZED'
        ? 'この端末の受付設定を確認してください'
        : (code === 'SUBJECT_NOT_FOUND' ? '同期名簿にQRがありません。生徒マスタのQRと在籍状態を確認してください' : '通信に失敗しました');
      showResult(false, null, null, null, 'NOT_STARTED', null, message, false, code);
    }
  } finally {
    clearTimeout(slowTimer);
  }

  finishAndResume(resumeDelayMs);
}

function isSupportedQrFormat(value) {
  const qr = String(value || '').trim();
  return /^(?:STEP-[A-Za-z0-9_-]{1,40}|[0-9]{12,64})$/.test(qr);
}

function createReceiptId() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  return 'qr-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 14);
}

async function postWithTimeout(payload, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(LEGACY_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    if (!res.ok) throw new Error('HTTP_' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

async function postCheckInWithBusyRetry(payload) {
  if (edgeConfig) {
    try {
      return await postEdgeCheckIn(payload, EDGE_REQUEST_TIMEOUT_MS);
    } catch (error) {
      if (!shouldUseLegacyFallback(error)) throw error;
      console.warn('qr-checkin-edge-fallback', { receiptId: payload.receiptId, code: error && error.code || error && error.message || 'unknown' });
    }
  }
  return postLegacyCheckInWithBusyRetry(payload);
}

async function postLegacyCheckInWithBusyRetry(payload) {
  const retryDelays = [350, 700, 1200, 1800];
  for (let attempt = 0; attempt <= retryDelays.length; attempt += 1) {
    const data = await postWithTimeout(Object.assign({}, payload, { retry: attempt > 0 }), REQUEST_TIMEOUT_MS);
    if (!data || data.code !== 'BUSY') return data;
    if (attempt === retryDelays.length) return data;
    resultSub.textContent = 'ただいま混み合っています。順番に受付しています…（' + (attempt + 1) + '回目）';
    await new Promise(resolve => setTimeout(resolve, retryDelays[attempt]));
  }
  return { ok: false, code: 'BUSY', attendanceSaved: false, message: '受付が混み合っています' };
}

async function postEdgeCheckIn(payload, timeoutMs) {
  return postEdgeJson('/v1/checkins', {
    campus: edgeConfig.campus,
    qrKey: payload.qrData,
    receiptId: payload.receiptId,
    deviceId: edgeDeviceId,
    photoBase64: payload.photoBase64,
    clientTimings: payload.clientTimings || {}
  }, timeoutMs);
}

async function postReceiptStatus(receiptId, timeoutMs) {
  if (edgeConfig) {
    try {
      return await postEdgeJson('/v1/receipt-status', { campus: edgeConfig.campus, receiptId }, timeoutMs);
    } catch (error) {
      if (error && error.code === 'RECEIPT_NOT_FOUND') {
        return { ok: false, code: 'RECEIPT_NOT_FOUND', attendanceSaved: false, mailStatus: 'NOT_STARTED' };
      }
      if (!shouldUseLegacyFallback(error)) throw error;
    }
  }
  return postWithTimeout({ action: 'getReceiptStatus', receiptId }, timeoutMs);
}

async function postEdgeJson(path, payload, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(edgeConfig.apiUrl.replace(/\/$/, '') + path, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + edgeConfig.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    let data = null;
    try { data = await response.json(); } catch (ignore) {}
    if (!response.ok || !data || data.ok === false) {
      const error = new Error(data && data.code || ('HTTP_' + response.status));
      error.code = data && data.code || ('HTTP_' + response.status);
      error.httpStatus = response.status;
      throw error;
    }
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function shouldUseLegacyFallback(error) {
  if (!error) return true;
  if (error.name === 'AbortError') return true;
  if (typeof error.httpStatus !== 'number') return true;
  return error.httpStatus >= 500;
}

async function resolveTimedOutReceipt(receiptId, qrData, photoBase64, clientTimings) {
  try {
    const status = await postReceiptStatus(receiptId, 7000);
    if (status && status.attendanceSaved) return status;
    if (status && status.code === 'RECEIPT_NOT_FOUND') {
      return await postCheckInWithBusyRetry({ action: 'checkIn', qrData, photoBase64, receiptId, clientTimings, retry: true });
    }
  } catch (ignore) {}
  return { ok: false, code: 'TIMEOUT', message: '通信がタイムアウトしました', attendanceSaved: false };
}

async function waitForMailCompletion(receiptId, maxWaitMs) {
  const deadline = Date.now() + Math.max(1000, Number(maxWaitMs || 0));
  while (Date.now() < deadline) {
    await new Promise(resolve => setTimeout(resolve, 700));
    try {
      const status = await postReceiptStatus(receiptId, 3000);
      if (status && status.attendanceSaved && status.mailStatus !== 'PENDING' && status.mailStatus !== 'PROCESSING') return status;
    } catch (ignore) {}
  }
  return null;
}

function trackMailCompletionInBackground(receiptId) {
  // 入退室受付と次のスキャンを止めず、メール状態だけ非同期で確認する。
  void waitForMailCompletion(receiptId, 7000).then(status => {
    console.info('qr-checkin-mail-background', {
      receiptId,
      mailStatus: status && status.mailStatus || 'PENDING',
      code: status && status.code || ''
    });
    if (status && receiptId === activeReceiptId) updateVisibleCompletion(status);
  }).catch(error => {
    console.warn('qr-checkin-mail-background-failed', { receiptId, message: error && error.message || 'unknown' });
  });
}

function updateVisibleCompletion(status) {
  if (typeof status.totalPoints === 'number' && !status.isTeacher) {
    resultPoints.textContent = '⭐ 現在のポイント: ' + status.totalPoints + 'pt';
    resultPoints.style.display = 'inline-block';
  }
  if (status.mailStatus && status.mailStatus !== 'PENDING' && status.mailStatus !== 'PROCESSING') {
    resultSub.textContent = mailStatusText(status.mailStatus, status.code, status.mailProvider);
  }
}

function applyEdgeBootstrap() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get('edge') === 'clear') {
    localStorage.removeItem(EDGE_CONFIG_KEY);
    history.replaceState(null, '', location.pathname + location.search);
    return;
  }
  const token = params.get('token');
  if (!token) return;
  const apiUrl = params.get('api') || DEFAULT_EDGE_API_URL;
  if (!/^https:\/\/[A-Za-z0-9.-]+(?:\/[A-Za-z0-9._~!$&'()*+,;=:@%-]*)*$/.test(apiUrl)) return;
  localStorage.setItem(EDGE_CONFIG_KEY, JSON.stringify({ campus: 'jinryo', token, apiUrl }));
  history.replaceState(null, '', location.pathname + location.search);
}

function loadEdgeConfig() {
  try {
    const value = JSON.parse(localStorage.getItem(EDGE_CONFIG_KEY) || 'null');
    if (!value || !value.token || !/^https:\/\//.test(value.apiUrl)) return null;
    return { campus: 'jinryo', token: String(value.token), apiUrl: String(value.apiUrl) };
  } catch (ignore) {
    return null;
  }
}

function createEdgeDeviceId() {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') return 'tablet-' + window.crypto.randomUUID();
  return 'tablet-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 14);
}

function startRandomWalkerRoute() {
  var roll;
  var route;
  var minimum;
  var maximum;
  var duration;
  var restart;
  var effectNodes;
  var effectIndex;
  var targetFrame;
  var frameRect;
  var walkerRect;
  var sitNodes;
  var sitIndex;
  if (!qrWalker) return;
  if (walkerRouteCycleIndex === walkerSitSlot) {
    route = 'sit'; minimum = 18000; maximum = 26000;
  } else {
    roll = Math.random();
    if (roll < 0.25) {
      route = 'ground'; minimum = 11000; maximum = 18000;
    } else if (roll < 0.375) {
      route = 'trip'; minimum = 14000; maximum = 21000;
    } else if (roll < 0.525) {
      route = 'climb'; minimum = 16000; maximum = 24000;
    } else if (roll < 0.625) {
      route = 'high'; minimum = 18000; maximum = 27000;
    } else if (roll < 0.7125) {
      route = 'parachute'; minimum = 24000; maximum = 34000;
    } else if (roll < 0.7875) {
      route = 'fall'; minimum = 20000; maximum = 29000;
    } else if (roll < 0.85) {
      route = 'hop'; minimum = 9000; maximum = 14000;
    } else if (roll < 0.9125) {
      route = 'vanish'; minimum = 18000; maximum = 27000;
    } else if (roll < 0.9375) {
      route = 'juice'; minimum = 14000; maximum = 20000;
    } else {
      route = 'roll'; minimum = 12000; maximum = 18000;
    }
  }
  walkerRouteCycleIndex += 1;
  if (walkerRouteCycleIndex >= 5) {
    walkerRouteCycleIndex = 0;
    walkerSitSlot = Math.floor(Math.random() * 5);
  }
  duration = Math.round(minimum + Math.random() * (maximum - minimum));
  if (walkerRouteTimer) clearTimeout(walkerRouteTimer);
  qrWalker.className = '';
  restart = qrWalker.offsetWidth;
  if (route === 'sit') {
    targetFrame = document.getElementById('scanFrame') || document.getElementById('frame');
    if (targetFrame && qrWalker.style && qrWalker.style.setProperty) {
      frameRect = targetFrame.getBoundingClientRect();
      walkerRect = qrWalker.getBoundingClientRect();
      qrWalker.style.setProperty('--sit-x', Math.round(frameRect.left + frameRect.width * 0.5 - (walkerRect.left + walkerRect.width * 0.5)) + 'px');
      qrWalker.style.setProperty('--sit-y', Math.round(frameRect.top - (walkerRect.top + 65)) + 'px');
    }
  }
  qrWalker.className = 'walker-route-' + route;
  qrWalker.style.webkitAnimationDuration = duration + 'ms';
  qrWalker.style.animationDuration = duration + 'ms';
  if (walkerCharacter) {
    walkerCharacter.style.webkitAnimationDuration = duration + 'ms';
    walkerCharacter.style.animationDuration = duration + 'ms';
  }
  if (walkerBody) {
    walkerBody.style.webkitAnimationDuration = route === 'fall' ? duration + 'ms' : '.4s';
    walkerBody.style.animationDuration = route === 'fall' ? duration + 'ms' : '.4s';
  }
    if (splitLeft) {
      splitLeft.style.webkitAnimationDuration = duration + 'ms';
      splitLeft.style.animationDuration = duration + 'ms';
    }
    if (splitRight) {
      splitRight.style.webkitAnimationDuration = duration + 'ms';
      splitRight.style.animationDuration = duration + 'ms';
    }
    if (parachute) {
      parachute.style.webkitAnimationDuration = duration + 'ms';
      parachute.style.animationDuration = duration + 'ms';
    }
  if (impactShadow) {
    impactShadow.style.webkitAnimationDuration = duration + 'ms';
    impactShadow.style.animationDuration = duration + 'ms';
  }
  effectNodes = qrWalker.querySelectorAll('.fruit-juice-jet,.walker-body .fruit-leaf,.walker-body .fruit-stem');
  for (effectIndex = 0; effectIndex < effectNodes.length; effectIndex++) {
    effectNodes[effectIndex].style.webkitAnimationDuration = duration + 'ms';
    effectNodes[effectIndex].style.animationDuration = duration + 'ms';
  }
  if (route === 'sit') {
    sitNodes = qrWalker.querySelectorAll('.walker-leg');
    for (sitIndex = 0; sitIndex < sitNodes.length; sitIndex++) {
      sitNodes[sitIndex].style.webkitAnimationDuration = duration + 'ms';
      sitNodes[sitIndex].style.animationDuration = duration + 'ms';
    }
  }
  walkerRouteTimer = setTimeout(startRandomWalkerRoute, duration + 120);
}

function setWalkerVisible(visible) {
  if (!qrWalker) return;
  qrWalker.style.display = visible ? 'block' : 'none';
}

function showProcessing(qrData, receiptId) {
  setWalkerVisible(false);
  resultOverlay.className = '';
  resultIcon.textContent = '';
  resultCharacter.style.display = 'none';
  resultMascot.style.display = 'none';
  resultName.textContent = '';
  resultType.textContent = '';
  resultTime.textContent = '';
  resultSub.textContent = '';
  resultPoints.textContent = '';
  resultPoints.style.display = 'none';
  scanHint.textContent = '受付中です…';
  scanHint.classList.add('show');
}

function renderServerResult(data) {
  data = data || {};
  if (data.attendanceSaved) {
    showResult(true, data.name, data.type, data.label, data.mailStatus, data.totalPoints, data.message, data.isTeacher, data.code, data.duplicate, data.mailProvider);
  } else {
    showResult(false, null, null, null, data.mailStatus || 'NOT_STARTED', null, data.message, false, data.code, false, data.mailProvider);
  }
}

function rememberLocalAcceptedScan(qrData, data) {
  if (!data || !data.attendanceSaved || !data.name || !data.type) return;
  lastAcceptedScan = {
    qrData: qrData,
    acceptedAt: Date.now(),
    name: data.name,
    type: data.type,
    label: data.label,
    totalPoints: data.totalPoints,
    isTeacher: !!data.isTeacher
  };
}

function showLocalDuplicate(scan) {
  showResult(
    true,
    scan.name,
    scan.type,
    scan.label,
    'NOT_REQUIRED',
    scan.totalPoints,
    '',
    scan.isTeacher,
    'DUPLICATE_WITHIN_COOLDOWN',
    true,
    ''
  );
}

function showResult(ok, name, type, label, mailStatus, totalPoints, errorMsg, isTeacher, errorCode, duplicate, mailProvider) {
  setWalkerVisible(false);
  resultMascot.style.display = 'none';
  resultOverlay.classList.remove('photo-variant');
  if (ok && isTeacher) {
    const isCooldownDuplicate = duplicate && (errorCode === 'DUPLICATE_WITHIN_COOLDOWN' || errorCode === 'DUPLICATE_WITHIN_WINDOW');
    resultOverlay.className = isCooldownDuplicate
      ? ('show duplicate teacher' + (type === '退勤' ? ' duplicate-exit' : ''))
      : (mailStatus === 'FAILED' ? 'show warning teacher' : 'show teacher ' + (type === '出勤' ? 'entry' : 'exit'));
    resultIcon.textContent = '';
    resultCharacter.src = isCooldownDuplicate
      ? 'assets/checkin/duplicate.png?v=429da8e'
      : (type === '出勤'
        ? 'assets/checkin/teacher-arrival.png?v=20260806'
        : 'assets/checkin/teacher-goodbye.png?v=20260806');
    resultCharacter.style.display = 'block';
    resultName.textContent = name + ' 先生';
    resultType.textContent = isCooldownDuplicate
      ? (type === '出勤' ? '出勤済みです' : '退勤済みです')
      : (type === '出勤' ? '出勤しました' : '退勤しました');
    resultTime.textContent = label;
    resultSub.textContent = isCooldownDuplicate
      ? '20秒以内の重複読取のため、記録とメール送信は追加していません'
      : (duplicate ? 'すでに同じ受付を処理済みです' : mailStatusText(mailStatus, errorCode, mailProvider));
    resultPoints.style.display = 'none';
  } else if (ok) {
    const isCooldownDuplicate = duplicate && (errorCode === 'DUPLICATE_WITHIN_COOLDOWN' || errorCode === 'DUPLICATE_WITHIN_WINDOW');
    const exitVariantRoll = Math.random();
    const useMascotExitVariant = !isCooldownDuplicate && type === '退室' && exitVariantRoll < MASCOT_EXIT_PROBABILITY;
    const useRareExitVariant = !isCooldownDuplicate && type === '退室' && !useMascotExitVariant && exitVariantRoll < MASCOT_EXIT_PROBABILITY + RARE_EXIT_PROBABILITY;
    const usePhotoExitVariant = !isCooldownDuplicate && type === '退室' && !useMascotExitVariant && !useRareExitVariant && exitVariantRoll < MASCOT_EXIT_PROBABILITY + RARE_EXIT_PROBABILITY + PHOTO_EXIT_PROBABILITY;
    resultOverlay.className = isCooldownDuplicate
      ? ('show duplicate' + (type === '退室' ? ' duplicate-exit' : ''))
      : (mailStatus === 'FAILED' ? 'show warning' : 'show ' + (type === '入室' ? 'entry' : 'exit'));
    if (usePhotoExitVariant) resultOverlay.classList.add('photo-variant');
    if (useRareExitVariant) resultOverlay.classList.add('rare-variant');
    if (useMascotExitVariant) resultOverlay.classList.add('mascot-variant');
    resultIcon.textContent = '';
    if (useMascotExitVariant) {
      resultMascot.style.display = 'block';
      resultCharacter.style.display = 'none';
    } else {
      resultCharacter.src = isCooldownDuplicate
        ? 'assets/checkin/duplicate.png?v=429da8e'
        : (type === '入室'
          ? 'assets/checkin/welcome.png?v=429da8e'
          : (useRareExitVariant
            ? RARE_EXIT_ASSET
            : (usePhotoExitVariant
              ? PHOTO_EXIT_ASSET
              : 'assets/checkin/goodbye.png?v=429da8e')));
      resultCharacter.style.display = 'block';
    }
    resultName.textContent = name + ' さん';
    resultType.textContent = isCooldownDuplicate
      ? (type === '入室' ? '入室済みです' : '退室済みです')
      : (type === '入室' ? '入室しました' : '退室しました');
    resultTime.textContent = label;
    resultSub.textContent = isCooldownDuplicate
      ? '20秒以内の重複読取のため、記録とメール送信は追加していません'
      : (useMascotExitVariant ? 'また明日も来るんだぞ！' : (useRareExitVariant ? 'また明日も頑張ろうね！' : (duplicate ? 'すでに同じ受付を処理済みです' : mailStatusText(mailStatus, errorCode, mailProvider))));
    if (typeof totalPoints === 'number') {
      resultPoints.textContent = '⭐ 現在のポイント: ' + totalPoints + 'pt';
      resultPoints.style.display = 'inline-block';
    } else {
      resultPoints.style.display = 'none';
    }
  } else {
    resultOverlay.className = 'show error';
    resultIcon.textContent = '⚠️';
    resultCharacter.style.display = 'none';
    resultName.textContent = errorTitle(errorCode);
    resultType.textContent = '';
    resultTime.textContent = '';
    resultSub.textContent = errorMsg || 'もう一度お試しください';
    resultPoints.style.display = 'none';
  }
  if (ok) playSuccessSound();
  else playErrorSound();
}

function mailStatusText(status, code, provider) {
  if (provider === 'MAILAPP_FALLBACK' && status === 'SENT') return '入退室記録と通知メール送信が完了しました（MailApp一時送信）';
  if (provider === 'MAILAPP_FALLBACK' && status !== 'FAILED') return '受付完了（通知メールはMailAppでバックグラウンド送信）';
  if (code === 'MAILAPP_FALLBACK_ACTIVE') return '受付完了（通知メールはMailAppでバックグラウンド送信）';
  if (code === 'MAILAPP_SEND_FAILED') return '入退室記録は完了しましたが、MailAppでの通知送信に失敗しました';
  if (code === 'MAILAPP_DELIVERY_UNCERTAIN') return '入退室記録は完了しました。二重送信防止のためメール再送を停止しました';
  if (code === 'TEACHER_EMAIL_EMPTY') return '入退室記録が完了しました（講師メールアドレスが空欄のため通知先なし）';
  if (code === 'TEACHER_EMAIL_INVALID') return '入退室記録は完了しましたが、講師メールアドレスの形式が正しくありません';
  if (code === 'NOTIFICATION_CONFIG_ERROR') return '入退室記録は完了しましたが、通知設定に不備があります';
  if (code === 'BREVO_NOT_CONFIGURED') return '入退室記録は完了しましたが、メール送信APIが未設定です';
  if (code === 'BREVO_API_KEY_MISSING') return '入退室記録は完了しましたが、メール送信APIの認証設定がありません';
  if (code === 'MAIL_QUEUE_CREATE_FAILED') return '入退室記録は完了しましたが、メール送信予約を作成できませんでした';
  if (code === 'MAIL_WORKER_NOT_RUNNING') return '入退室記録は完了しましたが、メール送信処理が起動していません';
  if (code === 'BREVO_AUTH_FAILED') return '入退室記録は完了しましたが、メール送信APIの認証に失敗しました';
  if (code === 'BREVO_SEND_REJECTED') return '入退室記録は完了しましたが、メール送信APIに拒否されました';
  if (code === 'SENDER_CONFIG_INVALID') return '入退室記録は完了しましたが、送信元設定が正しくありません';
  if (code === 'RECIPIENT_INVALID') return '入退室記録は完了しましたが、通知先メールアドレスの形式が正しくありません';
  if (code === 'PHOTO_PROCESS_FAILED') return '入退室記録は完了しましたが、通知用写真を処理できませんでした';
  if (code === 'BREVO_API_TIMEOUT') return '入退室記録は完了しましたが、メール送信APIがタイムアウトしました';
  if (code === 'BREVO_SEND_FAILED') return '入退室記録は完了しましたが、通知メールの送信に失敗しました';
  if (status === 'FAILED') return '入退室記録は完了しましたが、通知メールの送信に失敗しました';
  if (status === 'SENT') return '入退室記録と通知メール送信が完了しました';
  if (status === 'NOT_REQUIRED') return '入退室記録が完了しました（通知先なし）';
  return '受付が完了しました。次のQRを読み取れます';
}

function errorTitle(code) {
  const titles = {
    INVALID_QR_FORMAT: 'QRの形式が正しくありません',
    TARGET_NOT_FOUND: '登録対象が見つかりません',
    TEACHER_NOT_FOUND: '講師の登録対象が見つかりません',
    TEACHER_EMAIL_EMPTY: '講師メールアドレスが空欄です',
    TEACHER_EMAIL_INVALID: '講師メールアドレスの形式が正しくありません',
    NOTIFICATION_CONFIG_ERROR: '通知設定に不備があります',
    BREVO_NOT_CONFIGURED: 'メール送信APIが未設定です',
    BREVO_API_KEY_MISSING: 'メール送信APIの認証設定がありません',
    MAILAPP_FALLBACK_ACTIVE: 'MailAppで一時送信します',
    MAILAPP_SEND_FAILED: 'MailAppでの通知送信に失敗しました',
    MAILAPP_DELIVERY_UNCERTAIN: '二重送信防止のためメール再送を停止しました',
    MAIL_QUEUE_CREATE_FAILED: 'メール送信予約を作成できませんでした',
    MAIL_WORKER_NOT_RUNNING: 'メール送信処理が起動していません',
    BREVO_AUTH_FAILED: 'メール送信APIの認証に失敗しました',
    BREVO_SEND_REJECTED: 'メール送信APIに拒否されました',
    SENDER_CONFIG_INVALID: '送信元設定が正しくありません',
    RECIPIENT_INVALID: '通知先メールアドレスの形式が正しくありません',
    PHOTO_PROCESS_FAILED: '通知用写真を処理できませんでした',
    BREVO_API_TIMEOUT: 'メール送信APIがタイムアウトしました',
    BREVO_SEND_FAILED: '通知メールの送信に失敗しました',
    SAVE_FAILED: '入退室記録の保存に失敗しました',
    TIMEOUT: '通信がタイムアウトしました',
    NETWORK_ERROR: '通信がタイムアウトしました',
    UNAUTHORIZED: 'この端末の受付設定を確認してください',
    SUBJECT_NOT_FOUND: '同期名簿にQRがありません。生徒マスタのQRと在籍状態を確認してください',
    ALREADY_PROCESSED: 'すでに同じ受付を処理済みです'
  };
  return titles[code] || '処理を完了できませんでした';
}

function finishAndResume(delayMs) {
  setTimeout(() => {
    resultOverlay.classList.remove('show', 'success', 'error', 'warning', 'entry', 'exit', 'duplicate', 'teacher');
    requestInFlight = false;
    scanning = true;
    scanStartedAt = Date.now();
    scanHint.classList.remove('show');
    setWalkerVisible(document.visibilityState !== 'hidden');
  }, delayMs);
}

document.addEventListener('visibilitychange', () => {
  setWalkerVisible(document.visibilityState !== 'hidden' && !requestInFlight && !resultOverlay.classList.contains('show'));
});

const previewMode = new URLSearchParams(location.search).get('preview');
if (previewMode === 'entry') {
  showResult(true, 'ステップ太郎', '入室', '16:30', 'SENT', 120, '', false, '', false, 'BREVO');
} else if (previewMode === 'exit') {
  showResult(true, 'ステップ太郎', '退室', '19:45', 'SENT', 120, '', false, '', false, 'BREVO');
} else if (previewMode === 'duplicate') {
  showResult(true, 'ステップ太郎', '入室', '16:31', 'NOT_REQUIRED', null, '', false, 'DUPLICATE_WITHIN_COOLDOWN', true, '');
} else if (previewMode === 'teacher-entry') {
  showResult(true, '山田', '出勤', '15:30', 'SENT', null, '', true, '', false, 'BREVO');
} else if (previewMode === 'teacher-exit') {
  showResult(true, '山田', '退勤', '21:15', 'SENT', null, '', true, '', false, 'BREVO');
} else if (previewMode === 'teacher-duplicate') {
  showResult(true, '山田', '出勤', '15:31', 'NOT_REQUIRED', null, '', true, 'DUPLICATE_WITHIN_COOLDOWN', true, '');
} else {
  startCamera();
}
</script>
