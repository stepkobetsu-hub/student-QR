<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17324d">
<title>入退室 | 軽量モード</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}video{width:100%;height:100%;object-fit:cover;-webkit-transform:scaleX(-1);transform:scaleX(-1)}
canvas{display:none}#frame{position:absolute;right:4%;bottom:16%;width:44%;height:28%;border:4px solid #fff;border-radius:14px}
#frame span{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
#top{position:absolute;left:0;right:0;top:0;padding:16px;text-align:center;background:rgba(0,0,0,.55)}#clock{font-size:23px;font-weight:bold}
#mode{font-size:13px;margin-top:4px;color:#d6e7ff}#status{position:absolute;left:12px;bottom:12px;width:14px;height:14px;border-radius:50%;background:#45c879}
#message{position:absolute;left:4%;right:4%;bottom:4%;padding:10px;text-align:center;background:rgba(0,0,0,.7);border-radius:12px;font-size:15px}
#result{display:none;position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;padding-top:24%;background:#17324d}
#result.show{display:block}#result.entry{background:#f5df4d;color:#17324d}#result.exit{background:#173b7a}#result.error{background:#a83232}
#name{font-size:36px;font-weight:bold}#type{font-size:30px;font-weight:bold;margin-top:14px}#detail{font-size:16px;margin:14px 22px;line-height:1.5}

#qrWalker{position:absolute;left:4%;bottom:78px;width:70px;height:88px;z-index:4;pointer-events:none}
#qrWalker.walker-hidden{display:none}
.walker-character{position:absolute;left:0;top:0;width:70px;height:88px;-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.impact-shadow{position:absolute;left:20px;bottom:-4px;width:30px;height:6px;border-radius:50%;background:rgba(0,0,0,.62);opacity:0;z-index:0;-webkit-transform-origin:50% 50%;transform-origin:50% 50%}
.walker-route-ground{-webkit-animation:walkerGround 1s ease-in-out 1 both;animation:walkerGround 1s ease-in-out 1 both}
.walker-route-climb{-webkit-animation:walkerClimb 1s ease-in-out 1 both;animation:walkerClimb 1s ease-in-out 1 both}
.walker-route-high{-webkit-animation:walkerHigh 1s ease-in-out 1 both;animation:walkerHigh 1s ease-in-out 1 both}
.walker-route-fall{-webkit-animation:walkerFall 1s ease-in-out 1 both;animation:walkerFall 1s ease-in-out 1 both}
.walker-route-fall .walker-character{-webkit-animation:fruitSquash 1s linear 1 both;animation:fruitSquash 1s linear 1 both}
.walker-route-fall .walker-body{-webkit-animation:fruitDamage 1s linear 1 both;animation:fruitDamage 1s linear 1 both}
.walker-route-fall .impact-shadow{-webkit-animation:impactShadow 1s linear 1 both;animation:impactShadow 1s linear 1 both}
.walker-body{position:absolute;left:6px;top:5px;width:58px;height:60px;border:2px solid #432d18;border-radius:48% 52% 46% 50%;box-sizing:border-box;background:radial-gradient(circle at 28% 20%,#ffe96c 0,#ffc42b 38%,#f28b16 100%);box-shadow:inset -5px -7px 0 rgba(190,89,10,.12),0 5px 12px rgba(0,0,0,.3);z-index:2;-webkit-animation:walkerBob .4s ease-in-out infinite alternate;animation:walkerBob .4s ease-in-out infinite alternate}
.fruit-stem{position:absolute;left:27px;top:-7px;width:4px;height:10px;border-radius:4px;background:#385d26;border:1px solid #253c1c;box-sizing:border-box}
.fruit-leaf{position:absolute;top:-8px;width:17px;height:10px;background:#75ad35;border:2px solid #365b23;box-sizing:border-box;z-index:3}.fruit-leaf-left{left:13px;border-radius:100% 8% 100% 8%;-webkit-transform:rotate(-22deg);transform:rotate(-22deg)}.fruit-leaf-right{right:12px;border-radius:8% 100% 8% 100%;-webkit-transform:rotate(22deg);transform:rotate(22deg)}
.fruit-brow{position:absolute;top:14px;width:14px;height:5px;border-top:2px solid #432d18;border-radius:50%}.fruit-brow-left{left:9px;-webkit-transform:rotate(7deg);transform:rotate(7deg)}.fruit-brow-right{right:9px;-webkit-transform:rotate(-7deg);transform:rotate(-7deg)}
.fruit-eye{position:absolute;top:19px;width:15px;height:9px;border:2px solid #432d18;border-radius:50%;box-sizing:border-box;background:#fff;-webkit-transform-origin:50% 50%;transform-origin:50% 50%;-webkit-animation:fruitBlink 4.2s linear infinite;animation:fruitBlink 4.2s linear infinite}.fruit-eye-left{left:9px}.fruit-eye-right{right:9px}.fruit-pupil{position:absolute;left:4px;top:1px;width:5px;height:5px;border-radius:50%;background:#2d2118}
.fruit-cheek{position:absolute;top:33px;width:11px;height:8px;border:1px solid #9a2737;border-radius:50%;box-sizing:border-box;background:#f05468;box-shadow:inset 2px 1px 0 rgba(255,255,255,.65)}.fruit-cheek-left{left:5px}.fruit-cheek-right{right:5px}
.fruit-mouth{position:absolute;left:19px;top:31px;width:18px;height:14px;border:2px solid #432d18;border-radius:3px 3px 12px 12px;box-sizing:border-box;background:#721d36;overflow:hidden}.fruit-tongue{position:absolute;left:4px;bottom:0;width:8px;height:5px;border-radius:8px 8px 0 0;background:#ff7690}
.fruit-dot{position:absolute;left:13px;top:47px;width:3px;height:3px;border-radius:50%;background:rgba(174,90,18,.45);box-shadow:12px 4px 0 rgba(174,90,18,.35),27px 1px 0 rgba(174,90,18,.4),34px 6px 0 rgba(174,90,18,.3)}
.walker-arm,.walker-leg{position:absolute;display:block;background:#432d18;border-radius:999px;box-sizing:border-box;z-index:1}
.walker-arm{top:34px;width:18px;height:3px}.walker-arm-left{left:0;-webkit-transform-origin:100% 50%;transform-origin:100% 50%;-webkit-animation:walkerArmLeft .4s ease-in-out infinite alternate;animation:walkerArmLeft .4s ease-in-out infinite alternate}.walker-arm-right{right:0;-webkit-transform-origin:0 50%;transform-origin:0 50%;-webkit-animation:walkerArmRight .4s ease-in-out infinite alternate;animation:walkerArmRight .4s ease-in-out infinite alternate}
.walker-leg{top:62px;width:3px;height:22px;-webkit-transform-origin:50% 0;transform-origin:50% 0}.walker-leg:after{content:'';position:absolute;left:-1px;bottom:0;width:12px;height:3px;border-radius:999px;background:#432d18}.walker-leg-left{left:23px;-webkit-animation:walkerLegLeft .4s ease-in-out infinite alternate;animation:walkerLegLeft .4s ease-in-out infinite alternate}.walker-leg-left:after{-webkit-transform:rotate(-14deg);transform:rotate(-14deg)}.walker-leg-right{right:23px;-webkit-animation:walkerLegRight .4s ease-in-out infinite alternate;animation:walkerLegRight .4s ease-in-out infinite alternate}.walker-leg-right:after{left:-8px;-webkit-transform:rotate(14deg);transform:rotate(14deg)}
@-webkit-keyframes walkerGround{0%{-webkit-transform:translate3d(0,0,0)}50%{-webkit-transform:translate3d(37vw,0,0)}100%{-webkit-transform:translate3d(0,0,0)}}@keyframes walkerGround{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(37vw,0,0)}100%{transform:translate3d(0,0,0)}}
@-webkit-keyframes walkerClimb{0%{-webkit-transform:translate3d(0,0,0)}25%{-webkit-transform:translate3d(37vw,0,0)}45%{-webkit-transform:translate3d(37vw,-32vh,0)}65%{-webkit-transform:translate3d(8vw,-32vh,0)}82%,100%{-webkit-transform:translate3d(0,0,0)}}@keyframes walkerClimb{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(37vw,0,0)}45%{transform:translate3d(37vw,-32vh,0)}65%{transform:translate3d(8vw,-32vh,0)}82%,100%{transform:translate3d(0,0,0)}}
@-webkit-keyframes walkerHigh{0%{-webkit-transform:translate3d(0,0,0)}22%{-webkit-transform:translate3d(37vw,0,0)}40%{-webkit-transform:translate3d(37vw,-48vh,0)}62%{-webkit-transform:translate3d(8vw,-48vh,0)}78%{-webkit-transform:translate3d(0,-22vh,0)}86%,100%{-webkit-transform:translate3d(0,0,0)}}@keyframes walkerHigh{0%{transform:translate3d(0,0,0)}22%{transform:translate3d(37vw,0,0)}40%{transform:translate3d(37vw,-48vh,0)}62%{transform:translate3d(8vw,-48vh,0)}78%{transform:translate3d(0,-22vh,0)}86%,100%{transform:translate3d(0,0,0)}}
@-webkit-keyframes walkerFall{0%{-webkit-transform:translate3d(0,0,0)}22%{-webkit-transform:translate3d(37vw,0,0)}38%{-webkit-transform:translate3d(37vw,-50vh,0)}60%{-webkit-transform:translate3d(12vw,-50vh,0)}70%{-webkit-transform:translate3d(0,-50vh,0)}72%,87%{-webkit-transform:translate3d(0,0,0)}94%{-webkit-transform:translate3d(18vw,0,0)}100%{-webkit-transform:translate3d(0,0,0)}}@keyframes walkerFall{0%{transform:translate3d(0,0,0)}22%{transform:translate3d(37vw,0,0)}38%{transform:translate3d(37vw,-50vh,0)}60%{transform:translate3d(12vw,-50vh,0)}70%{transform:translate3d(0,-50vh,0)}72%,87%{transform:translate3d(0,0,0)}94%{transform:translate3d(18vw,0,0)}100%{transform:translate3d(0,0,0)}}
@-webkit-keyframes fruitSquash{0%,69%,100%{-webkit-transform:scale(1) rotate(0)}70%{-webkit-transform:scale(1) rotate(-12deg)}72%{-webkit-transform:scaleX(1.65) scaleY(.38) skewX(-9deg) rotate(-3deg)}75%{-webkit-transform:scaleX(1.58) scaleY(.4) skewX(15deg) rotate(3deg)}79%{-webkit-transform:scaleX(1.72) scaleY(.34) skewX(-12deg) rotate(-2deg)}84%{-webkit-transform:scaleX(1.62) scaleY(.38) skewX(8deg)}85%,100%{-webkit-transform:scale(1) rotate(0)}}@keyframes fruitSquash{0%,69%,100%{transform:scale(1) rotate(0)}70%{transform:scale(1) rotate(-12deg)}72%{transform:scaleX(1.65) scaleY(.38) skewX(-9deg) rotate(-3deg)}75%{transform:scaleX(1.58) scaleY(.4) skewX(15deg) rotate(3deg)}79%{transform:scaleX(1.72) scaleY(.34) skewX(-12deg) rotate(-2deg)}84%{transform:scaleX(1.62) scaleY(.38) skewX(8deg)}85%,100%{transform:scale(1) rotate(0)}}
@-webkit-keyframes fruitDamage{0%,70%,100%{-webkit-transform:scale(1) rotate(0);border-radius:48% 52% 46% 50%}72%{-webkit-transform:scaleX(1.45) scaleY(.62) skewX(-13deg) rotate(5deg);border-radius:62% 28% 68% 22%}75%{-webkit-transform:scaleX(1.38) scaleY(.68) skewX(16deg) rotate(-5deg);border-radius:24% 70% 30% 66%}79%{-webkit-transform:scaleX(1.5) scaleY(.58) skewX(-10deg) rotate(3deg);border-radius:70% 20% 58% 36%}84%{-webkit-transform:scaleX(1.4) scaleY(.64) skewX(9deg) rotate(-2deg);border-radius:30% 64% 24% 72%}85%,100%{-webkit-transform:scale(1) rotate(0);border-radius:48% 52% 46% 50%}}@keyframes fruitDamage{0%,70%,100%{transform:scale(1) rotate(0);border-radius:48% 52% 46% 50%}72%{transform:scaleX(1.45) scaleY(.62) skewX(-13deg) rotate(5deg);border-radius:62% 28% 68% 22%}75%{transform:scaleX(1.38) scaleY(.68) skewX(16deg) rotate(-5deg);border-radius:24% 70% 30% 66%}79%{transform:scaleX(1.5) scaleY(.58) skewX(-10deg) rotate(3deg);border-radius:70% 20% 58% 36%}84%{transform:scaleX(1.4) scaleY(.64) skewX(9deg) rotate(-2deg);border-radius:30% 64% 24% 72%}85%,100%{transform:scale(1) rotate(0);border-radius:48% 52% 46% 50%}}
@-webkit-keyframes impactShadow{0%,70%,86%,100%{opacity:0;-webkit-transform:scaleX(.2)}72%,84%{opacity:.82;-webkit-transform:scaleX(2.7)}85%{opacity:.18;-webkit-transform:scaleX(1)}}@keyframes impactShadow{0%,70%,86%,100%{opacity:0;transform:scaleX(.2)}72%,84%{opacity:.82;transform:scaleX(2.7)}85%{opacity:.18;transform:scaleX(1)}}
@-webkit-keyframes walkerBob{from{-webkit-transform:translateY(0) rotate(-1deg)}to{-webkit-transform:translateY(3px) rotate(1deg)}}@keyframes walkerBob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(3px) rotate(1deg)}}
@-webkit-keyframes fruitBlink{0%,45%,49%,100%{-webkit-transform:scaleY(1)}47%{-webkit-transform:scaleY(.15)}}@keyframes fruitBlink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.15)}}
@-webkit-keyframes walkerArmLeft{from{-webkit-transform:rotate(32deg)}to{-webkit-transform:rotate(-24deg)}}@keyframes walkerArmLeft{from{transform:rotate(32deg)}to{transform:rotate(-24deg)}}
@-webkit-keyframes walkerArmRight{from{-webkit-transform:rotate(-32deg)}to{-webkit-transform:rotate(24deg)}}@keyframes walkerArmRight{from{transform:rotate(-32deg)}to{transform:rotate(24deg)}}
@-webkit-keyframes walkerLegLeft{from{-webkit-transform:rotate(18deg)}to{-webkit-transform:rotate(-18deg)}}@keyframes walkerLegLeft{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@-webkit-keyframes walkerLegRight{from{-webkit-transform:rotate(-18deg)}to{-webkit-transform:rotate(18deg)}}@keyframes walkerLegRight{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@media (prefers-reduced-motion:reduce){#qrWalker,.walker-character,.impact-shadow,.walker-body,.walker-arm,.walker-leg,.fruit-eye{-webkit-animation:none;animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="scanCanvas"></canvas>
  <canvas id="photoCanvas"></canvas>
  <div id="frame"><span>ここにQRをかざす</span></div>
  <div id="top"><div id="clock">--:--</div><div id="mode">古いタブレット用・軽量モード</div></div>
  <div id="status"></div>
  <div id="message">カメラを準備しています</div>
  <div id="qrWalker" aria-hidden="true">
    <div class="walker-character">
      <span class="walker-arm walker-arm-left"></span><span class="walker-arm walker-arm-right"></span>
      <span class="walker-leg walker-leg-left"></span><span class="walker-leg walker-leg-right"></span>
      <div class="walker-body">
        <span class="fruit-stem"></span><span class="fruit-leaf fruit-leaf-left"></span><span class="fruit-leaf fruit-leaf-right"></span>
        <span class="fruit-brow fruit-brow-left"></span><span class="fruit-brow fruit-brow-right"></span>
        <span class="fruit-eye fruit-eye-left"><span class="fruit-pupil"></span></span><span class="fruit-eye fruit-eye-right"><span class="fruit-pupil"></span></span>
        <span class="fruit-cheek fruit-cheek-left"></span><span class="fruit-cheek fruit-cheek-right"></span>
        <span class="fruit-mouth"><span class="fruit-tongue"></span></span><span class="fruit-dot"></span>
      </div>
    </div>
    <span class="impact-shadow"></span>
  </div>
  <div id="result"><div id="name"></div><div id="type"></div><div id="detail"></div></div>
</div>
<script src="vendor/jsQR.js"></script>
<script>
(function () {
  'use strict';
  var API_DEFAULT = 'https://step-checkin-edge-staging.stepkobetsu.workers.dev';
  var CONFIG_KEY = 'stepCheckinEdgeConfigV1';
  var DEVICE_KEY = 'stepCheckinEdgeDeviceIdV1';
  var FRAME_INTERVAL = 200;
  var REQUEST_TIMEOUT = 25000;
  var video = document.getElementById('video');
  var scanCanvas = document.getElementById('scanCanvas');
  var scanContext = scanCanvas.getContext('2d');
  var photoCanvas = document.getElementById('photoCanvas');
  var photoContext = photoCanvas.getContext('2d');
  var message = document.getElementById('message');
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  var qrWalker = document.getElementById('qrWalker');
  var walkerCharacter = document.querySelector('.walker-character');
  var walkerBody = document.querySelector('.walker-body');
  var impactShadow = document.querySelector('.impact-shadow');
  var walkerRouteTimer = 0;
  var nameEl = document.getElementById('name');
  var typeEl = document.getElementById('type');
  var detailEl = document.getElementById('detail');
  var config;
  var deviceId;
  var busy = false;
  var lastFrameAt = 0;
  var lastCode = '';
  var lastCodeAt = 0;
  var raf = window.requestAnimationFrame || function (callback) { return setTimeout(function () { callback(Date.now()); }, 40); };

  function parseParams(raw) {
    var values = {};
    var items = String(raw || '').replace(/^[?#]/, '').split('&');
    var i;
    var pair;
    var key;
    var value;
    for (i = 0; i < items.length; i += 1) {
      if (!items[i]) continue;
      pair = items[i].split('=');
      try {
        key = decodeURIComponent(pair.shift().replace(/\+/g, ' '));
        value = decodeURIComponent(pair.join('=').replace(/\+/g, ' '));
        values[key] = value;
      } catch (ignore) {}
    }
    return values;
  }

  function bootstrapConfig() {
    var params = parseParams(location.hash);
    var token = params.token;
    var apiUrl = params.api || API_DEFAULT;
    if (token && /^https:\/\//.test(apiUrl)) {
      try {
        localStorage.setItem(CONFIG_KEY, JSON.stringify({ campus: 'jinryo', token: token, apiUrl: apiUrl }));
        if (history && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
      } catch (ignore) {}
    }
  }

  function loadConfig() {
    try {
      var value = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
      if (!value || !value.token || !/^https:\/\//.test(value.apiUrl)) return null;
      return { campus: 'jinryo', token: String(value.token), apiUrl: String(value.apiUrl) };
    } catch (ignore) {
      return null;
    }
  }

  function makeDeviceId() {
    return 'legacy-tablet-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function updateClock() {
    var now = new Date();
    var hours = String(now.getHours());
    var minutes = String(now.getMinutes());
    if (hours.length < 2) hours = '0' + hours;
    if (minutes.length < 2) minutes = '0' + minutes;
    document.getElementById('clock').innerHTML = hours + ':' + minutes;
  }

  function showError(text) {
    status.style.background = '#e34b4b';
    message.innerHTML = text;
  }

  function requestCamera(success, failure) {
    var modern = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
    var constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
    if (modern) {
      navigator.mediaDevices.getUserMedia(constraints).then(success, function () {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(success, failure);
      });
      return;
    }
    if (legacy) {
      legacy.call(navigator, { video: true, audio: false }, success, failure);
      return;
    }
    failure({ message: 'このブラウザーはカメラに対応していません' });
  }

  function attachStream(stream) {
    try {
      if ('srcObject' in video) video.srcObject = stream;
      else video.src = (window.URL || window.webkitURL).createObjectURL(stream);
      var played = video.play();
      if (played && played.catch) played.catch(function () {});
      status.style.background = '#45c879';
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      raf(scanLoop);
    } catch (error) {
      showError('カメラ映像を表示できませんでした');
    }
  }

  function scanLoop(frameTime) {
    var width;
    var height;
    var scale;
    var image;
    var code;
    var now;
    if (!busy && frameTime - lastFrameAt >= FRAME_INTERVAL && video.readyState >= 2) {
      lastFrameAt = frameTime;
      width = video.videoWidth || 640;
      height = video.videoHeight || 480;
      scale = Math.min(1, 480 / width, 360 / height);
      scanCanvas.width = Math.max(1, Math.round(width * scale));
      scanCanvas.height = Math.max(1, Math.round(height * scale));
      try {
        scanContext.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
        image = scanContext.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        code = window.jsQR ? window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'dontInvert' }) : null;
        if (code && code.data) {
          now = Date.now();
          if (code.data !== lastCode || now - lastCodeAt >= 5000) {
            lastCode = code.data;
            lastCodeAt = now;
            submitCode(code.data);
          }
        }
      } catch (ignore) {}
    }
    raf(scanLoop);
  }

  function validQr(value) {
    return /^(?:STEP-[A-Za-z0-9_-]{1,40}|[0-9]{12,64})$/.test(String(value || '').replace(/^\s+|\s+$/g, ''));
  }

  function receiptId() {
    return 'legacy-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  function takePhoto() {
    var width = video.videoWidth || 640;
    var height = video.videoHeight || 480;
    var scale = Math.min(1, 280 / width);
    try {
      photoCanvas.width = Math.max(1, Math.round(width * scale));
      photoCanvas.height = Math.max(1, Math.round(height * scale));
      photoContext.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      return photoCanvas.toDataURL('image/jpeg', 0.28);
    } catch (ignore) {
      return '';
    }
  }

  function submitCode(qrData) {
    var xhr;
    var id;
    var payload;
    if (busy) return;
    if (!validQr(qrData)) {
      displayResult(false, '', '', 'QRの形式が正しくありません');
      return;
    }
    if (!config) {
      displayResult(false, '', '', 'この端末の受付設定を読み込めません。画面を開き直してください');
      return;
    }
    busy = true;
    setWalkerVisible(false);
    message.innerHTML = '確認しています。初回の名簿更新には20秒ほどかかる場合があります';
    id = receiptId();
    payload = {
      campus: config.campus,
      qrKey: String(qrData).replace(/^\s+|\s+$/g, ''),
      receiptId: id,
      deviceId: deviceId,
      photoBase64: takePhoto(),
      clientTimings: { compatibilityMode: true }
    };
    xhr = new XMLHttpRequest();
    xhr.open('POST', String(config.apiUrl).replace(/\/$/, '') + '/v1/checkins', true);
    xhr.timeout = REQUEST_TIMEOUT;
    xhr.setRequestHeader('Authorization', 'Bearer ' + config.token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      var data;
      if (xhr.readyState !== 4) return;
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (ignore) { data = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && data.attendanceSaved) {
        displayResult(true, data.name || '', data.type || '', data.duplicate ? '60秒以内の同じ受付です' : (data.label || ''));
      } else if (data.code === 'UNAUTHORIZED') {
        displayResult(false, '', '', 'この端末の受付設定を確認してください');
      } else if (data.code === 'SUBJECT_NOT_FOUND') {
        displayResult(false, '', '', '同期名簿にQRがありません。生徒マスタのQRと在籍状態を確認してください');
      } else {
        displayResult(false, '', '', '通信に失敗しました。もう一度かざしてください');
      }
    };
    xhr.ontimeout = function () { displayResult(false, '', '', '確認に時間がかかりました。もう一度かざしてください'); };
    xhr.onerror = function () { displayResult(false, '', '', '通信できませんでした。接続を確認してください'); };
    try { xhr.send(JSON.stringify(payload)); } catch (error) { displayResult(false, '', '', '通信を開始できませんでした'); }
  }

  function startRandomWalkerRoute() {
    var roll;
    var route;
    var minimum;
    var maximum;
    var duration;
    var restart;
    if (!qrWalker) return;
    roll = Math.random();
    if (roll < 0.38) {
      route = 'ground'; minimum = 9000; maximum = 15000;
    } else if (roll < 0.63) {
      route = 'climb'; minimum = 13000; maximum = 20000;
    } else if (roll < 0.78) {
      route = 'high'; minimum = 15000; maximum = 22000;
    } else {
      route = 'fall'; minimum = 16000; maximum = 24000;
    }
    duration = Math.round(minimum + Math.random() * (maximum - minimum));
    if (walkerRouteTimer) clearTimeout(walkerRouteTimer);
    qrWalker.className = '';
    restart = qrWalker.offsetWidth;
    qrWalker.className = 'walker-route-' + route;
    qrWalker.style.webkitAnimationDuration = duration + 'ms';
    qrWalker.style.animationDuration = duration + 'ms';
    if (walkerCharacter) {
      walkerCharacter.style.webkitAnimationDuration = duration + 'ms';
      walkerCharacter.style.animationDuration = duration + 'ms';
    }
    if (walkerBody) {
      walkerBody.style.webkitAnimationDuration = route === 'fall' ? duration + 'ms' : '.4s';
      walkerBody.style.animationDuration = route === 'fall' ? duration + 'ms' : '.4s';
    }
    if (impactShadow) {
      impactShadow.style.webkitAnimationDuration = duration + 'ms';
      impactShadow.style.animationDuration = duration + 'ms';
    }
    walkerRouteTimer = setTimeout(startRandomWalkerRoute, duration + 120);
  }

  function setWalkerVisible(visible) {
    if (!qrWalker) return;
    qrWalker.style.display = visible ? 'block' : 'none';
  }

  function displayResult(ok, name, type, detail) {
    setWalkerVisible(false);
    result.className = 'show ' + (ok ? (type === '入室' || type === '出勤' ? 'entry' : 'exit') : 'error');
    nameEl.innerHTML = ok ? escapeText(name) + ' さん' : '受付できませんでした';
    typeEl.innerHTML = ok ? escapeText(type) : '';
    detailEl.innerHTML = escapeText(detail || '');
    setTimeout(function () {
      result.className = '';
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      busy = false;
      setWalkerVisible(document.visibilityState !== 'hidden');
    }, ok ? 2500 : 4000);
  }

  function escapeText(value) {
    return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  bootstrapConfig();
  config = loadConfig();
  try {
    deviceId = localStorage.getItem(DEVICE_KEY) || makeDeviceId();
    localStorage.setItem(DEVICE_KEY, deviceId);
  } catch (ignore) {
    deviceId = makeDeviceId();
  }
  updateClock();
  setInterval(updateClock, 1000);
  startRandomWalkerRoute();
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      setWalkerVisible(document.visibilityState !== 'hidden' && !busy && result.className.indexOf('show') === -1);
    }, false);
  }
  if (!window.jsQR) {
    showError('QR読取機能を読み込めませんでした');
  } else {
    requestCamera(attachStream, function (error) {
      showError('カメラを起動できませんでした。カメラ権限を確認してください');
    });
  }
})();
</script>
</body>
</html>
