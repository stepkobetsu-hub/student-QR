@-webkit-keyframes walkerArmRight{from{-webkit-transform:rotate(-32deg)}to{-webkit-transform:rotate(24deg)}}@keyframes walkerArmRight{from{transform:rotate(-32deg)}to{transform:rotate(24deg)}}

@media (prefers-reduced-motion:reduce){#qrWalker,.walker-character,.impact-shadow,.walker-body,.fruit-split-half,.fruit-parachute,.fruit-juice-jet,.fruit-stem,.fruit-leaf,.walker-arm,.walker-leg,.fruit-eye{-webkit-animation:none;animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="scanCanvas"></canvas>
  <canvas id="photoCanvas"></canvas>
  <div id="frame"><span>ここにQRをかざす</span></div>
  <div id="top"><div id="clock">--:--</div><div id="mode">古いタブレット用・軽量モード</div></div>
  <div id="status"></div>
  <div id="message">カメラを準備しています</div>
  <div id="qrWalker" aria-hidden="true">
    <div class="walker-character">
      <div class="fruit-parachute"><span class="parachute-canopy"></span><span class="parachute-cord parachute-cord-left"></span><span class="parachute-cord parachute-cord-right"></span></div>
      <span class="fruit-juice-jet"></span>
      <span class="walker-arm walker-arm-left"></span><span class="walker-arm walker-arm-right"></span>
      <span class="walker-leg walker-leg-left"></span><span class="walker-leg walker-leg-right"></span>
      <div class="walker-body">
        <span class="fruit-stem"></span><span class="fruit-leaf fruit-leaf-left"></span><span class="fruit-leaf fruit-leaf-right"></span>
        <span class="fruit-brow fruit-brow-left"></span><span class="fruit-brow fruit-brow-right"></span>
        <span class="fruit-eye fruit-eye-left"><span class="fruit-pupil"></span></span><span class="fruit-eye fruit-eye-right"><span class="fruit-pupil"></span></span>
        <span class="fruit-cheek fruit-cheek-left"></span><span class="fruit-cheek fruit-cheek-right"></span>
        <span class="fruit-mouth"><span class="fruit-tongue"></span></span><span class="fruit-dot"></span>
      </div>
      <div class="fruit-split-half fruit-split-left"><span class="split-leaf"></span><span class="split-eye"></span><span class="split-cheek"></span></div>
      <div class="fruit-split-half fruit-split-right"><span class="split-leaf"></span><span class="split-eye"></span><span class="split-cheek"></span></div>
    </div>
    <span class="impact-shadow"></span>
  </div>
  <div id="result"><div id="resultContent"><div id="name"></div><div id="type"></div><div id="detail"></div></div><img id="resultCharacter" alt=""><div id="resultMascot" aria-hidden="true"><span class="mascot-chair-back"></span><span class="mascot-chair-seat"></span><span class="mascot-chair-arm mascot-chair-arm-left"></span><span class="mascot-chair-arm mascot-chair-arm-right"></span><span class="mascot-chair-leg mascot-chair-leg-left"></span><span class="mascot-chair-leg mascot-chair-leg-right"></span><div class="result-mascot-character"><span class="walker-arm walker-arm-left result-arm-proud"></span><span class="walker-arm walker-arm-right result-wave-arm"></span><span class="walker-leg walker-leg-left result-leg-left"></span><span class="walker-leg walker-leg-right result-leg-right"></span><div class="walker-body result-mascot-body"><span class="fruit-stem"></span><span class="fruit-leaf fruit-leaf-left"></span><span class="fruit-leaf fruit-leaf-right"></span><span class="fruit-brow fruit-brow-left"></span><span class="fruit-brow fruit-brow-right"></span><span class="fruit-eye fruit-eye-left"><span class="fruit-pupil"></span></span><span class="fruit-eye fruit-eye-right"><span class="fruit-pupil"></span></span><span class="fruit-cheek fruit-cheek-left"></span><span class="fruit-cheek fruit-cheek-right"></span><span class="fruit-mouth"><span class="fruit-tongue"></span></span><span class="fruit-dot"></span></div></div></div></div>
</div>
<script src="vendor/jsQR.js"></script>
<script>
(function () {
  'use strict';
  var API_DEFAULT = 'https://step-checkin-edge-staging.stepkobetsu.workers.dev';
  var CONFIG_KEY = 'stepCheckinEdgeConfigV1';
  var DEVICE_KEY = 'stepCheckinEdgeDeviceIdV1';
  var FRAME_INTERVAL = 200;
  var REQUEST_TIMEOUT = 25000;
  var ASSET_BASE = 'https://stepkobetsu-hub.github.io/student-QR/assets/checkin/';
  var PHOTO_EXIT_ASSET = 'goodbye-director-night-fast.webp?v=20260807';
  var RARE_EXIT_ASSET = 'goodbye-rare-woman.webp?v=20260819';
  var PHOTO_EXIT_PROBABILITY = 0.10;
  var RARE_EXIT_PROBABILITY = 0.05;
  var MASCOT_EXIT_PROBABILITY = 0.05;
  var video = document.getElementById('video');
  var scanCanvas = document.getElementById('scanCanvas');
  var scanContext = scanCanvas.getContext('2d');
  var photoCanvas = document.getElementById('photoCanvas');
  var photoContext = photoCanvas.getContext('2d');
  var message = document.getElementById('message');
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  var resultCharacter = document.getElementById('resultCharacter');
  var resultMascot = document.getElementById('resultMascot');
  var qrWalker = document.getElementById('qrWalker');
  var walkerCharacter = document.querySelector('.walker-character');
  var walkerBody = document.querySelector('.walker-body');
  var splitLeft = document.querySelector('.fruit-split-left');
  var splitRight = document.querySelector('.fruit-split-right');
  var parachute = document.querySelector('.fruit-parachute');
  var impactShadow = document.querySelector('.impact-shadow');
  var walkerRouteTimer = 0;
  var walkerRouteCycleIndex = 0;
  var walkerSitSlot = 1;
  var nameEl = document.getElementById('name');
  var typeEl = document.getElementById('type');
  var detailEl = document.getElementById('detail');
  var config;
  var deviceId;
  var busy = false;
  var lastFrameAt = 0;
  var lastCode = '';
  var lastCodeAt = 0;
  var raf = window.requestAnimationFrame || function (callback) { return setTimeout(function () { callback(Date.now()); }, 40); };

  function parseParams(raw) {
    var values = {};
    var items = String(raw || '').replace(/^[?#]/, '').split('&');
    var i;
    var pair;
    var key;
    var value;
    for (i = 0; i < items.length; i += 1) {
      if (!items[i]) continue;
      pair = items[i].split('=');
      try {
        key = decodeURIComponent(pair.shift().replace(/\+/g, ' '));
        value = decodeURIComponent(pair.join('=').replace(/\+/g, ' '));
        values[key] = value;
      } catch (ignore) {}
    }
    return values;
  }

  function bootstrapConfig() {
    var params = parseParams(location.hash);
    var token = params.token;
    var apiUrl = params.api || API_DEFAULT;
    if (token && /^https:\/\//.test(apiUrl)) {
      try {
        localStorage.setItem(CONFIG_KEY, JSON.stringify({ campus: 'jinryo', token: token, apiUrl: apiUrl }));
        if (history && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
      } catch (ignore) {}
    }
  }

  function loadConfig() {
    try {
      var value = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
      if (!value || !value.token || !/^https:\/\//.test(value.apiUrl)) return null;
      return { campus: 'jinryo', token: String(value.token), apiUrl: String(value.apiUrl) };
    } catch (ignore) {
      return null;
    }
  }

  function makeDeviceId() {
    return 'legacy-tablet-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function warmEdgeConnection() {
    var xhr;
    if (!config) return;
    try {
      xhr = new XMLHttpRequest();
      xhr.open('GET', String(config.apiUrl).replace(/\/$/, '') + '/health', true);
      xhr.timeout = 5000;
      xhr.send();
    } catch (ignore) {}
  }

  function updateClock() {
    var now = new Date();
    var hours = String(now.getHours());
    var minutes = String(now.getMinutes());
    if (hours.length < 2) hours = '0' + hours;
    if (minutes.length < 2) minutes = '0' + minutes;
    document.getElementById('clock').innerHTML = hours + ':' + minutes;
  }

  function showError(text) {
    status.style.background = '#e34b4b';
    message.innerHTML = text;
  }

  function requestCamera(success, failure) {
    var modern = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
    var constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
    if (modern) {
      navigator.mediaDevices.getUserMedia(constraints).then(success, function () {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(success, failure);
      });
      return;
    }
    if (legacy) {
      legacy.call(navigator, { video: true, audio: false }, success, failure);
      return;
    }
    failure({ message: 'このブラウザーはカメラに対応していません' });
  }

  function attachStream(stream) {
    try {
      if ('srcObject' in video) video.srcObject = stream;
      else video.src = (window.URL || window.webkitURL).createObjectURL(stream);
      var played = video.play();
      if (played && played.catch) played.catch(function () {});
      status.style.background = '#45c879';
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      raf(scanLoop);
    } catch (error) {
      showError('カメラ映像を表示できませんでした');
    }
  }

  function scanLoop(frameTime) {
    var width;
    var height;
    var scale;
    var image;
    var code;
    var now;
    if (!busy && frameTime - lastFrameAt >= FRAME_INTERVAL && video.readyState >= 2) {
      lastFrameAt = frameTime;
      width = video.videoWidth || 640;
      height = video.videoHeight || 480;
      scale = Math.min(1, 480 / width, 360 / height);
      scanCanvas.width = Math.max(1, Math.round(width * scale));
      scanCanvas.height = Math.max(1, Math.round(height * scale));
      try {
        scanContext.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
        image = scanContext.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        code = window.jsQR ? window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'dontInvert' }) : null;
        if (code && code.data) {
          now = Date.now();
          if (code.data !== lastCode || now - lastCodeAt >= 5000) {
            lastCode = code.data;
            lastCodeAt = now;
            submitCode(code.data);
          }
        }
      } catch (ignore) {}
    }
    raf(scanLoop);
  }

  function validQr(value) {
    return /^(?:STEP-[A-Za-z0-9_-]{1,40}|[0-9]{12,64})$/.test(String(value || '').replace(/^\s+|\s+$/g, ''));
  }

  function receiptId() {
    return 'legacy-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  function takePhoto() {
    var width = video.videoWidth || 640;
    var height = video.videoHeight || 480;
    var scale = Math.min(1, 280 / width);
    try {
      photoCanvas.width = Math.max(1, Math.round(width * scale));
      photoCanvas.height = Math.max(1, Math.round(height * scale));
      photoContext.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      return photoCanvas.toDataURL('image/jpeg', 0.28);
    } catch (ignore) {
      return '';
    }
  }

  function submitCode(qrData) {
    var xhr;
    var id;
    var payload;
    if (busy) return;
    if (!validQr(qrData)) {
      displayResult(false, '', '', 'QRの形式が正しくありません');
      return;
    }
    if (!config) {
      displayResult(false, '', '', 'この端末の受付設定を読み込めません。画面を開き直してください');
      return;
    }
    busy = true;
    displayProcessing();
    id = receiptId();
    payload = {
      campus: config.campus,
      qrKey: String(qrData).replace(/^\s+|\s+$/g, ''),
      receiptId: id,
      deviceId: deviceId,
      photoBase64: takePhoto(),
      clientTimings: { compatibilityMode: true }
    };
    xhr = new XMLHttpRequest();
    xhr.open('POST', String(config.apiUrl).replace(/\/$/, '') + '/v1/checkins', true);
    xhr.timeout = REQUEST_TIMEOUT;
    xhr.setRequestHeader('Authorization', 'Bearer ' + config.token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      var data;
      if (xhr.readyState !== 4) return;
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (ignore) { data = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && data.attendanceSaved) {
        displayResult(true, data.name || '', data.type || '', data.duplicate ? '20秒以内の同じ受付です' : (data.label || ''), !!data.duplicate, !!data.isTeacher);
      } else if (data.code === 'UNAUTHORIZED') {
        displayResult(false, '', '', 'この端末の受付設定を確認してください');
      } else if (data.code === 'SUBJECT_NOT_FOUND') {
        displayResult(false, '', '', '同期名簿にQRがありません。生徒マスタのQRと在籍状態を確認してください');
      } else {
        displayResult(false, '', '', '通信に失敗しました。もう一度かざしてください');
      }
    };
    xhr.ontimeout = function () { displayResult(false, '', '', '確認に時間がかかりました。もう一度かざしてください'); };
    xhr.onerror = function () { displayResult(false, '', '', '通信できませんでした。接続を確認してください'); };
    try { xhr.send(JSON.stringify(payload)); } catch (error) { displayResult(false, '', '', '通信を開始できませんでした'); }
  }

  function startRandomWalkerRoute() {
    var roll;
    var route;
    var minimum;
    var maximum;
    var duration;
    var restart;
    var effectNodes;
    var effectIndex;
    var targetFrame;
    var frameRect;
    var walkerRect;
    var sitNodes;
    var sitIndex;
    if (!qrWalker) return;
    if (walkerRouteCycleIndex === walkerSitSlot) {
      route = 'sit'; minimum = 18000; maximum = 26000;
    } else {
      roll = Math.random();
      if (roll < 0.25) {
        route = 'ground'; minimum = 11000; maximum = 18000;
      } else if (roll < 0.375) {
        route = 'trip'; minimum = 14000; maximum = 21000;
      } else if (roll < 0.525) {
        route = 'climb'; minimum = 16000; maximum = 24000;
      } else if (roll < 0.625) {
        route = 'high'; minimum = 18000; maximum = 27000;
      } else if (roll < 0.7125) {
        route = 'parachute'; minimum = 24000; maximum = 34000;
      } else if (roll < 0.7875) {
        route = 'fall'; minimum = 20000; maximum = 29000;
      } else if (roll < 0.85) {
        route = 'hop'; minimum = 9000; maximum = 14000;
      } else if (roll < 0.9125) {
        route = 'vanish'; minimum = 18000; maximum = 27000;
      } else if (roll < 0.9375) {
        route = 'juice'; minimum = 14000; maximum = 20000;
      } else {
        route = 'roll'; minimum = 12000; maximum = 18000;
      }
    }
    walkerRouteCycleIndex += 1;
    if (walkerRouteCycleIndex >= 5) {
      walkerRouteCycleIndex = 0;
      walkerSitSlot = Math.floor(Math.random() * 5);
    }
    duration = Math.round(minimum + Math.random() * (maximum - minimum));
    if (walkerRouteTimer) clearTimeout(walkerRouteTimer);
    qrWalker.className = '';
    restart = qrWalker.offsetWidth;
    if (route === 'sit') {
      targetFrame = document.getElementById('scanFrame') || document.getElementById('frame');
      if (targetFrame && qrWalker.style && qrWalker.style.setProperty) {
        frameRect = targetFrame.getBoundingClientRect();
        walkerRect = qrWalker.getBoundingClientRect();
        qrWalker.style.setProperty('--sit-x', Math.round(frameRect.left + frameRect.width * 0.5 - (walkerRect.left + walkerRect.width * 0.5)) + 'px');
        qrWalker.style.setProperty('--sit-y', Math.round(frameRect.top - (walkerRect.top + 65)) + 'px');
      }
    }
    qrWalker.className = 'walker-route-' + route;
    qrWalker.style.webkitAnimationDuration = duration + 'ms';
    qrWalker.style.animationDuration = duration + 'ms';
    if (walkerCharacter) {
      walkerCharacter.style.webkitAnimationDuration = duration + 'ms';
      walkerCharacter.style.animationDuration = duration + 'ms';
    }
    if (walkerBody) {
      walkerBody.style.webkitAnimationDuration = route === 'fall' ? duration + 'ms' : '.4s';
      walkerBody.style.animationDuration = route === 'fall' ? duration + 'ms' : '.4s';
    }
    if (splitLeft) {
      splitLeft.style.webkitAnimationDuration = duration + 'ms';
      splitLeft.style.animationDuration = duration + 'ms';
    }
    if (splitRight) {
      splitRight.style.webkitAnimationDuration = duration + 'ms';
      splitRight.style.animationDuration = duration + 'ms';
    }
    if (parachute) {
      parachute.style.webkitAnimationDuration = duration + 'ms';
      parachute.style.animationDuration = duration + 'ms';
    }
    if (impactShadow) {
      impactShadow.style.webkitAnimationDuration = duration + 'ms';
      impactShadow.style.animationDuration = duration + 'ms';
    }
    effectNodes = qrWalker.querySelectorAll('.fruit-juice-jet,.walker-body .fruit-leaf,.walker-body .fruit-stem');
    for (effectIndex = 0; effectIndex < effectNodes.length; effectIndex++) {
      effectNodes[effectIndex].style.webkitAnimationDuration = duration + 'ms';
      effectNodes[effectIndex].style.animationDuration = duration + 'ms';
    }
    if (route === 'sit') {
      sitNodes = qrWalker.querySelectorAll('.walker-leg');
      for (sitIndex = 0; sitIndex < sitNodes.length; sitIndex++) {
        sitNodes[sitIndex].style.webkitAnimationDuration = duration + 'ms';
        sitNodes[sitIndex].style.animationDuration = duration + 'ms';
      }
    }
    walkerRouteTimer = setTimeout(startRandomWalkerRoute, duration + 120);
  }

  function setWalkerVisible(visible) {
    if (!qrWalker) return;
    qrWalker.style.display = visible ? 'block' : 'none';
  }

  function displayProcessing() {
    setWalkerVisible(false);
    resultCharacter.style.display = 'none';
    resultMascot.style.display = 'none';
    result.className = '';
    nameEl.innerHTML = '';
    typeEl.innerHTML = '';
    detailEl.innerHTML = '';
    message.innerHTML = '受付中です…';
  }

  function displayResult(ok, name, type, detail, duplicate, isTeacher) {
    var exitVariantRoll = Math.random();
    var isStudentExit = ok && !duplicate && !isTeacher && type === '退室';
    var useMascotExitVariant = isStudentExit && exitVariantRoll < MASCOT_EXIT_PROBABILITY;
    var useRareExitVariant = isStudentExit && !useMascotExitVariant && exitVariantRoll < MASCOT_EXIT_PROBABILITY + RARE_EXIT_PROBABILITY;
    var usePhotoExitVariant = isStudentExit && !useMascotExitVariant && !useRareExitVariant && exitVariantRoll < MASCOT_EXIT_PROBABILITY + RARE_EXIT_PROBABILITY + PHOTO_EXIT_PROBABILITY;
    var character = '';
    setWalkerVisible(false);
    resultCharacter.style.display = 'none';
    resultMascot.style.display = 'none';
    result.className = 'show ' + (ok ? (duplicate ? 'duplicate' : (type === '入室' || type === '出勤' ? 'entry' : 'exit')) : 'error') + (duplicate && (type === '退室' || type === '退勤') ? ' duplicate-exit' : '') + (isTeacher ? ' teacher' : '') + (usePhotoExitVariant ? ' photo-variant' : '') + (useRareExitVariant ? ' rare-variant' : '') + (useMascotExitVariant ? ' mascot-variant' : '');
    nameEl.innerHTML = ok ? escapeText(name) + (isTeacher ? ' 先生' : ' さん') : '受付できませんでした';
    typeEl.innerHTML = ok ? (duplicate ? escapeText(type) + '済みです' : (type === '入室' ? '入室しました' : (type === '退室' ? '退室しました' : escapeText(type)))) : '';
    detailEl.innerHTML = escapeText(duplicate ? '20秒以内の重複読取です' : (useMascotExitVariant ? 'また明日も来るんだぞ！' : (useRareExitVariant ? 'また明日も頑張ろうね！' : (detail || '受付が完了しました'))));
    if (ok && duplicate) {
      character = isTeacher ? 'teacher-duplicate.png' : 'duplicate.png';
      resultCharacter.src = ASSET_BASE + character;
      resultCharacter.style.display = 'block';
    } else if (ok && !isTeacher && (type === '入室' || type === '退室')) {
      if (useMascotExitVariant) {
        resultMascot.style.display = 'block';
      } else {
        character = type === '入室' ? 'welcome.png' : (useRareExitVariant ? RARE_EXIT_ASSET : (usePhotoExitVariant ? PHOTO_EXIT_ASSET : 'goodbye.png'));
        resultCharacter.onerror = function () { resultCharacter.onerror = null; resultCharacter.src = ASSET_BASE + (type === '入室' ? 'welcome.png' : 'goodbye.png'); };
        resultCharacter.src = ASSET_BASE + character;
        resultCharacter.style.display = 'block';
      }
    }
    setTimeout(function () {
      result.className = '';
      resultCharacter.style.display = 'none';
      resultMascot.style.display = 'none';
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      busy = false;
      setWalkerVisible(document.visibilityState !== 'hidden');
    }, ok ? 3000 : 4000);
  }

  function escapeText(value) {
    return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  bootstrapConfig();
  config = loadConfig();
  try {
    deviceId = localStorage.getItem(DEVICE_KEY) || makeDeviceId();
    localStorage.setItem(DEVICE_KEY, deviceId);
  } catch (ignore) {
    deviceId = makeDeviceId();
  }
  updateClock();
  setInterval(updateClock, 1000);
  warmEdgeConnection();
  setInterval(warmEdgeConnection, 30000);
  startRandomWalkerRoute();
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      setWalkerVisible(document.visibilityState !== 'hidden' && !busy && result.className.indexOf('show') === -1);
      if (document.visibilityState !== 'hidden') warmEdgeConnection();
    }, false);
  }
  if (!window.jsQR) {
    showError('QR読取機能を読み込めませんでした');
  } else {
    requestCamera(attachStream, function (error) {
      showError('カメラを起動できませんでした。カメラ権限を確認してください');
    });
  }
})();
</script>
