<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不達メール管理</title><link rel="icon" type="image/svg+xml" href="icons/delivery-failure-icon.svg?v=20260727">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:18px}.head,.card{background:#fff;border-radius:16px;box-shadow:0 5px 22px #18314d14;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.headLinks{display:flex;gap:8px;flex-wrap:wrap}h1{font-size:1.45rem;margin:0}.back,.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;text-decoration:none;background:#e8eef6;color:#18314d}.btn.primary{background:#1769aa;color:#fff}.btn.danger{background:#b42318;color:#fff}.btn.warn{background:#a15c00;color:#fff}.btn.archive{background:#5b6472;color:#fff}.reportSettingsButton{background:#0f766e;color:#fff;font-weight:800;box-shadow:0 3px 10px #0f766e33}.notice{padding:12px;border-left:4px solid #d58b00;background:#fff8e6;line-height:1.6}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;align-items:end}.filters #confirmStatus{grid-column:1/3;height:46px}.filters .checks.wide{grid-column:3/6;min-height:46px;padding:0 8px;flex-wrap:nowrap}.filters .checks label{display:flex;align-items:center;gap:6px;white-space:nowrap}.filters>button{grid-column:6/7;min-height:46px;align-self:end}.filters input,.filters select{width:100%;padding:10px;border:1px solid #ccd6e0;border-radius:9px}.checks{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #e4e9ef;text-align:left;vertical-align:top;font-size:.9rem}th{background:#f7f9fc;position:sticky;top:0}.badge{display:inline-block;padding:3px 8px;border-radius:20px;background:#e8eef6}.archiveBadge{background:#5b6472;color:#fff}.stopped{color:#b42318;font-weight:700}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:#687588}.mobileCards{display:none}.failureCard{background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:14px;margin-bottom:12px}.failureCard.archived{border-color:#8b95a5;background:#f7f8fa}.failureCard dl{display:grid;grid-template-columns:100px 1fr;gap:7px;margin:0 0 12px}.failureCard dt{font-weight:700;color:#536174}.failureCard dd{margin:0;overflow-wrap:anywhere}.failureCard .actions{display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:8px}.failureCard .btn{min-width:100px;white-space:nowrap}dialog{border:0;border-radius:15px;max-width:780px;width:calc(100% - 28px);max-height:88vh;overflow:auto;padding:22px}dialog::backdrop{background:#10182899}.detailGrid{display:grid;grid-template-columns:150px 1fr;gap:8px}.raw{white-space:pre-wrap;overflow-wrap:anywhere;background:#101828;color:#e7edf6;padding:12px;border-radius:9px;max-height:300px;overflow:auto}.historyBtn{font-size:1.08rem;font-weight:900;padding:14px 24px;min-width:190px;min-height:50px;background:linear-gradient(135deg,#7c3aed,#4f46e5)!important;color:#fff!important;border:2px solid #4338ca;box-shadow:0 7px 18px #4f46e54d;letter-spacing:.03em;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}.historyBtn:hover{transform:translateY(-1px);box-shadow:0 9px 22px #4f46e566;filter:saturate(1.12)}.actions .historyBtn{flex:1 0 100%;width:100%}.failureCard .historyBtn{grid-column:1/-1}.dialogHead{position:sticky;top:-22px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-22px -22px 14px;padding:16px 22px 12px;background:#fff;border-bottom:1px solid #e4e9ef}.dialogHead h2{margin:0;font-size:1.25rem}.dialogClose{margin-left:auto;min-width:88px;font-weight:700;white-space:nowrap}.historyIntro{background:#f4f7fb;border-radius:12px;padding:13px;line-height:1.7;margin-bottom:14px}.historyList{display:grid;gap:10px}.historyItem{border:1px solid #d9e3ee;border-left:5px solid #1769aa;border-radius:12px;padding:12px;background:#fff}.historyItem.errorItem{border-left-color:#b42318;background:#fffafa}.historyHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.historyTitle{font-weight:800}.historyTime{color:#536174}.historyMeta{margin-top:7px;color:#536174;line-height:1.55}.historyReason{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff0f0;color:#8f1710;overflow-wrap:anywhere}.historyStatus{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:800;background:#eef2f6}.historyStatus.ok{background:#e6f6ed;color:#157347}.historyStatus.pending{background:#fff4db;color:#875400}.historyStatus.fail{background:#fde8e7;color:#b42318}.spamBox{background:#fff1f0;padding:12px;border-radius:10px}.spamBox textarea{width:100%;min-height:85px}.reportSettingsIntro{line-height:1.7;color:#465568}.reportSettingsGrid{display:grid;gap:10px;margin:14px 0}.reportSettingsGrid label{font-weight:700}.reportSettingsGrid input{width:100%;margin-top:5px;padding:11px;border:1px solid #bac8d6;border-radius:9px;font:inherit}.reportSettingsActions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reportSettingsStatus{min-height:1.5em;color:#157347;font-weight:700}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#eaf5ff}.error{background:#fff0f0;color:#a00}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.summaryItem{padding:8px 12px;border-radius:10px;background:#f4f7fb;font-weight:700}.summaryItem.alert{background:#fff0f0;color:#b42318}.countBadge{display:none;min-width:24px;height:24px;padding:2px 7px;border-radius:999px;background:#d92d20;color:#fff;text-align:center;font-weight:800;margin-left:7px}.hidden{display:none!important}.loginCard{max-width:440px;margin:64px auto}.loginCard label{display:block;font-weight:700;margin:12px 0 6px}.loginCard input{width:100%;padding:11px;border:1px solid #ccd6e0;border-radius:9px}.loginActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:760px){.wrap{padding:9px}.head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}.filters #confirmStatus{grid-column:1/-1}.filters .checks.wide{grid-column:1/-1;flex-wrap:wrap;padding:4px 0}.filters>button{grid-column:1/-1}.detailGrid{grid-template-columns:1fr}.filters .wide{grid-column:1/-1}h1{font-size:1.2rem}.tableWrap{display:none}.mobileCards{display:block}.actions .btn{min-height:42px}.notice{font-size:.9rem}}
</style></head><body><section id="loginPanel" class="wrap hidden"><div class="card loginCard"><h1>不達メール管理 ログイン</h1><label for="loginCode">講師番号</label><input id="loginCode" type="text" inputmode="numeric" autocomplete="username"><label for="loginPassword">パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"><label><input id="rememberLogin" type="checkbox" checked> この端末にID・パスワードを記憶する</label><div class="loginActions"><button id="loginBtn" class="btn primary" type="button" onclick="loginDeliveryApp()">ログイン</button><button class="btn" type="button" onclick="clearSavedLogin()">保存情報を消す</button></div><div id="loginMessage"></div></div></section><main id="app" class="wrap hidden">
<section class="head"><div><h1>不達メール管理 <span id="headerBadge" class="countBadge"></span></h1><div id="staff"></div></div><div class="headLinks"><button id="reportSettingsButton" class="back reportSettingsButton hidden" type="button" onclick="openReportSettings()">報告メール設定</button><a class="back" href="https://stepkobetsu-hub.github.io/student-QR/archive_delivery_failures.html">非表示データの管理</a><a class="back" href="https://stepkobetsu-hub.github.io/seiseki-kanri/">← スタッフ用アプリ</a><button class="back" type="button" onclick="logoutDeliveryApp()">ログアウト</button></div></section>
<section class="notice">「配信済み」は受信サーバーまで届いたことを示します。<br>迷惑メールフォルダへの振り分けや、保護者が実際に閲覧したことを保証するものではありません。</section>
<section class="card"><div class="filters">
<input id="email" placeholder="メールアドレス検索"><input id="student" placeholder="生徒番号・氏名検索"><input id="school" placeholder="校舎">
<label>送信元<select id="source"><option value="">すべて</option><option value="QR_ATTENDANCE">出退くんQR</option><option value="STEP_MESSAGE_CENTER">STEP配信</option></select></label>
<select id="event"><option value="">全イベント</option><option value="hard_bounce">hard_bounce</option><option value="soft_bounce">soft_bounce</option><option value="deferred">deferred</option><option value="blocked">blocked</option><option value="invalid_email">invalid_email</option><option value="spam">spam</option><option value="error">error</option></select>
<select id="state"><option value="">全状態</option><option>一時エラー</option><option>恒久不達</option><option>ブロック</option><option>無効アドレス</option><option>迷惑メール報告</option><option>送信エラー</option></select>
<select id="confirmStatus"><option value="">全確認状態</option><option value="未確認">未確認</option><option value="確認済み">確認済み</option></select>
<div class="checks wide"><label><input id="unconfirmed" type="checkbox"> 未確認のみ</label><label><input id="stopped" type="checkbox"> 送信停止中のみ</label><label><input id="includeArchived" type="checkbox"> 非表示を含める</label></div>
<button class="btn primary" onclick="loadItems()">検索・更新</button></div><div id="message"></div><div class="summary"><div class="summaryItem alert">未確認 <span id="count">0</span>件</div><div class="summaryItem">送信停止中 <span id="stoppedCount">0</span>件</div><div class="summaryItem">本日発生 <span id="todayCount">0</span>件</div></div></section>
<section class="card tableWrap"><table><thead><tr><th>メールアドレス</th><th>発生時刻</th><th>理由</th><th>生徒氏名</th><th>校舎</th><th>送信元</th><th>メール区分</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
<section id="cards" class="mobileCards"></section>
</main>
<dialog id="detail"><div class="dialogHead"><h2>不達メール詳細</h2><button class="back dialogClose" onclick="$('detail').close()">閉じる</button></div><div id="detailBody"></div></dialog>
<dialog id="historyDialog"><div class="dialogHead"><h2>送信状況履歴</h2><button class="back dialogClose" onclick="$('historyDialog').close()">閉じる</button></div><div id="historyBody"></div></dialog>
<dialog id="reportSettingsDialog"><div class="dialogHead"><h2>報告メール設定</h2><button class="back dialogClose" onclick="$('reportSettingsDialog').close()">閉じる</button></div><p class="reportSettingsIntro">不達メールが新しく発生したときの報告先を設定します。最大4アドレスまで登録できます。</p><div class="reportSettingsGrid"><label>報告先1<input id="reportEmail1" type="email" autocomplete="email" placeholder="メールアドレス"></label><label>報告先2<input id="reportEmail2" type="email" autocomplete="email" placeholder="未使用の場合は空欄"></label><label>報告先3<input id="reportEmail3" type="email" autocomplete="email" placeholder="未使用の場合は空欄"></label><label>報告先4<input id="reportEmail4" type="email" autocomplete="email" placeholder="未使用の場合は空欄"></label></div><div class="reportSettingsActions"><button id="saveReportSettingsButton" class="btn primary" type="button" onclick="saveReportSettings()">設定を保存</button><div id="reportSettingsStatus" class="reportSettingsStatus"></div></div></dialog>
<script>
const API='https://script.google.com/macros/s/AKfycbw8L36Fj8SKtvNHQBi41FMqAPvDLGAdu1bbLxvd-78A8dFUOkWGnYRE-8PRNq7QZOl70w/exec';
const AUTH_KEY='stepStaffAppAuth',CODE_KEY='stepStaffAppCode',SESSION_PASSWORD_KEY='deliveryFailuresPassword',DELIVERY_LOGIN_KEY='deliveryFailuresSavedLogin',STAFF_APP_URL='https://stepkobetsu-hub.github.io/seiseki-kanri/';let auth=null,staffPassword='',items=[],currentStaffLevel='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('DOMContentLoaded',()=>{let saved=null;try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){}try{saved=JSON.parse(localStorage.getItem(DELIVERY_LOGIN_KEY)||'null')}catch(e){}const code=String(saved?.code||auth?.code||localStorage.getItem(CODE_KEY)||'').trim();auth=Object.assign({},auth||{},{code});$('loginCode').value=code;$('loginPassword').value=String(saved?.password||'');$('rememberLogin').checked=!!saved;$('staff').textContent=(auth.name||code||'スタッフ')+' さん';$('source').addEventListener('change',loadItems);$('loginCode').addEventListener('keydown',event=>{if(event.key==='Enter')$('loginPassword').focus()});$('loginPassword').addEventListener('keydown',event=>{if(event.key==='Enter')loginDeliveryApp()});staffPassword=String(saved?.password||sessionStorage.getItem(SESSION_PASSWORD_KEY)||'');if(code&&staffPassword){loginDeliveryApp(true)}else{showDeliveryLogin()}});
function showDeliveryLogin(message){$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('loginMessage').className='msg'+(message?' error':'');$('loginMessage').textContent=message||'';const target=$('loginCode').value.trim()?$('loginPassword'):$('loginCode');target.focus()}
function finishDeliveryLogin(r,code,password,remember){auth=Object.assign({},auth||{},{code,name:r.staff?.name||auth?.name||code,permissionLevel:String(r.staff?.level||auth?.permissionLevel||'')});sessionStorage.setItem(SESSION_PASSWORD_KEY,password);localStorage.setItem(CODE_KEY,code);if(remember)localStorage.setItem(DELIVERY_LOGIN_KEY,JSON.stringify({code,password}));else localStorage.removeItem(DELIVERY_LOGIN_KEY);currentStaffLevel=String(r.staff?.level||auth.permissionLevel||'');$('staff').textContent=(auth.name||code)+' さん';updateReportSettingsAccess();items=Array.isArray(r.items)?r.items:[];$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');renderSummary(r.summary||{});render();msg('')}
async function loginDeliveryApp(auto){const code=$('loginCode').value.trim(),password=$('loginPassword').value;const button=$('loginBtn');if(!code){showDeliveryLogin('講師番号を入力してください。');return}if(!password){showDeliveryLogin('パスワードを入力してください。');return}button.disabled=true;button.textContent=auto?'自動ログイン中…':'ログイン中…';auth=Object.assign({},auth||{},{code});staffPassword=password;try{const r=await api({action:'deliveryFailuresList'});finishDeliveryLogin(r,code,password,$('rememberLogin').checked)}catch(e){staffPassword='';sessionStorage.removeItem(SESSION_PASSWORD_KEY);localStorage.removeItem(DELIVERY_LOGIN_KEY);$('loginPassword').value='';$('rememberLogin').checked=true;showDeliveryLogin(auto?'保存済み情報でログインできませんでした。パスワードを確認してください。':e.message)}finally{button.disabled=false;button.textContent='ログイン'}}
function clearSavedLogin(){sessionStorage.removeItem(SESSION_PASSWORD_KEY);localStorage.removeItem(DELIVERY_LOGIN_KEY);staffPassword='';$('loginPassword').value='';$('rememberLogin').checked=true;showDeliveryLogin('この端末の保存情報を消しました。')}
function logoutDeliveryApp(){sessionStorage.removeItem(SESSION_PASSWORD_KEY);localStorage.removeItem(DELIVERY_LOGIN_KEY);localStorage.removeItem(AUTH_KEY);localStorage.removeItem(CODE_KEY);auth=null;items=[];location.replace(STAFF_APP_URL)}
async function api(data){let res;try{res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},data,{staffCode:auth.code,staffPassword})),redirect:'follow'})}catch(e){throw new Error('認証サーバーに接続できません。通信状況を確認してください。')}let out;try{out=await res.json()}catch(e){throw new Error('認証サーバーから正しい応答を受け取れませんでした。')}if(!res.ok)throw new Error('認証サーバーでエラーが発生しました。');if(!out.ok){const m=String(out.message||'');if(/パスワード|認証/.test(m))throw new Error('IDまたはパスワードが違います。');if(/権限/.test(m))throw new Error('このアカウントには利用権限がありません。');throw new Error(m||'処理に失敗しました。')}return out}
function msg(text,error){$('message').className='msg'+(error?' error':'');$('message').textContent=text||''}
async function loadItems(){try{msg('読み込み中…');const r=await api({action:'deliveryFailuresList',emailSearch:$('email').value,studentSearch:$('student').value,school:$('school').value,sourceSystem:$('source').value,event:$('event').value,state:$('state').value,confirmStatus:$('confirmStatus').value,unconfirmedOnly:$('unconfirmed').checked,stoppedOnly:$('stopped').checked,includeArchived:$('includeArchived').checked});currentStaffLevel=String(r.staff?.level||auth?.permissionLevel||currentStaffLevel||'');updateReportSettingsAccess();items=Array.isArray(r.items)?r.items:[];renderSummary(r.summary||{});render();msg('')}catch(e){items=[];renderSummary({});render();if(/IDまたはパスワード/.test(e.message)){sessionStorage.removeItem(SESSION_PASSWORD_KEY);localStorage.removeItem(DELIVERY_LOGIN_KEY);staffPassword='';$('loginPassword').value='';showDeliveryLogin('保存済みログイン情報が無効です。再ログインしてください。')}else{msg('不達メールデータを取得できませんでした。認証状態または通信状況を確認してください。 '+e.message,true)}}}
function updateReportSettingsAccess(){const allowed=['2','3','4'].includes(String(currentStaffLevel));$('reportSettingsButton').classList.toggle('hidden',!allowed)}
function reportEmailInputs(){return [1,2,3,4].map(i=>$('reportEmail'+i))}
async function openReportSettings(){const status=$('reportSettingsStatus');status.textContent='読み込み中…';$('reportSettingsDialog').showModal();try{const r=await api({action:'deliveryFailureReportSettingsGet'});const emails=Array.isArray(r.emails)?r.emails:[];reportEmailInputs().forEach((input,index)=>{input.value=emails[index]||''});status.textContent=''}catch(e){status.textContent='設定を読み込めませんでした。 '+e.message;status.className='reportSettingsStatus error'}}
async function saveReportSettings(){const button=$('saveReportSettingsButton'),status=$('reportSettingsStatus');const emails=[...new Set(reportEmailInputs().map(input=>input.value.trim().toLowerCase()).filter(Boolean))];if(!emails.length){status.textContent='報告先を1件以上入力してください。';status.className='reportSettingsStatus error';return}if(emails.some(email=>!/^\S+@\S+\.\S+$/.test(email))){status.textContent='正しいメールアドレスを入力してください。';status.className='reportSettingsStatus error';return}button.disabled=true;status.textContent='保存中…';status.className='reportSettingsStatus';try{const r=await api({action:'deliveryFailureReportSettingsSave',emails});reportEmailInputs().forEach((input,index)=>{input.value=(r.emails||[])[index]||''});status.textContent='保存しました。今後の不達メールは登録先へ報告されます。';status.className='reportSettingsStatus'}catch(e){status.textContent='保存できませんでした。 '+e.message;status.className='reportSettingsStatus error'}finally{button.disabled=false}}
function renderSummary(summary){const unconfirmed=Number(summary.unconfirmed)||0;$('count').textContent=unconfirmed;$('stoppedCount').textContent=Number(summary.stopped)||0;$('todayCount').textContent=Number(summary.today)||0;const badge=$('headerBadge');if(unconfirmed>0){badge.textContent=unconfirmed>99?'99+':String(unconfirmed);badge.style.display='inline-block'}else{badge.textContent='';badge.style.display='none'}}
function normalizeSource(v){return String(v||'').replace(/\u3000/g,'').trim().toUpperCase()}
function sourceLabel(v){v=normalizeSource(v);return v==='STEP_MESSAGE_CENTER'?'STEP配信':(v==='QR_ATTENDANCE'?'出退くんQR':'その他')}
function mailType(x){if(normalizeSource(x.sourceSystem)==='STEP_MESSAGE_CENTER')return x.subject||x.fields||x.mailType||'STEP配信';return x.mailType||((x.tags||'').includes('checkout')?'退室':'入室')}
function statusHtml(x){return `<span class="badge">${esc(x.state)}</span><br>${esc(x.confirmStatus)}${x.archived?'<br><span class="badge archiveBadge">アーカイブ済み</span>':''}`}
function actionHtml(x){return `<div class="actions"><button class="btn primary historyBtn" onclick="showHistory('${x.id}')">送信履歴</button><button class="btn" onclick="confirmItem('${x.id}')">確認済み</button><button class="btn archive" onclick="archiveItem('${x.id}')">非表示</button><button class="btn primary" onclick="resume('${x.id}',false)">送信再開</button><button class="btn danger" onclick="stopItem('${x.id}')">再停止</button><button class="btn" onclick="showDetail('${x.id}')">詳細</button></div>`}
function render(){const rows=items.map(x=>`<tr><td>${esc(x.email)}${x.stopped?'<div class="stopped">送信停止中</div>':''}</td><td>${fmt(x.occurredAt)}</td><td>${esc(x.reason||'-')}<br><small>発生 ${x.occurrenceCount||1}回</small></td><td>${esc(x.studentNames||'-')}</td><td>${esc(x.school||'-')}</td><td>${esc(sourceLabel(x.sourceSystem))}</td><td>${esc(mailType(x))}</td><td>${statusHtml(x)}</td><td>${actionHtml(x)}</td></tr>`).join('');$('rows').innerHTML=rows||'<tr><td colspan="9" class="empty">該当する不達記録はありません</td></tr>';$('cards').innerHTML=items.length?items.map(x=>`<article class="failureCard${x.archived?' archived':''}"><dl><dt>メールアドレス</dt><dd>${esc(x.email)}${x.stopped?'（送信停止中）':''}</dd><dt>送信元</dt><dd>${esc(sourceLabel(x.sourceSystem))}</dd><dt>メール区分</dt><dd>${esc(mailType(x))}</dd><dt>発生時刻</dt><dd>${fmt(x.occurredAt)}</dd><dt>理由</dt><dd>${esc(x.reason||'-')}</dd><dt>状態</dt><dd>${esc(x.state)}・${esc(x.confirmStatus)}${x.archived?'・アーカイブ済み':''}</dd></dl>${actionHtml(x)}</article>`).join(''):'<div class="card empty">該当する不達記録はありません</div>'}
const fmt=v=>v?new Date(v).toLocaleString('ja-JP'):'-';
async function confirmItem(id){try{await api({action:'deliveryFailureConfirm',id});await loadItems()}catch(e){msg(e.message,true)}}
async function archiveItem(id){if(!confirm('この不達記録を通常一覧から非表示にしますか？'))return;try{await api({action:'deliveryFailureArchive',id});await loadItems()}catch(e){msg(e.message,true)}}
async function stopItem(id){if(!confirm('このメールアドレスを再び送信停止にしますか？'))return;try{await api({action:'deliveryFailureStop',id});await loadItems()}catch(e){msg(e.message,true)}}
async function resume(id){const x=items.find(v=>v.id===id);if(x?.event==='spam'){showDetail(id);return}if(!confirm('不達管理上の送信停止を解除しますか？ Brevo側でブロックされている場合はAK=4による別の解除が必要です。'))return;try{const r=await api({action:'deliveryFailureResume',id});if(r.brevoUnblockRequired)msg('ローカルの送信停止を解除しました。Brevo側のブロック解除はAK=4で別途実行してください。');await loadItems()}catch(e){msg(e.message,true)}}
function historyStatusLabel(x){const status=String(x.status||'');if(x.kind==='error')return status||'エラー';if(x.delivered||/配信完了|delivered/i.test(status))return '配信完了';if(/SENT|送信完了|送信受付/i.test(status))return '送信受付';return status||'送信記録'}
function historyStatusClass(x){if(x.kind==='error')return 'fail';if(x.delivered||/配信完了|delivered/i.test(String(x.status||'')))return 'ok';return 'pending'}
function historyTypeLabel(x){if(x.kind==='error')return 'エラー '+(x.event||'error');return (x.mailType||'メール送信')+'メール'}
async function showHistory(id){try{msg('送信履歴を読み込み中…');const r=await api({action:'deliveryFailureDetail',id});const h=r.history||{};const list=Array.isArray(h.items)?h.items:[];const intro=`<div class="historyIntro"><b>${esc(h.email||'')}</b><br>基準日：${esc(h.anchorDay||'-')}<br>通常送信はエラー当日分と、それ以前の送信5回までを表示しています。過去のエラーは全${Number(h.errorCount)||0}件です。</div>`;const body=list.length?list.map(x=>`<article class="historyItem ${x.kind==='error'?'errorItem':''}"><div class="historyHead"><div><div class="historyTitle">${esc(historyTypeLabel(x))}</div><div class="historyTime">${fmt(x.occurredAt)}</div></div><span class="historyStatus ${historyStatusClass(x)}">${esc(historyStatusLabel(x))}</span></div><div class="historyMeta">${x.studentName?'生徒：'+esc(x.studentName)+'<br>':''}${x.subject?'件名：'+esc(x.subject)+'<br>':''}${x.finalAt?'最終更新：'+fmt(x.finalAt):''}</div>${x.reason?`<div class="historyReason">${esc(x.reason)}</div>`:''}</article>`).join(''):'<div class="empty">表示できる送信履歴はありません</div>';$('historyBody').innerHTML=intro+`<div class="historyList">${body}</div><p><small>「配信完了」は受信サーバーまで届いた状態です。実際の閲覧までは確認できません。</small></p>`;$('historyDialog').showModal();msg('')}catch(e){msg('送信履歴を取得できませんでした。 '+e.message,true)}}
async function showDetail(id){try{const r=await api({action:'deliveryFailureDetail',id});const x=r.item;let raw=x.rawJson;try{raw=JSON.stringify(JSON.parse(raw),null,2)}catch(e){}$('detailBody').innerHTML=`<div class="detailGrid"><b>メール</b><div>${esc(x.email)}</div><b>状態</b><div>${esc(x.state)} / ${x.stopped?'送信停止中':'送信可'}${x.archived?' / アーカイブ済み':''}</div><b>生徒</b><div>${esc(x.relatedStudents||'-').replace(/\n/g,'<br>')}</div><b>件名</b><div>${esc(x.subject||'-')}</div><b>理由</b><div>${esc(x.reason||'-')}</div><b>Message ID</b><div>${esc(x.messageId)}</div><b>照合ID</b><div>${esc(x.correlationId)}</div></div>${x.event==='spam'?`<div class="spamBox"><h3>迷惑メール報告の本人確認解除（AK=4のみ）</h3><label><input id="guardianConfirmed" type="checkbox"> 保護者本人へ確認済み</label><textarea id="confirmationDetails" placeholder="確認日時・確認方法・本人から得た同意内容を入力"></textarea><button class="btn warn" onclick="spamResume('${x.id}')">本人確認のうえ送信再開</button></div>`:''}<h3>Brevo元イベント</h3><div class="raw">${esc(raw)}</div>`;$('detail').showModal()}catch(e){msg(e.message,true)}}
async function spamResume(id){if(!$('guardianConfirmed').checked||!$('confirmationDetails').value.trim()){alert('本人確認済みのチェックと確認内容が必要です');return}if(!confirm('Brevoのspamブロックを解除して送信を再開しますか？'))return;try{await api({action:'deliveryFailureSpamResume',id,guardianConfirmed:true,confirmationDetails:$('confirmationDetails').value.trim()});$('detail').close();await loadItems()}catch(e){alert(e.message)}}
</script></body></html>
