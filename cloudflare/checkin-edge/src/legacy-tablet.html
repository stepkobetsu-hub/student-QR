<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17324d">
<title>入退室 | 軽量モード</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}video{width:100%;height:100%;object-fit:cover;-webkit-transform:scaleX(-1);transform:scaleX(-1)}
canvas{display:none}#frame{position:absolute;right:5%;bottom:15%;width:30%;height:38%;border:4px solid #fff;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.28),0 5px 18px rgba(0,0,0,.28)}
#frame span{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
#top{position:absolute;left:0;right:0;top:0;padding:16px;text-align:center;background:rgba(0,0,0,.55)}#clock{font-size:23px;font-weight:bold}
#mode{font-size:13px;margin-top:4px;color:#d6e7ff}#status{position:absolute;left:12px;bottom:12px;width:14px;height:14px;border-radius:50%;background:#45c879}
#message{position:absolute;left:4%;right:4%;bottom:4%;padding:10px;text-align:center;background:rgba(0,0,0,.7);border-radius:12px;font-size:15px}
#result{display:none;position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;overflow:hidden;background:#17324d}
#result.show{display:block}
#result.entry{color:#17324d;background:linear-gradient(145deg,#fff6a8 0%,#ffd84d 48%,#ffac4d 100%)}
#result.exit{color:#fff;background:radial-gradient(circle at 12% 16%,#fff 0 2px,transparent 3px),radial-gradient(circle at 29% 9%,#b8d8ff 0 2px,transparent 3px),radial-gradient(circle at 46% 23%,#fff 0 2px,transparent 3px),radial-gradient(circle at 71% 13%,#d8c7ff 0 2px,transparent 3px),linear-gradient(150deg,#061a45 0%,#102d67 58%,#28134f 100%)}
#result.exit:after{content:'';position:absolute;top:7%;right:8%;width:70px;height:70px;border-radius:50%;background:#fff2a8;box-shadow:-18px 8px 0 2px #0b2354}
#result.duplicate{color:#171717;background:linear-gradient(145deg,#ffe86b 0%,#ffc928 100%)}
#result.processing{color:#fff;background:linear-gradient(145deg,#075f73 0%,#188fa2 52%,#47c7b7 100%)}
#result.error{color:#fff;background:linear-gradient(145deg,#8f2430 0%,#c74444 100%)}
#resultContent{position:absolute;left:5%;top:18%;width:54%;padding:24px 18px;border-radius:26px;box-sizing:border-box;background:rgba(255,255,255,.88);box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:3}
#result.exit #resultContent,#result.error #resultContent{background:rgba(5,18,51,.78);border:2px solid rgba(255,255,255,.3)}
#result.processing #resultContent{left:19%;top:25%;width:62%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.42)}
#resultCharacter{display:none;position:absolute;right:1%;bottom:0;width:43%;height:84%;object-fit:contain;object-position:center bottom;z-index:2}
#result.teacher #resultCharacter{width:44%;height:94%}
#result.duplicate #resultCharacter{width:40%;height:80%}
#name{font-size:36px;font-weight:bold;line-height:1.2}#type{font-size:34px;font-weight:bold;margin-top:14px;line-height:1.25}#detail{font-size:17px;margin:15px 10px 0;line-height:1.5}
#result.processing #type{font-size:42px}#result.processing #detail{font-size:18px}
@media (max-width:720px){#frame{right:4%;width:32%;height:36%}#resultContent{left:3%;width:58%;padding:18px 12px}#name{font-size:29px}#type{font-size:29px}#detail{font-size:14px}}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="scanCanvas"></canvas>
  <canvas id="photoCanvas"></canvas>
  <div id="frame"><span>ここにQRをかざす</span></div>
  <div id="top"><div id="clock">--:--</div><div id="mode">古いタブレット用・軽量モード</div></div>
  <div id="status"></div>
  <div id="message">カメラを準備しています</div>
  <div id="result"><div id="resultContent"><div id="name"></div><div id="type"></div><div id="detail"></div></div><img id="resultCharacter" alt=""></div>
</div>
<script src="/legacy-jsqr.js"></script>
<script>
(function () {
  'use strict';
  var API_DEFAULT = 'https://step-checkin-edge-staging.stepkobetsu.workers.dev';
  var CONFIG_KEY = 'stepCheckinEdgeConfigV1';
  var DEVICE_KEY = 'stepCheckinEdgeDeviceIdV1';
  var FRAME_INTERVAL = 200;
  var REQUEST_TIMEOUT = 25000;
  var ASSET_BASE = 'https://stepkobetsu-hub.github.io/student-QR/assets/checkin/';
  var video = document.getElementById('video');
  var scanCanvas = document.getElementById('scanCanvas');
  var scanContext = scanCanvas.getContext('2d');
  var photoCanvas = document.getElementById('photoCanvas');
  var photoContext = photoCanvas.getContext('2d');
  var message = document.getElementById('message');
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  var nameEl = document.getElementById('name');
  var typeEl = document.getElementById('type');
  var detailEl = document.getElementById('detail');
  var resultCharacter = document.getElementById('resultCharacter');
  var config;
  var deviceId;
  var busy = false;
  var lastFrameAt = 0;
  var lastCode = '';
  var lastCodeAt = 0;
  var resultTimer = 0;
  var raf = window.requestAnimationFrame || function (callback) { return setTimeout(function () { callback(Date.now()); }, 40); };

  function parseParams(raw) {
    var values = {};
    var items = String(raw || '').replace(/^[?#]/, '').split('&');
    var i;
    var pair;
    var key;
    var value;
    for (i = 0; i < items.length; i += 1) {
      if (!items[i]) continue;
      pair = items[i].split('=');
      try {
        key = decodeURIComponent(pair.shift().replace(/\+/g, ' '));
        value = decodeURIComponent(pair.join('=').replace(/\+/g, ' '));
        values[key] = value;
      } catch (ignore) {}
    }
    return values;
  }

  function bootstrapConfig() {
    var params = parseParams(location.hash);
    var token = params.token;
    var apiUrl = params.api || API_DEFAULT;
    if (token && /^https:\/\//.test(apiUrl)) {
      try {
        localStorage.setItem(CONFIG_KEY, JSON.stringify({ campus: 'jinryo', token: token, apiUrl: apiUrl }));
        if (history && history.replaceState) history.replaceState(null, '', location.pathname + location.search);
      } catch (ignore) {}
    }
  }

  function loadConfig() {
    try {
      var value = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
      if (!value || !value.token || !/^https:\/\//.test(value.apiUrl)) return null;
      return { campus: 'jinryo', token: String(value.token), apiUrl: String(value.apiUrl) };
    } catch (ignore) {
      return null;
    }
  }

  function makeDeviceId() {
    return 'legacy-tablet-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function updateClock() {
    var now = new Date();
    var hours = String(now.getHours());
    var minutes = String(now.getMinutes());
    if (hours.length < 2) hours = '0' + hours;
    if (minutes.length < 2) minutes = '0' + minutes;
    document.getElementById('clock').innerHTML = hours + ':' + minutes;
  }

  function showError(text) {
    status.style.background = '#e34b4b';
    message.innerHTML = text;
  }

  function requestCamera(success, failure) {
    var modern = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
    var constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
    if (modern) {
      navigator.mediaDevices.getUserMedia(constraints).then(success, function () {
        navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(success, failure);
      });
      return;
    }
    if (legacy) {
      legacy.call(navigator, { video: true, audio: false }, success, failure);
      return;
    }
    failure({ message: 'このブラウザーはカメラに対応していません' });
  }

  function attachStream(stream) {
    try {
      if ('srcObject' in video) video.srcObject = stream;
      else video.src = (window.URL || window.webkitURL).createObjectURL(stream);
      var played = video.play();
      if (played && played.catch) played.catch(function () {});
      status.style.background = '#45c879';
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      raf(scanLoop);
    } catch (error) {
      showError('カメラ映像を表示できませんでした');
    }
  }

  function scanLoop(frameTime) {
    var width;
    var height;
    var scale;
    var image;
    var code;
    var now;
    if (!busy && frameTime - lastFrameAt >= FRAME_INTERVAL && video.readyState >= 2) {
      lastFrameAt = frameTime;
      width = video.videoWidth || 640;
      height = video.videoHeight || 480;
      scale = Math.min(1, 480 / width, 360 / height);
      scanCanvas.width = Math.max(1, Math.round(width * scale));
      scanCanvas.height = Math.max(1, Math.round(height * scale));
      try {
        scanContext.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);
        image = scanContext.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        code = window.jsQR ? window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'dontInvert' }) : null;
        if (code && code.data) {
          now = Date.now();
          if (code.data !== lastCode || now - lastCodeAt >= 5000) {
            lastCode = code.data;
            lastCodeAt = now;
            submitCode(code.data);
          }
        }
      } catch (ignore) {}
    }
    raf(scanLoop);
  }

  function validQr(value) {
    return /^(?:STEP-[A-Za-z0-9_-]{1,40}|[0-9]{12,64})$/.test(String(value || '').replace(/^\s+|\s+$/g, ''));
  }

  function receiptId() {
    return 'legacy-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  }

  function takePhoto() {
    var width = video.videoWidth || 640;
    var height = video.videoHeight || 480;
    var scale = Math.min(1, 280 / width);
    try {
      photoCanvas.width = Math.max(1, Math.round(width * scale));
      photoCanvas.height = Math.max(1, Math.round(height * scale));
      photoContext.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
      return photoCanvas.toDataURL('image/jpeg', 0.28);
    } catch (ignore) {
      return '';
    }
  }

  function submitCode(qrData) {
    var xhr;
    var id;
    var payload;
    if (busy) return;
    if (!validQr(qrData)) {
      displayResult(false, '', '', 'QRの形式が正しくありません');
      return;
    }
    if (!config) {
      displayResult(false, '', '', 'この端末の受付設定を読み込めません。画面を開き直してください');
      return;
    }
    busy = true;
    displayProcessing();
    message.innerHTML = '確認しています。初回の名簿更新には20秒ほどかかる場合があります';
    id = receiptId();
    payload = {
      campus: config.campus,
      qrKey: String(qrData).replace(/^\s+|\s+$/g, ''),
      receiptId: id,
      deviceId: deviceId,
      photoBase64: takePhoto(),
      clientTimings: { compatibilityMode: true }
    };
    xhr = new XMLHttpRequest();
    xhr.open('POST', String(config.apiUrl).replace(/\/$/, '') + '/v1/checkins', true);
    xhr.timeout = REQUEST_TIMEOUT;
    xhr.setRequestHeader('Authorization', 'Bearer ' + config.token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      var data;
      if (xhr.readyState !== 4) return;
      try { data = JSON.parse(xhr.responseText || '{}'); } catch (ignore) { data = {}; }
      if (xhr.status >= 200 && xhr.status < 300 && data.attendanceSaved) {
        displayResult(true, data.name || '', data.type || '', data.label || '', !!data.duplicate, !!data.isTeacher);
      } else if (data.code === 'UNAUTHORIZED') {
        displayResult(false, '', '', 'この端末の受付設定を確認してください');
      } else if (data.code === 'SUBJECT_NOT_FOUND') {
        displayResult(false, '', '', '同期名簿にQRがありません。生徒マスタのQRと在籍状態を確認してください');
      } else {
        displayResult(false, '', '', '通信に失敗しました。もう一度かざしてください');
      }
    };
    xhr.ontimeout = function () { displayResult(false, '', '', '確認に時間がかかりました。もう一度かざしてください'); };
    xhr.onerror = function () { displayResult(false, '', '', '通信できませんでした。接続を確認してください'); };
    try { xhr.send(JSON.stringify(payload)); } catch (error) { displayResult(false, '', '', '通信を開始できませんでした'); }
  }

  function clearCharacter() {
    resultCharacter.style.display = 'none';
    resultCharacter.removeAttribute('src');
  }

  function displayProcessing() {
    if (resultTimer) clearTimeout(resultTimer);
    clearCharacter();
    result.className = '';
    message.innerHTML = '確認しています。少しお待ちください';
  }

  function displayResult(ok, name, type, detail, duplicate, isTeacher) {
    var entry = type === '入室' || type === '出勤';
    var character = '';
    var suffix = isTeacher ? ' 先生' : ' さん';
    var actionText = '';
    if (resultTimer) clearTimeout(resultTimer);
    clearCharacter();
    if (ok) {
      result.className = 'show ' + (duplicate ? 'duplicate' : (entry ? 'entry' : 'exit')) + (isTeacher ? ' teacher' : '');
      if (duplicate) {
        character = isTeacher ? 'teacher-duplicate.png' : 'duplicate.png';
        actionText = '受付済みです';
      } else if (isTeacher) {
        character = entry ? 'teacher-arrival.png' : 'teacher-goodbye.png';
        actionText = entry ? '出勤しました' : '退勤しました';
      } else {
        character = entry ? 'welcome.png' : 'goodbye.png';
        actionText = entry ? '入室しました' : '退室しました';
      }
      resultCharacter.src = ASSET_BASE + character;
      resultCharacter.style.display = 'block';
      nameEl.innerHTML = escapeText(name) + suffix;
      typeEl.innerHTML = actionText;
      detailEl.innerHTML = duplicate ? '60秒以内の重複読取のため、記録とメール送信は追加していません' : escapeText(detail || '受付が完了しました');
    } else {
      result.className = 'show error';
      nameEl.innerHTML = '受付できませんでした';
      typeEl.innerHTML = '';
      detailEl.innerHTML = escapeText(detail || 'もう一度お試しください');
    }
    resultTimer = setTimeout(function () {
      result.className = '';
      clearCharacter();
      message.innerHTML = 'QRコードを右下の枠にかざしてください';
      busy = false;
    }, ok ? 2500 : 4000);
  }

  function escapeText(value) {
    return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  bootstrapConfig();
  config = loadConfig();
  try {
    deviceId = localStorage.getItem(DEVICE_KEY) || makeDeviceId();
    localStorage.setItem(DEVICE_KEY, deviceId);
  } catch (ignore) {
    deviceId = makeDeviceId();
  }
  updateClock();
  setInterval(updateClock, 1000);
  if (!window.jsQR) {
    showError('QR読取機能を読み込めませんでした');
  } else {
    requestCamera(attachStream, function (error) {
      showError('カメラを起動できませんでした。カメラ権限を確認してください');
    });
  }
})();
</script>
</body>
</html>
