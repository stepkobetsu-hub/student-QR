<title>講師用：新規QR発行・名札印刷 | 個別指導ステップ</title>
<style>
:root{--main:#2e7d5b;--bg:#f5f7f6;--border:#d8e0dc}*{box-sizing:border-box}body{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);margin:0;padding:28px;color:#333}.wrap{max-width:1000px;margin:auto}.head,.panel,.login{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 18px rgba(31,65,49,.06)}.head{padding:22px 28px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0;color:var(--main);font-size:24px}.sub{color:#888;font-size:14px;margin-top:5px}.user{font-size:13px;color:#777;display:flex;gap:10px;align-items:center}.panel{padding:28px 32px}.login{max-width:430px;margin:8vh auto;padding:24px}.login h1{font-size:20px;color:var(--main);margin:0 0 8px}.note{font-size:13px;color:#777;line-height:1.7}label{display:block;font-size:13px;font-weight:bold;margin:16px 0 6px;color:#555}input{width:100%;padding:12px;font-size:16px;border:1px solid var(--border);border-radius:8px;background:#fafcfb}button{min-width:180px;padding:12px 18px;margin-top:20px;border:0;border-radius:8px;background:var(--main);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{background:#b8c7c0}.logout{min-width:auto;margin:0;padding:9px 14px;background:#666;font-size:14px}.hint{font-size:12px;color:#999;margin-top:5px;line-height:1.5}.info{display:none;margin-top:10px;padding:10px 14px;background:#eef6f1;border-radius:8px}.info.show{display:block}.name{font-weight:bold;font-size:16px;color:var(--main)}.status{display:none;margin-top:16px;padding:20px 22px;border:2px solid #b9c8c1;border-radius:12px;background:#f5f8f6}.status.show{display:block}.status.current{border-color:#1769aa;background:#edf6ff}.status.none{border-color:#8da49a;background:#f2f7f4}.status.done{border-color:var(--main);background:#e8f5ec}.status-title{font-size:23px;font-weight:800;color:#193d58}.status-detail{margin-top:7px;color:#3b5261;line-height:1.6}.contacts{margin-top:12px;padding-top:12px;border-top:1px solid #cbdde8;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button{margin-top:20px}.current{background:#1769aa}.issue{background:#b5651d}.badge{display:inline-flex;min-width:180px;min-height:48px;margin-top:20px;padding:12px 18px;align-items:center;justify-content:center;border-radius:8px;color:#fff;background:#20357f;font-weight:bold;text-decoration:none}.msg{display:none;margin-top:14px;padding:12px;border-radius:8px;font-size:14px}.msg.ok{display:block;background:#e6f4ea;color:#1e7e34}.msg.err{display:block;background:#fdecea;color:#c0392b}.qr{display:none;margin-top:20px;padding:20px;border:2px solid var(--border);border-radius:10px;text-align:center}.qr.show{display:block}.pill{display:inline-block;margin-bottom:14px;padding:8px 18px;border-radius:999px;background:#1769aa;color:#fff;font-size:18px;font-weight:800}.pill.new{background:#b5651d}.school{font-size:15px;color:#2a5da0;font-weight:bold}.code{font-size:20px;color:#b5651d;font-weight:bold}.student{font-size:16px;color:var(--main);font-weight:bold;margin-bottom:10px}.qr img{width:160px;height:160px}.print{display:none;background:#6a4fa0}.pdf{display:none;margin-top:16px}.pdf button{background:#2a8f7a}.hide{display:none!important}@media(max-width:700px){body{padding:14px}.head{padding:18px;align-items:flex-start;flex-direction:column}.panel{padding:20px}.actions{flex-direction:column}.actions button,.badge{width:100%}}@media print{body{background:#fff;padding:0}.head,.panel h2,.panel>label,.panel>input,.panel>.hint,.panel>.info,.panel>.status,.panel>.actions,.panel>.msg,.print,.pdf{display:none!important}.panel{border:0;box-shadow:none;padding:0}.qr{display:block!important;border:2px solid #333;width:330px;margin:0 auto}.qr img{width:220px;height:220px}}
</style><style id="shared-sidebar-style">.page-shell{display:grid;grid-template-columns:228px minmax(0,1fr);gap:24px;align-items:start}.side-menu{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 5px 18px rgba(31,65,49,.06)}.side-menu a{display:block;text-decoration:none;color:var(--main);font-weight:700;background:#eef5f1;border:1px solid #d7e2dc;border-radius:8px;padding:14px;margin-bottom:10px;line-height:1.35}.side-menu a:last-child{margin-bottom:0}.side-menu a.active{background:var(--main);color:#fff}.content-main{min-width:0}@media(max-width:820px){.page-shell{grid-template-columns:1fr}.side-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.side-menu a{margin:0;text-align:center}}</style></head>
<body><div class="wrap">
<div id="login" class="login hide"><h1>講師用：新規QR発行・名札印刷</h1><div class="note">権限を持つスタッフ専用ページです。</div><form id="loginForm"><label>ID</label><input id="loginId" autocomplete="username" inputmode="numeric"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">ログイン</button><div id="loginMsg" class="msg"></div></form></div>
<div id="app" class="hide"><header class="head"><div><h1>講師用：新規QR発行・名札印刷</h1><div class="sub">講師用QRの確認・新規作成・印刷ができます</div></div><div class="user"><span id="userName"></span><button class="logout" id="logout">ログアウト</button></div></header>
<div class="page-shell"><nav class="side-menu" aria-label="管理機能メニュー"><a href="student_qr_register.html">入退くんＱＲ取込</a><a href="student_qr_register.html#check">生徒用QR確認・印刷</a><a href="student_qr_create.html">生徒用：新規QR発行</a><a class="active" href="teacher_qr_create.html">講師用：新規QR発行・名札印刷</a><a href="student_qr_register.html#email">通知先メール</a><a href="student_qr_register.html#points">ポイント付与</a><a href="student_qr_register.html#csv">勤怠CSV出力</a></nav><div class="content-main"><main class="panel"><h2 style="margin:0 0 22px;color:#234b3b;font-size:22px;border-bottom:1px solid #e7ece9;padding-bottom:14px">講師用：新規QR発行・名札印刷</h2><label>講師番号</label><input id="studentCode" placeholder="例: 1001" inputmode="numeric" autocomplete="off"><div class="hint">番号を入力すると、☆マスタにQRが登録済みか確認します。</div>
<div id="info" class="info"><div id="studentName" class="name"></div><div id="school"></div></div><div id="status" class="status"><div id="statusTitle" class="status-title"></div><div id="statusDetail" class="status-detail"></div><div id="contacts" class="contacts"></div></div>
<div class="actions"><button id="view" class="current">登録済みQRを表示</button><button id="issue" class="issue">講師用QRを作成して登録</button><a class="badge" href="https://step-name-badge.mintcocoajasmine.chatgpt.site" target="_blank" rel="noopener">🏷️ 名札発行</a></div><div id="message" class="msg"></div>
<div id="qr" class="qr"><div id="pill" class="pill"></div><div class="school">個別指導ステップ</div><div id="code" class="code"></div><div id="student" class="student"></div><img id="qrImg" alt="QRコード"></div><button id="print" class="print">🖨 このカードを印刷する</button>
<div id="pdf" class="pdf"><label>このQRをPDFでメール送信</label><input id="email" placeholder="送信先メールアドレス"><button id="send">📧 PDFをメールで送る</button><div id="pdfMsg" class="msg"></div></div></main></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbzYpm-16ahuZ3BRFKRT-iSvR9nThsYcTOhxplyBp4bZmVmehfTYZEEl18THzJasypOsTQ/exec',AUTH='https://script.google.com/macros/s/AKfycbypkUc0MqZ07E7pZRglNPeRM56WbCcuWaLpRzi9bVFcPklHDxaaLC7GfzG6ozTGCbEX/exec';const K={id:'studentQrLoginId',name:'studentQrLoginName',perm:'studentQrPermissionLevel',token:'studentQrSessionToken',exp:'studentQrSessionExpiresAt',logout:'studentQrExplicitlyLoggedOut'};const allowed=['2','3','4'];let session=null,timer=null,seq=0,student=null,qrData='',currentCode='';const $=id=>document.getElementById(id);
function setMsg(t,ok=false){$('message').textContent=t||'';$('message').className=t?'msg '+(ok?'ok':'err'):'msg'}function setLoginMsg(t){$('loginMsg').textContent=t||'';$('loginMsg').className=t?'msg err':'msg'}function saved(){const id=localStorage.getItem(K.id),token=localStorage.getItem(K.token);return id&&token?{loginId:id,name:localStorage.getItem(K.name)||'',permissionLevel:localStorage.getItem(K.perm)||'',sessionToken:token,expiresAt:localStorage.getItem(K.exp)||''}:null}function save(a){localStorage.setItem(K.id,a.loginId||a.code||'');localStorage.setItem(K.name,a.name||'');localStorage.setItem(K.perm,a.permissionLevel||'');localStorage.setItem(K.token,a.sessionToken||'');localStorage.setItem(K.exp,a.expiresAt||'');localStorage.removeItem(K.logout);session=a}function clear(x){localStorage.removeItem(K.token);localStorage.removeItem(K.exp);if(x)localStorage.setItem(K.logout,'1');session=null}async function auth(p){return(await fetch(AUTH,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})).json()}function norm(r,s){return{loginId:r.loginId||r.code||s?.loginId||'',name:r.name||s?.name||'',permissionLevel:String(r.permissionLevel||s?.permissionLevel||''),sessionToken:r.sessionToken||s?.sessionToken||'',expiresAt:r.expiresAt||s?.expiresAt||''}}function allowedAuth(r){return!!r?.success&&allowed.includes(String(r.permissionLevel||''))}async function loginDo(id,pw){try{const r=await auth({action:'studentQrLogin',code:id,password:pw});if(!allowedAuth(r)){clear(true);setLoginMsg('ID、パスワード、または利用権限を確認してください。');return false}save(norm(r,{loginId:id}));showApp();return true}catch(e){setLoginMsg('通信エラーが発生しました。');return false}}async function verify(s){try{const r=await auth({action:'studentQrVerify',sessionToken:s.sessionToken});if(!allowedAuth(r))return false;save(norm(r,s));showApp();return true}catch(e){return false}}function showLogin(){$('app').classList.add('hide');$('login').classList.remove('hide');$('loginId').value=localStorage.getItem(K.id)||''}function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');$('userName').textContent=session?.name?session.name+' / 権限'+session.permissionLevel:''}function jsonp(p){return new Promise((resolve,reject)=>{const cb='teacher_qr_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('通信エラー'))};s.src=API+'?'+new URLSearchParams({...p,staffLoginId:session.loginId,sessionToken:session.sessionToken,callback:cb});document.body.appendChild(s)})}
function reset(){clearTimeout(timer);$('info').classList.remove('show');$('status').className='status';$('statusTitle').textContent='';$('statusDetail').textContent='';$('contacts').textContent='';$('qr').classList.remove('show');$('print').style.display='none';$('pdf').style.display='none';$('view').disabled=false;$('issue').disabled=false;setMsg('');student=null;qrData='';currentCode=''}function showQR(notice){if(!student||!qrData)return setMsg('この講師には現行QRがありません。');$('pill').textContent='現行QR（現在有効）';$('pill').className='pill';$('code').textContent=student.code;$('student').textContent=student.name;$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData);$('qr').classList.add('show');$('print').style.display='block';$('print').textContent='🖨 現行QRを印刷する';$('pdf').style.display='block';currentCode=student.code;if(notice)setMsg('現在有効な「現行QR」を表示しています。',true)}function render(has){$('status').className='status show '+(has?'current':'none');$('statusTitle').textContent=has?'QRは登録済みです':'QRは未登録です';$('statusDetail').textContent=has?'☆マスタに登録済みのQRを下に表示しています。この画面からそのまま印刷できます。':'「講師用QRを作成して登録」を押すと、番号のQRを作成して保存します。';$('contacts').textContent='登録済みの連絡先：確認中...'}
async function lookup(){clearTimeout(timer);const code=$('studentCode').value.trim();reset();if(!code)return;$('info').classList.add('show');$('studentName').textContent='情報を確認中...';$('school').textContent='☆マスタを確認しています。';const n=++seq;timer=setTimeout(async()=>{try{const r=await jsonp({action:'getStudent',code});if(n!==seq)return;if(!r.ok){$('studentName').textContent='該当する番号が見つかりません';$('school').textContent=r.message||'';return setMsg(r.message||'情報を取得できませんでした。')}student={code,name:r.name||'(氏名なし)'};$('studentName').textContent=student.name;$('school').textContent=r.isTeacher?'講師':(r.school?r.school+'校':'');qrData=r.qrData||'';if(qrData){$('view').disabled=false;render(true);showQR(false)}else{$('issue').disabled=false;render(false)}try{const c=await jsonp({action:'getNotifyEmails',code});const a=[...new Set((c.emails||[]).map(v=>String(v||'').trim()).filter(Boolean))];$('contacts').textContent=a.length?'登録済みの連絡先：'+a.join(' ／ '):'登録済みの連絡先：なし'}catch(e){}}catch(e){if(n===seq)setMsg('通信エラーが発生しました。') }},350)}
async function issue(){const code=$('studentCode').value.trim();if(!code)return setMsg('講師番号を入力してください。');if(qrData)return showQR(false);const b=$('issue');b.disabled=true;b.textContent='発行中...';try{const r=await jsonp({action:'issueNewQr',code});if(!r.ok)return setMsg(r.message||'発行に失敗しました。');student={code,name:r.name||'(氏名なし)'};qrData=r.qrData||'';$('code').textContent=code;$('student').textContent=student.name;$('qrImg').src=r.qrImageUrl||('https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData));$('pill').textContent='新しく作成した講師用QR';$('pill').className='pill new';$('qr').classList.add('show');$('print').style.display='block';$('print').textContent='🖨 講師用QRを印刷する';$('pdf').style.display='block';currentCode=code;$('status').className='status show done';$('statusTitle').textContent='講師用QRを登録しました';$('statusDetail').textContent='下に表示しているQRを保存しました。このQRを印刷して使用してください。';$('view').disabled=!qrData;setMsg(r.name+' さんの講師用QRを作成しました。',true)}catch(e){setMsg('通信エラーが発生しました。')}finally{b.disabled=false;b.textContent='講師用QRを作成して登録'}}
async function sendPdf(){const email=$('email').value.trim();if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('pdfMsg').textContent='正しいメールアドレスを入力してください。';$('pdfMsg').className='msg err';return}if(!currentCode||!qrData)return;$('send').disabled=true;try{const blob=await fetch('https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(qrData)).then(r=>r.blob());const data=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(blob)});const doc=new jspdf.jsPDF();doc.setFontSize(12);doc.text('個別指導ステップ',10,15);doc.setFontSize(20);doc.text(currentCode,10,28);doc.setFontSize(16);doc.text(student.name,10,38);doc.addImage(data,'PNG',25,45,55,55);const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sendQrPdf',code:currentCode,toEmail:email,pdfBase64:doc.output('datauristring'),staffLoginId:session.loginId,sessionToken:session.sessionToken})}).then(x=>x.json());$('pdfMsg').textContent=r.ok?'PDFをメールで送信しました。':(r.message||'送信に失敗しました。');$('pdfMsg').className='msg '+(r.ok?'ok':'err')}catch(e){$('pdfMsg').textContent='PDF送信に失敗しました。';$('pdfMsg').className='msg err'}finally{$('send').disabled=false}}
$('studentCode').addEventListener('input',lookup);$('view').addEventListener('click',()=>showQR(true));$('issue').addEventListener('click',issue);$('print').addEventListener('click',()=>window.print());$('send').addEventListener('click',sendPdf);$('logout').addEventListener('click',()=>{clear(true);reset();showLogin()});$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('loginId').value.trim(),pw=$('password').value;if(!id||!pw)return setLoginMsg('IDとパスワードを入力してください。');$('loginBtn').disabled=true;await loginDo(id,pw);$('loginBtn').disabled=false});(async()=>{const s=saved();if(s&&localStorage.getItem(K.logout)!=='1'&&await verify(s))return;showLogin()})();
</script></body></html>
