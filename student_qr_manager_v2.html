<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e7d5b">
<title>生徒・講師QRコード管理（Ver.2） | 個別指導ステップ</title>
<style>
:root{--main:#2e7d5b;--blue:#1769aa;--bg:#f3f7f5;--line:#d6e2dc;--text:#20332a}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(180deg,#eaf5ef 0,#f7faf8 260px);color:var(--text)}
.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:28px 0 56px}
.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 28px;box-shadow:0 8px 28px rgba(35,75,59,.08)}
h1{margin:0;color:#234b3b;font-size:clamp(24px,4vw,36px)}
.sub{margin-top:8px;color:#71827a;line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 8px 28px rgba(35,75,59,.07);min-height:250px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(35,75,59,.12)}
.icon{font-size:48px;line-height:1}
.card h2{font-size:25px;margin:18px 0 8px;color:#234b3b}
.card p{margin:0;color:#687b72;line-height:1.7;flex:1}
.open{margin-top:22px;display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:11px;background:var(--main);color:#fff;font-weight:800;font-size:17px}
.teacher .open{background:var(--blue)}
.note{margin-top:20px;padding:15px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#64756d;line-height:1.6;font-size:14px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.head{padding:20px}.card{min-height:220px;padding:24px}}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
<h1>生徒・講師QRコード管理（Ver.2）</h1>
<div class="sub">QRコードの発行・変更を、生徒用と講師用に分けて操作します。</div>
</section>
<section class="cards">
<a class="card" href="student_qr_create.html">
<div class="icon">🎓</div>
<h2>生徒用QR</h2>
<p>生徒用QRの確認・発行・変更・印刷を行います。通知先メールの変更・追加もここから開けます。</p>
<div class="open">生徒用QR発行・変更を開く</div>
</a>
<a class="card teacher" href="teacher_qr_create.html">
<div class="icon">👨‍🏫</div>
<h2>講師用QR</h2>
<p>講師用QRの確認・発行・変更・印刷を行います。名札発行も利用できます。</p>
<div class="open">講師用QR発行・変更を開く</div>
</a>
</section>
<div class="note">「入退くんQR取込」「勤怠CSV出力」はVer.2の入口から外しました。ポイント付与は別アプリとして独立しています。</div>
</main>
</body>
</html>
